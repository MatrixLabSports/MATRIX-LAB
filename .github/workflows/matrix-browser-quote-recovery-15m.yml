name: MATRIX Browser Quote Recovery Queue 15m
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_matrix_browser_quote_recovery_queue.py
      - run: PYTHONPATH=. python -m tools.matrix_browser_quote_recovery_queue
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-browser-recovery
          git config user.email matrix-browser-recovery@users.noreply.github.com
          git add evidence/notifications/telegram/MATRIX_BROWSER_QUOTE_RECOVERY_QUEUE_LAST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence(telegram): persist browser quote recovery queue"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
