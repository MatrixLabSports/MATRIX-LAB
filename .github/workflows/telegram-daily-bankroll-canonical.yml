# PHYSICAL_RECOVERY_TRIGGER_20OCT2026_0715_BOGOTA
name: MATRIX Telegram Daily Bankroll Canonical

on:
  workflow_dispatch:
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_run:
    workflows:
      - "Telegram Señales Verdes MATRIX"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - .github/workflows/telegram-daily-bankroll-canonical.yml

permissions:
  contents: write

concurrency:
  group: telegram-daily-bankroll-canonical
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REAL_MONEY: BLOCKED
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tests
        run: python -m pip install pytest

      - name: Verify canonical table rules
        run: PYTHONPATH=. python -m pytest -q tests/test_telegram_daily_bankroll_canonical.py

      - name: Build canonical daily table
        run: PYTHONPATH=. python -m tools.telegram_daily_bankroll_canonical

      - name: Enforce canonical invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/notifications/telegram/MATRIX_TELEGRAM_DAILY_BANKROLL_CANONICAL_LAST.json")
          j=json.loads(p.read_text())
          s=j["summary"]
          assert s["status"]=="PASS"
          assert s["current_bankroll_cop"]==s["ledger_current_bankroll_cop"]
          rows=j["rows"]
          for a,b in zip(rows,rows[1:]):
              assert a["bankroll_closing_cop"]==b["bankroll_opening_cop"]
          assert j["policy"]["manual_silent_overwrite_forbidden"] is True
          assert j["policy"]["real_money"]=="BLOCKED"
          print(json.dumps(s,sort_keys=True))
          PY

      - name: Persist physical evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-telegram-daily-bankroll
          git config user.email matrix-telegram-daily-bankroll@users.noreply.github.com
          git add evidence/notifications/telegram/MATRIX_TELEGRAM_DAILY_BANKROLL_CANONICAL_LAST.json
          if git diff --cached --quiet; then
            echo "NO_CANONICAL_DAILY_TABLE_CHANGE"
          else
            git commit -m "evidence(telegram): persist canonical daily bankroll table"
            for attempt in 1 2 3 4; do
              git fetch origin repair/cor09-world-pipeline
              if ! git rebase origin/repair/cor09-world-pipeline; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
              sleep $((attempt*2))
            done
            exit 1
          fi
