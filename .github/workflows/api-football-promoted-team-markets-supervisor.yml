name: API-Football Promoted Team Markets Supervisor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-promoted-team-markets-supervisor.yml
  workflow_dispatch:
  schedule:
    - cron: "6,21,36,51 * * * *"

permissions:
  contents: write

concurrency:
  group: api-football-promoted-team-markets-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest requests
      - name: Verify supervisor protections
        run: python -m pytest -q tests/test_api_football_promoted_team_markets_supervisor.py
      - name: Run promoted market supervisor
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m tools.api_football_promoted_team_markets_supervisor
      - name: Enforce governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/api_football/promoted_team_markets/last_run.json").read_text())
          assert p["status"]=="PASS"
          assert p["odds_used_to_generate_probability"] is False
          assert p["automatic_wagering"] is False
          assert p["real_money"]=="BLOCKED"
          for lane in ("team_total_shots_home","team_total_shots_away","team_fouls_total"):
              s=json.loads((Path("evidence/api_football/promoted_team_markets")/lane/"state.json").read_text())
              assert s["real_money"]=="BLOCKED"
              for g in ("30","50","100","200"):
                  if s["gates"][g]["metrics_opened"]:
                      assert s["gates"][g]["status"]=="OPENED_AT_THRESHOLD"
          print("PROMOTED_TEAM_MARKETS_SUPERVISOR_GOVERNANCE: PASS")
          PY
      - name: Persist supervisor evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-promoted-supervisor"
          git config user.email "matrix-football-promoted-supervisor@users.noreply.github.com"
          git add evidence/api_football/promoted_team_markets
          if git diff --cached --quiet; then
            echo "NO_PROMOTED_TEAM_MARKET_CHANGE"
            exit 0
          fi
          git commit -m "evidence(football): persist promoted team-market supervisor"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline

