name: MATRIX Live Tennis FINAL Settlement

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/live_tennis_settlement_sync.py
      - .github/workflows/live-tennis-final-settlement.yml

permissions:
  contents: write

concurrency:
  group: live-tennis-final-settlement
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install requests

      - name: FINAL-only settlement sync
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVETENNISAPI_KEY }}
        run: |
          python -m tools.live_tennis_settlement_sync             --ledger evidence/live_tennis_lab/2026-10-06/MATRIX_LIVE_TENNIS_STATE_LEDGER_V0_1.json             --out evidence/live_tennis_lab/2026-10-06/MATRIX_LIVE_TENNIS_SETTLEMENT_SYNC_V0_1.json             --max-detail-queries 10             --reserve-calls 20

      - name: Validate anti-leakage settlement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=Path("evidence/live_tennis_lab/2026-10-06/MATRIX_LIVE_TENNIS_SETTLEMENT_SYNC_V0_1.json")
          l=Path("evidence/live_tennis_lab/2026-10-06/MATRIX_LIVE_TENNIS_STATE_LEDGER_V0_1.json")
          sj=json.loads(s.read_text())
          lj=json.loads(l.read_text())
          assert sj["protections"]["final_only"] is True
          assert sj["protections"]["retired_walkover_abandoned_not_silently_labeled"] is True
          assert sj["protections"]["real_money"]=="BLOCKED"
          labeled=[x for x in lj["states"] if x.get("label_opened") is True]
          pending=[x for x in lj["states"] if x.get("label_opened") is False]
          assert all(x.get("settlement_status")=="FINAL_STANDARD" for x in labeled)
          assert all(x.get("p1_match_win") in {0,1} for x in labeled)
          assert all(x.get("p1_match_win") is None for x in pending)
          print(json.dumps({
            "matches_seen":sj["match_ids_seen"],
            "departed":len(sj["departed_match_ids"]),
            "queried":len(sj["queried_match_ids"]),
            "settled_matches":len(sj["standard_final_settlements"]),
            "labeled_states":len(labeled),
            "pending_states":len(pending)
          },sort_keys=True))
          PY

      - name: Persist settlement evidence
        run: |
          git config user.name "matrix-live-tennis-settlement"
          git config user.email "matrix-live-tennis-settlement@users.noreply.github.com"
          git add evidence/live_tennis_lab/2026-10-06/MATRIX_LIVE_TENNIS_STATE_LEDGER_V0_1.json
          git add evidence/live_tennis_lab/2026-10-06/MATRIX_LIVE_TENNIS_SETTLEMENT_SYNC_V0_1.json
          if git diff --cached --quiet; then
            echo "NO_SETTLEMENT_CHANGE"
            exit 0
          fi
          git commit -m "evidence(live): persist FINAL-only tennis settlement sync"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
