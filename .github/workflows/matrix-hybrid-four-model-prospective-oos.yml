name: MATRIX Hybrid Elite Four Research Models OOS

on:
  workflow_dispatch:
  schedule:
    - cron: "59 2,8,14,20 * * *"
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/matrix_hybrid_four_model_research_oos.py
      - tests/test_matrix_hybrid_four_model_research_oos.py
      - tools/matrix_hybrid_original_dual_freeze_lineage.py
      - tests/test_matrix_hybrid_original_dual_freeze_lineage.py
      - tools/matrix_hybrid_three_model_research_oos.py
      - tests/test_matrix_hybrid_three_model_research_oos.py
      - .github/workflows/matrix-hybrid-four-model-prospective-oos.yml

permissions:
  contents: write

concurrency:
  group: matrix-hybrid-four-model-prospective-oos
  cancel-in-progress: false

jobs:
  oos-four-models:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTOMATIC_WAGERING: "false"
      HYBRID_AUTO_PROMOTION: DISABLED
    steps:
      - name: Checkout sealed prelabel research and authentic result archives
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools
            app
            tests
            evidence/matrix_hybrid_elite
            evidence/football_research_freezes
            evidence/football_world_inventory
            evidence/api_football/governance

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test four-way OOS and first/second original freeze lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = BLOCKED
          test "$AUTOMATIC_WAGERING" = false
          test "$HYBRID_AUTO_PROMOTION" = DISABLED
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=. python -m pytest -q \
            tests/test_matrix_hybrid_four_model_research_oos.py \
            tests/test_matrix_hybrid_original_dual_freeze_lineage.py \
            tests/test_matrix_hybrid_three_model_research_oos.py

      - name: Evaluate only same-fixture authenticated postmatch results
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_hybrid_four_model_research_oos
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/matrix_hybrid_elite/MATRIX_HYBRID_FOUR_MODEL_OOS_LAST.json")
          r=json.loads(p.read_bytes())
          assert r["schema"]=="MATRIX_HYBRID_FOUR_MODEL_RESEARCH_OOS_V1"
          assert r["physical_prelabeled_fixture_count"]>=37
          assert r["verified_original_dual_freeze_lineages"]==r["physical_prelabeled_fixture_count"]
          assert r["four_model_verified_settled_count"]==len(r["settled_rows"])
          assert r["three_model_upstream_rejected"]==0
          assert not r["four_model_rejected"],r["four_model_rejected"]
          assert r["original_p_matrix_official_probability_present"] is False
          assert r["model_superiority_claim_authorized"] is False
          assert r["automatic_model_promotion"] is False
          assert r["telegram_signal_authorized"] is False
          assert r["automatic_wagering"] is False
          assert r["real_money"]=="BLOCKED"
          print("MATRIX_HYBRID_FOUR_RESEARCH_SAME_FIXTURE",
                r["four_model_verified_settled_count"],
                "FUTURE",r["four_model_frozen_future_count"],
                "ILLEGAL_PROMOTION",False)
          PY

      - name: Persist four-way research-only scorecard and exact source lineage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          P="evidence/matrix_hybrid_elite/MATRIX_HYBRID_FOUR_MODEL_OOS_LAST.json"
          if [ ! -f "$P" ]; then echo NO_FOUR_WAY_OOS_EVIDENCE; exit 0; fi
          git config user.name matrix-hybrid-four-way-oos
          git config user.email matrix-hybrid-four-way-oos@users.noreply.github.com
          git add -- "$P"
          if git diff --cached --quiet; then echo FOUR_WAY_SCORECARD_UNCHANGED; exit 0; fi
          git commit -m "evidence(hybrid): four-way SHA-proven prospective model research scoring"
          for retry in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep "$retry"
          done
          exit 1
