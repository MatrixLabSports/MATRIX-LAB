# manual trigger: SofaScore identity remediation 2026-10-05
name: COR02-03 governed batch freeze
# MATRIX_AUTONOMOUS_CADENCE_V1: every 2h, governed fail-closed

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cor0203-holdout-repair-cor09-world-pipeline
  cancel-in-progress: false

jobs:
  batch-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install governed test dependency
        run: python -m pip install pytest

      - name: Run tennis integrity regression suite
        run: |
          python -m pytest -q \
            tests/test_cor0203_bogota_full_day_calendar.py \
            tests/test_cor0203_primary_source_readiness.py \
            tests/test_cor0203_eight_day_rapidapi_discovery.py \
            tests/test_tennis_world_inventory_rapidapi.py \
            tests/test_cor0203_world_inventory_discovery.py \
            tests/test_cor0203_world_inventory_bridge.py \
            tests/test_cor0203_world_funnel_audit.py \
            tests/test_cor0203_rapidapi_durable_discovery.py \
            tests/test_cor0203_rapidapi_stats_rich_history_probe.py \
            tests/test_cor0203_expand_identity_authority.py \
            tests/test_cor0203_build_identity_crosswalk.py \
            tests/test_cor0203_identity_restage_delta.py \
            tests/test_cor0203_preregister_discovery.py \
            tests/test_cor0203_batch_preflight.py \
            tests/test_cor0203_physical_uniqueness.py \
            tests/test_cor0203_settlement_sync.py \
            tests/test_cor0203_settlement_identity_overlay.py \
            tests/test_cor0203_apply_adjudications.py \
            tests/test_cor0203_historical_identity_reconcile.py \
            tests/test_cor0203_production_observability.py

      - name: Record trigger and physical checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin repair/cor09-world-pipeline
          git checkout repair/cor09-world-pipeline
          git reset --hard origin/repair/cor09-world-pipeline
          TRIGGER_SHA="$GITHUB_SHA"
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          echo "TRIGGER_SHA=$TRIGGER_SHA" >> "$GITHUB_ENV"
          echo "CHECKOUT_SHA=$CHECKOUT_SHA" >> "$GITHUB_ENV"
          echo "Original trigger SHA: $TRIGGER_SHA"
          echo "Latest physical operational SHA: $CHECKOUT_SHA"

      - name: Run shared governed production cycle
        shell: bash
        env:
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
          # Active architecture: SofaScore -> Flashscore -> RapidAPI Tennis.
          # API-Tennis is RETIRED_COST_UTILITY_DECISION and is not required.
          MATRIX_TENNIS_MODE: rapidapi_primary_open_reconciliation
          MATRIX_TARGET_BRANCH: repair/cor09-world-pipeline
          MATRIX_GIT_USER_NAME: matrix-ci
          MATRIX_GIT_USER_EMAIL: matrix-ci@users.noreply.github.com
        run: |
          set -euo pipefail
          bash scripts/cor0203_production_cycle.sh --trigger-sha "$CHECKOUT_SHA"
