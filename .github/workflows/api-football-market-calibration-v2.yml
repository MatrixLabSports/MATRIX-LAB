name: API Football Market Calibration V2

on:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - "evidence/api_football/prospective_calibration/ledger.jsonl"
      - "tools/api_football_market_calibration_v2_sync.py"
      - "tests/test_api_football_market_calibration_v2.py"
      - ".github/workflows/api-football-market-calibration-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-football-market-calibration-v2
  cancel-in-progress: false

jobs:
  sync-separated-market-ledgers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Verify separation contract
        run: pytest -q tests/test_api_football_market_calibration_v2.py

      - name: Sync V2 market ledgers
        run: python tools/api_football_market_calibration_v2_sync.py

      - name: Persist V2 evidence if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/api_football/calibration_v2/lanes
          if git diff --cached --quiet; then
            echo "No V2 market-ledger changes."
            exit 0
          fi
          git commit -m "evidence(football): sync separated market calibration v2"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              echo "REBASE_CONFLICT_ABORTING"
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then
              echo "PUSH_SUCCEEDED_ATTEMPT=${attempt}"
              exit 0
            fi
            echo "PUSH_RACE_RETRY_ATTEMPT=${attempt}"
            sleep $((attempt * 2))
          done
          echo "PUSH_RETRY_BUDGET_EXHAUSTED"
          exit 1
