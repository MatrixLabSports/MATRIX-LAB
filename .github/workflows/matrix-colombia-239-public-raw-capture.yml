name: MATRIX Colombia 239 Public Raw Capture
on:
  workflow_dispatch:
    inputs:
      day:
        description: "Calendar date YYYY-MM-DD; separate from kickoff-time certification"
        required: true
        default: "2026-11-22"
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/matrix_colombia_239_public_raw_capture.py
      - tools/matrix_football_espn_enriched_pit_research.py
      - tests/test_matrix_football_espn_enriched_pit_research.py
      - tests/test_matrix_colombia_239_public_raw_capture.py
      - .github/workflows/matrix-colombia-239-public-raw-capture.yml
permissions:
  contents: read
jobs:
  research-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/matrix_colombia_239_public_raw_capture.py
            tests/test_matrix_colombia_239_public_raw_capture.py
            tools/matrix_football_espn_enriched_pit_research.py
            tests/test_matrix_football_espn_enriched_pit_research.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Verify raw source safety contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_matrix_colombia_239_public_raw_capture.py tests/test_matrix_football_espn_enriched_pit_research.py
      - name: Capture two public sources without authorizing signals
        shell: bash
        env:
          REQUESTED_DAY: ${{ github.event.inputs.day || '2026-11-22' }}
        run: |
          ESPN_DAY=$(python -c 'import sys; from datetime import date,timedelta; print((date.fromisoformat(sys.argv[1])-timedelta(days=1)).isoformat())' "$REQUESTED_DAY")
          PYTHONPATH=. python -m tools.matrix_colombia_239_public_raw_capture --day "$REQUESTED_DAY" --espn-day "$ESPN_DAY" --out evidence/research/colombia239
      - name: Extract SHA-verified enriched ESPN history for future PIT-only research
        shell: bash
        run: |
          PYTHONPATH=. python -m tools.matrix_football_espn_enriched_pit_research \
            --capture-report evidence/research/colombia239/MATRIX_COLOMBIA_239_PUBLIC_RAW_CAPTURE_LAST.json \
            --league-id 239 \
            --out evidence/research/colombia239/MATRIX_ESPN_ENRICHED_PIT_HISTORY_LAST.json
      - name: Check physical SHA evidence and closed gate
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          p=Path("evidence/research/colombia239/MATRIX_COLOMBIA_239_PUBLIC_RAW_CAPTURE_LAST.json")
          report=json.loads(p.read_bytes())
          assert report["production_p_matrix_authorized"] is False
          assert report["telegram_signal_authorized"] is False
          assert report["real_money"] == "BLOCKED"
          for source in report["sources"].values():
              if source["status"] != "AUTHENTIC_RAW_CAPTURE_RESEARCH_ONLY":
                  continue
              payload=(p.parent/source["raw_archive_path"]).read_bytes()
              assert hashlib.sha256(payload).hexdigest()==source["raw_sha256"]
              assert len(payload)==source["raw_bytes"]
          print(json.dumps({"physical_sha_verified":report["raw_verified_source_count"],
                            "signals_authorized":False},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-colombia239-raw-research
          path: evidence/research/colombia239/
          if-no-files-found: warn
          retention-days: 30
