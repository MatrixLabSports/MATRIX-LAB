name: MATRIX Live Tennis FAIR FINAL Offline Contract
on:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/live_tennis_settlement_sync.py
      - tests/test_live_tennis_fair_final_settlement.py
      - .github/workflows/live-tennis-fair-final-unit-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: No external provider use, no real money, no signals
        run: |
          python -m pip install -q pytest requests
          python -m pytest -q tests/test_live_tennis_fair_final_settlement.py
          python - <<'PY'
          from tools.live_tennis_settlement_sync import fair_departed_queue
          assert fair_departed_queue([3, 1, 2], {1:4, 2:0, 3:1}, {1,3}) == [2,3,1]
          print("MATRIX_FAIR_FINAL_QUOTA_UNCHANGED_AND_NO_API_USED=PASS")
          PY
