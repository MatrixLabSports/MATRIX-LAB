name: MATRIX 42 Market Activation Guard 15m

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: matrix-42-market-activation-15m
  cancel-in-progress: false

jobs:
  activation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Certify 42-lane contract
        run: PYTHONPATH=. python -m pytest -q tests/test_matrix_42_market_activation_guard.py
      - name: Rebuild current activation state
        run: PYTHONPATH=. python -m tools.matrix_42_market_activation_guard
      - name: Persist activation evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-42-market-activation
          git config user.email matrix-42-market-activation@users.noreply.github.com
          git add evidence/governance/MATRIX_42_MARKET_ACTIVATION_LAST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence(markets): persist 42-lane activation state"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if git rebase origin/repair/cor09-world-pipeline && git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            git rebase --abort || true
          done
          exit 1
