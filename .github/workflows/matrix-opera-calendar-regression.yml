name: MATRIX Opera Calendar Regression Independent
on:
  workflow_dispatch:
  push:
    branches: [repair/cor09-world-pipeline]
    paths:
      - tools/matrix_opera_calendar_handoff.py
      - tools/matrix_flashscore_opera_link_handoff.py
      - tools/matrix_calendar_browser_observations.py
      - tools/matrix_football_sofa_fixture_crosscheck.py
      - tests/test_matrix_opera_calendar_handoff.py
      - tests/test_matrix_opera_real_snapshot_replay.py
      - evidence/browser_capture_inbox/opera_football/2026-11-06/**
      - tests/test_matrix_flashscore_opera_link_handoff.py
      - .github/workflows/matrix-opera-calendar-regression.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no wagering
        run: test "$REAL_MONEY" = BLOCKED && test "$AUTO_BETTING" = DISABLED
      - name: Install regression runner
        run: python -m pip install pytest
      - name: Execute strict stale-evidence and Flashscore discovery regressions
        run: python -m pytest -q tests/test_matrix_opera_calendar_handoff.py tests/test_matrix_opera_real_snapshot_replay.py tests/test_matrix_flashscore_opera_link_handoff.py
      - name: Verify no tracked production files modified
        run: |
          git diff --exit-code -- evidence/api_football evidence/notifications/telegram
