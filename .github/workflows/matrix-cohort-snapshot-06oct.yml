name: MATRIX 06-OCT governed snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: matrix-06oct-snapshot
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile physically, fail closed on governance
        run: python scripts/matrix_settlement_snapshot_auto.py
      - name: Commit only changed physical evidence
        shell: bash
        run: |
          set -euo pipefail
          file=evidence/daily_selection/MATRIX_SETTLEMENT_PROGRESS_20261006_BOGOTA_AUTOMATED.json
          git add -- "$file"
          if git diff --cached --quiet; then
            echo 'NO_CHANGE: no commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'evidence: automated 06-OCT settlement snapshot'
          git push origin HEAD:repair/cor09-world-pipeline
      - name: Verify committed file
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin repair/cor09-world-pipeline
          git show origin/repair/cor09-world-pipeline:evidence/daily_selection/MATRIX_SETTLEMENT_PROGRESS_20261006_BOGOTA_AUTOMATED.json >/tmp/matrix_snapshot_verified.json
          python -m json.tool /tmp/matrix_snapshot_verified.json >/dev/null
          echo 'VERIFIED: committed snapshot readable from remote'
