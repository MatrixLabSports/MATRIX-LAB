name: MATRIX Browser Windows Runtime Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/matrix-browser-windows-runtime-preflight.yml

permissions:
  contents: read

concurrency:
  group: matrix-browser-windows-runtime-preflight
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: [self-hosted, windows, matrix-browser-odds]
    timeout-minutes: 5
    steps:
      - name: Read Python commands and installed versions without changing Windows
        shell: cmd
        run: |
          echo MATRIX_RUNTIME_DIAGNOSTIC_START
          where python || echo PYTHON_COMMAND_NOT_FOUND
          where py || echo PYTHON_LAUNCHER_NOT_FOUND
          python --version || echo PYTHON_RUN_NOT_AVAILABLE
          py -3.11 --version || echo PY_311_NOT_AVAILABLE
          python -m pip --version || echo PIP_NOT_AVAILABLE
          where pwsh || echo POWERSHELL_7_NOT_AVAILABLE
          echo MATRIX_RUNTIME_DIAGNOSTIC_END
          exit /B 0

      - name: Read execution policy and supported PowerShell shell without changing it
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "Get-ExecutionPolicy -List | Format-Table -AutoSize"
          powershell.exe -NoProfile -NonInteractive -Command "$PSVersionTable.PSVersion.ToString()"

      - name: Check TCP port 9222 without credentials or browser automation
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -Command "Get-NetTCPConnection -LocalPort 9222 -State Listen -ErrorAction SilentlyContinue | Select-Object LocalAddress,LocalPort,State"
          echo NO_TELEGRAM_MESSAGES_NO_BETTING
