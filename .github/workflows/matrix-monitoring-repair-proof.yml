# MATRIX_PHYSICAL_TRIGGER 2026-10-24 monitoring-repair-proof-rerun
name: MATRIX Monitoring Repair Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/matrix-monitoring-repair-proof.yml

permissions:
  contents: write

concurrency:
  group: matrix-monitoring-repair-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install proof dependencies
        run: python -m pip install pytest requests

      - name: Run permanent anti-regression tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_monitoring_scheduler_contracts.py \
            tests/test_telegram_monitoring_watchdog.py \
            tests/test_telegram_quote_recovery_window.py \
            tests/test_football_clv_tracking_cycle.py \
            tests/test_football_clv_odds_api_net_capture.py

      - name: Validate required secrets without exposing values
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_NET_KEY: ${{ secrets.ODDS_API_NET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$API_FOOTBALL_KEY"
          test -n "$ODDS_API_NET_KEY"
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          echo "MONITORING_REPAIR_REQUIRED_SECRETS_PRESENT=PASS"

      - name: Build physical proof artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          watchdog_path=Path("evidence/notifications/telegram/MATRIX_TELEGRAM_MONITORING_WATCHDOG_LAST.json")
          clv_state_path=Path("evidence/clv/football/over_2_5/state.json")
          telegram_workflow=Path(".github/workflows/telegram-matrix-supervisor-15m.yml").read_text(encoding="utf-8")
          clv_workflow=Path(".github/workflows/football-clv-continuous-watcher.yml").read_text(encoding="utf-8")

          watchdog=json.loads(watchdog_path.read_text(encoding="utf-8"))
          clv=json.loads(clv_state_path.read_text(encoding="utf-8"))
          summary=watchdog.get("summary") or {}

          assert summary.get("status")=="PASS"
          assert int(summary.get("new_monitoring_breaches") or 0)==0
          assert int(summary.get("critical_unresolved_candidates") or 0)==0
          assert 'cron: "*/15 * * * *"' in telegram_workflow
          assert "ODDS_API_NET_KEY" in telegram_workflow
          assert "python -m tools.telegram_monitoring_watchdog" in telegram_workflow
          assert "cancel-in-progress: false" in clv_workflow
          assert "CLV_NO_NEW_MISSED_AFTER_KICKOFF=PASS" in clv_workflow
          assert "CLV_WATCHER_HEARTBEAT_PERSISTED=PASS" in clv_workflow
          assert "python -m tools.football_clv_odds_api_net_capture" in clv_workflow
          assert clv["protections"]["real_money"]=="BLOCKED"
          assert clv["protections"]["automatic_wagering"] is False
          assert clv["closing_freshness_policy"]["max_provider_quote_age_seconds"]==120

          operational_head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          payload={
              "schema":"MATRIX_CLV_TELEGRAM_MONITORING_REPAIR_PROOF_V1",
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "operational_head_at_proof":operational_head,
              "tests":"PASS",
              "required_secrets_present":True,
              "telegram":{
                  "watchdog_status":summary.get("status"),
                  "new_monitoring_breaches":int(summary.get("new_monitoring_breaches") or 0),
                  "critical_unresolved_candidates":int(summary.get("critical_unresolved_candidates") or 0),
                  "active_future_candidates":int(summary.get("active_future_candidates") or 0),
                  "scheduler_15m_contract":True,
                  "odds_api_net_injected":True,
                  "watchdog_persisted_each_cycle":True,
              },
              "clv":{
                  "historical_missed_after_kickoff_baseline":int((clv.get("closing_cycle") or {}).get("missed_after_kickoff") or 0),
                  "closing_odds_count":int(clv.get("closing_odds_count") or 0),
                  "remaining_to_300":int(clv.get("remaining_to_open_metrics") or 0),
                  "cancel_in_progress":False,
                  "no_new_miss_fail_closed_guard":True,
                  "physical_heartbeat_contract":True,
                  "odds_api_net_preferred":True,
                  "api_football_fallback":True,
                  "strict_fresh_gate_seconds":120,
              },
              "protections":{
                  "real_money":"BLOCKED",
                  "automatic_wagering":False,
                  "no_backfill":True,
              },
              "result":"PASS",
          }
          out=Path("evidence/audit/MATRIX_CLV_TELEGRAM_MONITORING_REPAIR_PROOF_LAST.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(payload,sort_keys=True))
          PY

      - name: Persist proof to operational branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-monitoring-repair-proof
          git config user.email matrix-monitoring-repair-proof@users.noreply.github.com
          git add evidence/audit/MATRIX_CLV_TELEGRAM_MONITORING_REPAIR_PROOF_LAST.json
          git commit -m "evidence(audit): certify CLV Telegram monitoring repair"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ "$conflicts" = "evidence/audit/MATRIX_CLV_TELEGRAM_MONITORING_REPAIR_PROOF_LAST.json" ]; then
                git checkout --theirs -- evidence/audit/MATRIX_CLV_TELEGRAM_MONITORING_REPAIR_PROOF_LAST.json
                git add evidence/audit/MATRIX_CLV_TELEGRAM_MONITORING_REPAIR_PROOF_LAST.json
                GIT_EDITOR=true git rebase --continue
              else
                git rebase --abort || true
                exit 1
              fi
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then
              echo "MONITORING_REPAIR_PROOF_PUSH=PASS"
              exit 0
            fi
            sleep $((attempt*2))
          done
          exit 1
