# PHYSICAL_REFRESH_REQUEST_20OCT2026_CURRENT
# PHYSICAL_RECOVERY_TRIGGER_20OCT2026_0715_BOGOTA
# VERIFY_CONTROLS_20OCT2026_1055UTC
# MATRIX_PHYSICAL_RECHECK 2026-10-20 post-calibration-3555
name: MATRIX Football 4000 Canonical Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "10,25,40,55 * * * *"
  workflow_run:
    workflows:
      - "API-Football prospective FINAL-only settlement"
      - "API-Football prospective calibration gates 30-50-100"
      - "API-Football prospective market freeze"
      - "MATRIX Football Daily Governed Pipeline"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - .github/workflows/football-4000-canonical-tracker.yml

permissions:
  contents: write

concurrency:
  group: football-4000-canonical-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REAL_MONEY: BLOCKED
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Verify canonical counter rules
        run: PYTHONPATH=. python -m pytest -q tests/test_football_4000_canonical_tracker.py

      - name: Build canonical 4000 tracker
        run: PYTHONPATH=. python -m tools.football_4000_canonical_tracker

      - name: Enforce physical reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/api_football/governance/MATRIX_FOOTBALL_4000_CANONICAL_TRACKER_LAST.json")
          j=json.loads(p.read_text())
          g=j["global"]
          assert g["frozen_event_count"] == g["valid_final_settlement_count"] + g["pending_count"] + g["blocked_count"]
          assert g["valid_final_settlement_count"] == g["calibration_observation_count"]
          assert j["counter_precedence"]["target_4000"] == "global.valid_final_settlement_count"
          assert j["governance"]["real_money"] == "BLOCKED"
          print(json.dumps(g,sort_keys=True))
          PY

      - name: Persist canonical evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-football-4000-tracker
          git config user.email matrix-football-4000-tracker@users.noreply.github.com
          git add evidence/api_football/governance/MATRIX_FOOTBALL_4000_CANONICAL_TRACKER_LAST.json
          if git diff --cached --quiet; then
            echo "NO_TRACKER_CHANGE"
            exit 0
          fi
          git commit -m "evidence(football): persist canonical 4000 tracker"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
