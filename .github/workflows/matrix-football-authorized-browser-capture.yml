name: MATRIX Football Authorized Visible Browser Capture

on:
  workflow_dispatch:
  schedule:
    # Best-effort scheduling; timestamp freshness is checked independently.
    - cron: "11,41 * * * *"
  push:
    branches:
      - main
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/matrix-football-authorized-browser-capture.yml
      - tools/matrix_football_windows_browser_calendar_capture.py
      - tests/test_matrix_football_windows_browser_calendar_capture.py

permissions:
  contents: write

concurrency:
  group: matrix-football-authorized-visible-browser-capture
  cancel-in-progress: false

jobs:
  browser-first-research:
    runs-on: [self-hosted, windows, matrix-browser-odds]
    timeout-minutes: 20
    env:
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - name: Checkout governed operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Require approved Python and money protections
        shell: cmd
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3,11)"
          if errorlevel 1 exit /B 1
          if not "%REAL_MONEY%"=="BLOCKED" exit /B 1
          if not "%AUTO_BETTING%"=="DISABLED" exit /B 1

      - name: Install browser-only test dependencies
        shell: cmd
        run: |
          python -m pip install --disable-pip-version-check pytest playwright tzdata
          if errorlevel 1 exit /B 1

      - name: Prove strict source/date anti-admission contracts
        shell: cmd
        run: |
          python -m pytest -q tests/test_matrix_football_windows_browser_calendar_capture.py
          if errorlevel 1 exit /B 1

      - name: Connect only to user-authorized visible CDP browser
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools\windows\start_matrix_browser_cdp.ps1 -Port 9222
          if errorlevel 1 exit /B 1

      - name: Read current and next Bogotá day visible SofaScore Flashscore calendars
        shell: cmd
        run: |
          python -m tools.matrix_football_windows_browser_calendar_capture
          if errorlevel 1 exit /B 1

      - name: Persist source receipts and historical capture bytes before adjudicating coverage
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "matrix-football-visible-browser"
          git config user.email "matrix-football-visible-browser@users.noreply.github.com"
          git add -- evidence/football_calendar_physical
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "NO_NEW_BROWSER_SOURCE_BYTES"
          } else {
            git commit -m "evidence(football): persist authorized visible browser source research"
            if ($LASTEXITCODE -ne 0) { throw "BROWSER_RESEARCH_COMMIT_FAILED" }
            $pushed=$false
            for ($attempt=1; $attempt -le 4; $attempt++) {
              git fetch origin repair/cor09-world-pipeline
              if ($LASTEXITCODE -ne 0) { throw "BROWSER_RESEARCH_FETCH_FAILED" }
              git rebase origin/repair/cor09-world-pipeline
              if ($LASTEXITCODE -ne 0) {
                git rebase --abort
                throw "BROWSER_RESEARCH_REBASE_CONFLICT"
              }
              git push origin HEAD:repair/cor09-world-pipeline
              if ($LASTEXITCODE -eq 0) { $pushed=$true; break }
              Start-Sleep -Seconds (2*$attempt)
            }
            if (-not $pushed) { throw "BROWSER_RESEARCH_PUSH_FAILED" }
          }

      - name: Require real links from both sources before declaring capture usable
        shell: cmd
        run: |
          python -c "import json; from pathlib import Path; d=json.loads(Path('evidence/football_calendar_physical/MATRIX_BROWSER_CAPTURE_CYCLE_LAST.json').read_text(encoding='utf-8')); assert d['real_money']=='BLOCKED' and d['provider_api_calls']==0 and d['canonical_prematch_inputs_authorized'] is False; by_day={day:{x['source'] for x in d['results'] if x['day']==day and x['status']=='VISIBLE_RESEARCH_CAPTURE_PERSISTED'} for day in d['days']}; print('REAL_BROWSER_RESEARCH_BY_DATE='+json.dumps({k:sorted(v) for k,v in by_day.items()},sort_keys=True)); assert any(v=={'SOFASCORE','FLASHSCORE'} for v in by_day.values()), 'NO_SAME_DAY_TWO_SOURCE_VISIBLE_RESEARCH_CAPTURE_FAIL_CLOSED'"
          if errorlevel 1 exit /B 1
