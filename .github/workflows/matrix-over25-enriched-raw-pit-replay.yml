name: MATRIX Over25 Archived Enriched Versus Raw PIT Replay

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/matrix_over25_enriched_vs_group_parity.py
      - tests/test_matrix_over25_enriched_vs_group_parity.py
      - tools/matrix_persist_over25_pit_parity.py
      - .github/workflows/matrix-over25-enriched-raw-pit-replay.yml

permissions:
  contents: write

concurrency:
  group: matrix-over25-enriched-raw-pit-replay
  cancel-in-progress: false

jobs:
  archived-parity:
    runs-on: [self-hosted, windows, matrix-browser-odds]
    timeout-minutes: 18
    env:
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
      MATRIX_MODE: SHADOW
      PYTHONPATH: .
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout immutable archived data and operative code
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Verify local Python and hard financial gates
        run: |
          python -c "import sys; assert sys.version_info[:2]==(3,11)"
          python -c "import os; assert os.environ['REAL_MONEY']=='BLOCKED'; assert os.environ['AUTO_BETTING']=='DISABLED'; assert os.environ['MATRIX_MODE']=='SHADOW'"

      - name: Run archival parity fail-closed tests
        run: python -m pytest -q tests/test_matrix_over25_enriched_vs_group_parity.py

      - name: Replay original Championship enriched-versus-raw features
        run: |
          python -m tools.matrix_over25_enriched_vs_group_parity --league-id 40 --out evidence/football_world_inventory/2026-11-03/MATRIX_CHAMPIONSHIP_ENRICHED_RAW_PIT_REPLAY.json
          python -c "import json,pathlib; d=json.loads(pathlib.Path('evidence/football_world_inventory/2026-11-03/MATRIX_CHAMPIONSHIP_ENRICHED_RAW_PIT_REPLAY.json').read_text(encoding='utf-8')); assert d['real_money']=='BLOCKED' and d['telegram_signal_authorized'] is False and d['future_model_probability_authorized'] is False and d['canonical_inputs_generated'] is False; assert d['paired_targets'] + d['blocked_targets']==d['canonical_targets']; print('ENRICHED_VS_RAW_HISTORICAL_REPLAY_RECORDED')"

      - name: Upload measured historical disagreement report
        uses: actions/upload-artifact@v4
        with:
          name: matrix-over25-enriched-raw-pit-replay
          path: evidence/football_world_inventory/2026-11-03/MATRIX_CHAMPIONSHIP_ENRICHED_RAW_PIT_REPLAY.json

      - name: Preserve read-only report with local Python (no PowerShell scripts)
        run: python -m tools.matrix_persist_over25_pit_parity
