name: MATRIX Quote Transport Physical Readiness Hourly

on:
  workflow_dispatch:
  schedule:
    - cron: "9 * * * *"
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/matrix-quote-transport-readiness-hourly.yml
      - tools/matrix_quote_transport_readiness.py
      - tests/test_matrix_quote_transport_readiness.py

permissions:
  contents: write
  actions: read

concurrency:
  group: matrix-quote-transport-physical-readiness
  cancel-in-progress: false

jobs:
  readonly-transport-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REAL_MONEY: BLOCKED
      AUTOMATIC_WAGERING: "false"
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test transport-only no-send guards
        run: |
          set -euo pipefail
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_matrix_quote_transport_readiness.py

      - name: Query GitHub pending self-hosted Windows runner and local quote evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_quote_transport_readiness
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("evidence/notifications/telegram/MATRIX_QUOTE_TRANSPORT_READINESS_LAST.json").read_text(encoding="utf-8"))
          assert j["schema"]=="MATRIX_QUOTE_TRANSPORT_READINESS_V1"
          assert j["real_money"]=="BLOCKED"
          assert j["automatic_wagering"] is False
          assert j["model_probability_modified"] is False
          assert j["signal_emission_authorized"] is False
          assert j["telegram_messages_sent"]==0
          assert j["exact_bookmaker_over25_quotes_verified_by_this_diagnostic"]==0
          assert j["no_cdp_or_browser_requests_made_by_this_diagnostic"] is True
          assert j["no_odds_provider_calls_made_by_this_diagnostic"] is True
          print("QUOTE_TRANSPORT_STATUS="+j["status"])
          print("RUNNER_ASSIGNMENT_UNPROVEN="+str(not j["runner_offline_proven"]))
          PY

      - name: Persist quote transport causal status without modifying betting signals
        shell: bash
        run: |
          set -euo pipefail
          P=evidence/notifications/telegram/MATRIX_QUOTE_TRANSPORT_READINESS_LAST.json
          git config user.name matrix-quote-transport-readiness
          git config user.email matrix-quote-transport-readiness@users.noreply.github.com
          git add "$P"
          if git diff --cached --quiet; then echo NO_QUOTE_TRANSPORT_STATUS_CHANGE; exit 0; fi
          git commit -m "evidence(odds): persist real quote transport and queued runner state"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
