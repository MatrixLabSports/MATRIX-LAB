name: MATRIX Edge Attribution Over2.5

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/matrix_edge_attribution_over25.py
      - tests/test_matrix_edge_attribution_over25.py
      - .github/workflows/matrix-edge-attribution-over25.yml
      - evidence/api_football/daily_prematch_reports/2026-10-16/over25_shadow_ev/MATRIX_FOOTBALL_DAILY_OVER25_GOVERNED_SHADOW_EV.json

permissions:
  contents: write

concurrency:
  group: matrix-edge-attribution-over25
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REAL_MONEY: BLOCKED
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run attribution tests
        run: PYTHONPATH=. python -m pytest -q tests/test_matrix_edge_attribution_over25.py

      - name: Build physical attribution artifact
        run: PYTHONPATH=. python -m tools.matrix_edge_attribution_over25

      - name: Enforce governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/api_football/edge_attribution/2026-10-16/MATRIX_EDGE_ATTRIBUTION_OVER25_V2.json")
          x=json.loads(p.read_text())
          assert x["schema"]=="MATRIX_EDGE_ATTRIBUTION_OVER25_V2"
          assert x["attribution_scope"]=="MODEL_COMPONENT_LOGIT_AND_PRICE_EDGE"
          assert x["governance"]["no_synthetic_drivers"] is True
          assert x["governance"]["p_matrix_is_input_not_modified"] is True
          assert x["governance"]["real_money"]=="BLOCKED"
          assert x["row_count"] > 0
          assert x["feature_trace_available_count"] == x["row_count"]
          assert all(r["edge_attribution"]["feature_level_driver_status"]=="AVAILABLE_REAL_ENGINE_TRACE" for r in x["rows"])
          assert all(r["edge_attribution"]["feature_trace_space"]=="LOGIT" for r in x["rows"])
          assert all(abs(r["edge_attribution"]["reconstructed_probability"]-r["p_matrix"]) < 1e-9 for r in x["rows"])
          assert all(r["protections"]["feature_contributions_invented"] is False for r in x["rows"])
          print("MATRIX_EDGE_ATTRIBUTION_GATE: PASS")
          print("row_count=",x["row_count"])
          print("feature_trace_available_count=",x["feature_trace_available_count"])
          print("priced_row_count=",x["priced_row_count"])
          print("artifact_sha256=",x["artifact_sha256"])
          PY

      - name: Persist evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-edge-attribution
          git config user.email matrix-edge-attribution@users.noreply.github.com
          git add evidence/api_football/edge_attribution/2026-10-16/MATRIX_EDGE_ATTRIBUTION_OVER25_V2.json
          if git diff --cached --quiet; then
            echo "NO_EDGE_ATTRIBUTION_CHANGE"
            exit 0
          fi
          git commit -m "evidence(edge): persist Over2.5 attribution v2"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            git rebase origin/repair/cor09-world-pipeline
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
