name: MATRIX Multi-Market Canonical Supervisor

on:
  workflow_run:
    workflows:
      - "MATRIX Football Daily Governed Pipeline"
      - "MATRIX RapidAPI Tennis Paid-Window Harvest"
      - "API-Football daily prospective production"
      - "API-Football prospective FINAL-only settlement now"
    types:
      - completed
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
      - main
    paths:
      - tools/matrix_multi_market_supervisor.py
      - tools/api_football_market_binding_catalog.py
      - app/market/matrix_market_portfolio.py
      - evidence/audit/MATRIX_MARKET_PORTFOLIO_PERMANENT_MANDATE_V1.json
      - tests/test_matrix_multi_market_supervisor.py
      - tests/test_market_portfolio_permanent_mandate.py
      - tests/test_matrix_42_lane_prospective_registry.py
      - tests/test_matrix_42_lane_football_freeze_bridge.py
      - tests/test_matrix_42_lane_period_goals_freeze_bridge.py
      - tests/test_matrix_42_lane_tennis_match_winner_bridge.py
      - tests/test_matrix_42_lane_team_shots_offline_bridge.py
      - tests/test_matrix_42_lane_zero_prospective_blockers.py
      - tests/test_matrix_42_lane_action_board.py
      - tools/matrix_42_lane_action_board.py
      - tests/test_matrix_42_lane_300_to_600_accelerator.py
      - tools/matrix_42_lane_300_to_600_accelerator.py
      - tests/test_matrix_gate600_post_audit.py
      - tools/matrix_gate600_post_audit.py
      - tests/test_matrix_football_5000_settled_milestone.py
      - tools/matrix_football_5000_settled_milestone.py
      - tests/test_matrix_nine_lab_gate_registry.py
      - tools/matrix_42_lane_prospective_registry.py
      - tools/matrix_42_lane_football_freeze_bridge.py
      - tools/matrix_42_lane_period_goals_freeze_bridge.py
      - tools/matrix_42_lane_tennis_match_winner_bridge.py
      - tools/matrix_42_lane_team_shots_offline_bridge.py
      - tools/matrix_42_lane_zero_prospective_blockers.py
      - tools/matrix_nine_lab_gate_registry.py
      - .github/workflows/matrix-multi-market-supervisor.yml

permissions:
  contents: write

concurrency:
  group: matrix-multi-market-canonical-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REAL_MONEY: BLOCKED
      AUTOMATIC_WAGERING: "false"
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install governed dependencies
        run: python -m pip install requests pytest

      - name: Enforce permanent market contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_market_portfolio_permanent_mandate.py \
            tests/test_matrix_multi_market_supervisor.py \
            tests/test_multi_market_supervisor_single_writer.py \
            tests/test_matrix_blocked_market_activation_plan.py \
            tests/test_matrix_42_lane_prospective_registry.py \
            tests/test_matrix_42_lane_football_freeze_bridge.py \
            tests/test_matrix_42_lane_period_goals_freeze_bridge.py \
            tests/test_matrix_42_lane_tennis_match_winner_bridge.py \
            tests/test_matrix_42_lane_team_shots_offline_bridge.py \
            tests/test_matrix_42_lane_zero_prospective_blockers.py \
            tests/test_matrix_42_lane_action_board.py \
            tests/test_matrix_42_lane_300_to_600_accelerator.py \
            tests/test_matrix_gate600_post_audit.py \
            tests/test_matrix_football_5000_settled_milestone.py \
            tests/test_matrix_nine_lab_gate_registry.py

      - name: Refresh football market catalog while paid window is active
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Bogota date +%F)"
          CUTOFF="2026-10-28"
          if [[ "$TODAY" > "$CUTOFF" ]]; then
            echo "PAID_WINDOW_EXPIRED_USE_LAST_PHYSICAL_CATALOG"
            exit 0
          fi
          if [ -z "${API_FOOTBALL_KEY:-}" ]; then
            echo "API_FOOTBALL_KEY_MISSING_USE_LAST_PHYSICAL_CATALOG"
            exit 0
          fi
          python -m tools.api_football_market_binding_catalog

      - name: Build canonical 42-lane state
        shell: bash
        run: |
          set -euo pipefail
          D="$(TZ=America/Bogota date +%F)"
          CATALOG="evidence/api_football/market_expansion/market_binding_catalog.json"
          if [ -f "$CATALOG" ]; then
            python -m tools.matrix_multi_market_supervisor \
              --football-catalog "$CATALOG" \
              --target-date-bogota "$D" \
              --source-run canonical-multi-market-supervisor \
              --out evidence/market_portfolio/MATRIX_MULTI_MARKET_SUPERVISOR_LAST.json
          else
            python -m tools.matrix_multi_market_supervisor \
              --target-date-bogota "$D" \
              --source-run canonical-multi-market-supervisor \
              --out evidence/market_portfolio/MATRIX_MULTI_MARKET_SUPERVISOR_LAST.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/market_portfolio/MATRIX_MULTI_MARKET_SUPERVISOR_LAST.json")
          j=json.loads(p.read_text())
          assert j["status"]=="PASS"
          assert j["total_required_lanes"]==42
          assert j["football_required_lanes"]==30
          assert j["tennis_required_lanes"]==12
          assert j["invariants"]["every_mandated_lane_emitted_each_cycle"] is True
          assert j["invariants"]["aces_present"] is True
          assert j["invariants"]["first_half_goals_present"] is True
          assert j["invariants"]["second_half_goals_present"] is True
          assert j["invariants"]["real_money"]=="BLOCKED"
          print(json.dumps({
            "status":"PASS",
            "total_required_lanes":42,
            "state_counts":j["state_counts"],
            "catalog_market_names_observed":j["catalog_market_names_observed"],
            "aces_present":j["invariants"]["aces_present"],
            "first_half_goals_present":j["invariants"]["first_half_goals_present"],
            "second_half_goals_present":j["invariants"]["second_half_goals_present"],
            "real_money":j["invariants"]["real_money"],
          },sort_keys=True))
          PY

      - name: Bridge governed football freezes into 42-lane inbox
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_42_lane_football_freeze_bridge
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/market_portfolio/MATRIX_42_LANE_FOOTBALL_FREEZE_BRIDGE_LAST.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["status"]=="PASS"
          assert j["protections"]["source_probabilities_reused_without_refit"] is True
          assert j["protections"]["double_chance_is_exact_sum_of_frozen_1x2"] is True
          assert j["protections"]["post_start_backfill_forbidden"] is True
          assert j["protections"]["outcomes_read"]==0
          assert j["protections"]["odds_used_to_generate_probability"] is False
          assert j["protections"]["automatic_wagering"] is False
          assert j["protections"]["real_money"]=="BLOCKED"
          print(json.dumps({
              "status":j["status"],
              "eligible_future_lane_rows":j["eligible_future_lane_rows"],
              "eligible_future_unique_fixtures":j["eligible_future_unique_fixtures"],
              "lanes_emitted":j["lanes_emitted"],
          },sort_keys=True))
          PY

      - name: Bridge period-goals freezes into 42-lane inbox
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_42_lane_period_goals_freeze_bridge
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/market_portfolio/MATRIX_42_LANE_PERIOD_GOALS_FREEZE_BRIDGE_LAST.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["status"]=="PASS"
          assert j["protections"]["strictly_prior_kickoff_history_only"] is True
          assert j["protections"]["parameter_refit"] is False
          assert j["protections"]["parameter_search"] is False
          assert j["protections"]["post_start_backfill_forbidden"] is True
          assert j["protections"]["outcomes_read"]==0
          assert j["protections"]["odds_used_to_generate_probability"] is False
          assert j["protections"]["automatic_wagering"] is False
          assert j["protections"]["real_money"]=="BLOCKED"
          print(json.dumps({
              "status":j["status"],
              "future_source_fixture_candidates":j["future_source_fixture_candidates"],
              "eligible_future_unique_fixtures":j["eligible_future_unique_fixtures"],
              "eligible_future_lane_rows":j["eligible_future_lane_rows"],
              "blocked_count":j["blocked_count"],
              "blocked_reason_counts":j["blocked_reason_counts"],
          },sort_keys=True))
          PY

      - name: Bridge current tennis match-winner freezes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_42_lane_tennis_match_winner_bridge
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/market_portfolio/MATRIX_42_LANE_TENNIS_MATCH_WINNER_BRIDGE_LAST.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["status"]=="PASS"
          assert j["protections"]["only_currently_future_events_admitted"] is True
          assert j["protections"]["historical_backfill_forbidden"] is True
          assert j["protections"]["freeze_strictly_before_start"] is True
          assert j["protections"]["outcomes_read"]==0
          assert j["protections"]["metrics_opened"] is False
          assert j["protections"]["odds_used_to_generate_probability"] is False
          assert j["protections"]["automatic_wagering"] is False
          assert j["protections"]["real_money"]=="BLOCKED"
          print(json.dumps({
              "status":j["status"],
              "eligible_future_unique_events":j["eligible_future_unique_events"],
              "hard_candidate_rows_scanned":j["hard_candidate_rows_scanned"],
              "clay_candidate_rows_scanned":j["clay_candidate_rows_scanned"],
          },sort_keys=True))
          PY

      - name: Bridge offline PIT Team Shots freezes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_42_lane_team_shots_offline_bridge
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/market_portfolio/MATRIX_42_LANE_TEAM_SHOTS_OFFLINE_BRIDGE_LAST.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["status"]=="PASS"
          assert j["protections"]["network_calls"]==0
          assert j["protections"]["strictly_prior_persisted_pit_history_only"] is True
          assert j["protections"]["same_match_target_used_in_features"] is False
          assert j["protections"]["historical_model_lines_only"] is True
          assert j["protections"]["price_observed"] is False
          assert j["protections"]["odds_used_to_generate_probability"] is False
          assert j["protections"]["parameter_refit"] is False
          assert j["protections"]["parameter_search"] is False
          assert j["protections"]["post_start_backfill_forbidden"] is True
          assert j["protections"]["outcomes_read"]==0
          assert j["protections"]["automatic_wagering"] is False
          assert j["protections"]["real_money"]=="BLOCKED"
          print(json.dumps({
              "status":j["status"],
              "future_source_fixture_candidates":j["future_source_fixture_candidates"],
              "eligible_future_unique_fixtures":j["eligible_future_unique_fixtures"],
              "eligible_future_lane_rows":j["eligible_future_lane_rows"],
              "blocked_count":j["blocked_count"],
              "blocked_reason_counts":j["blocked_reason_counts"],
          },sort_keys=True))
          PY

      - name: Build strict 42-lane prospective registry
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_42_lane_prospective_registry
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/market_portfolio/MATRIX_42_LANE_PROSPECTIVE_REGISTRY_LAST.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["status"]=="PASS"
          assert j["total_lanes"]==42
          assert j["football_lanes"]==30
          assert j["tennis_lanes"]==12
          assert j["gate_thresholds"]==[100,300,600]
          assert j["admission_contract"]["freeze_strictly_before_event_start"] is True
          assert j["admission_contract"]["target_outcome_forbidden_at_freeze"] is True
          assert j["protections"]["odds_used_to_generate_probability"] is False
          assert j["protections"]["automatic_wagering"] is False
          assert j["protections"]["real_money"]=="BLOCKED"
          print(json.dumps({
              "status":j["status"],
              "total_lanes":j["total_lanes"],
              "counts":j["counts"],
              "append_result":j["append_result"],
              "source_inventory":j["source_inventory"],
          },sort_keys=True))
          PY

      - name: Build zero-prospective blocker registry
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_42_lane_zero_prospective_blockers
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/market_portfolio/MATRIX_42_LANE_ZERO_PROSPECTIVE_BLOCKERS_LAST.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["status"]=="PASS"
          assert j["policy"]["no_fake_backfill"] is True
          assert j["policy"]["no_silent_imputation"] is True
          assert j["policy"]["odds_do_not_generate_probability"] is True
          assert j["policy"]["automatic_wagering"] is False
          assert j["policy"]["real_money"]=="BLOCKED"
          print(json.dumps({
              "status":j["status"],
              "zero_prospective_lane_count":j["zero_prospective_lane_count"],
              "source_checks":j["source_checks"],
          },sort_keys=True))
          PY

      - name: Build canonical 42-lane action board
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_42_lane_action_board
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("evidence/market_portfolio/MATRIX_42_LANE_ACTION_BOARD_LAST.json").read_text(encoding="utf-8"))
          assert j["status"]=="PASS"
          assert j["counts"]["total_lanes"]==42
          assert j["counts"]["football_lanes"]==30
          assert j["counts"]["tennis_lanes"]==12
          assert j["invariants"]["all_42_present_exactly_once"] is True
          assert j["invariants"]["every_lane_has_next_action"] is True
          assert j["invariants"]["every_lane_must_continue_collecting"] is True
          assert j["invariants"]["missing_not_zero"] is True
          assert j["invariants"]["no_silent_imputation"] is True
          assert j["invariants"]["odds_do_not_generate_p_matrix"] is True
          assert j["invariants"]["automatic_wagering"] is False
          assert j["invariants"]["real_money"]=="BLOCKED"
          print(json.dumps({"status":"PASS","counts":j["counts"]},sort_keys=True))
          PY

      - name: Select deterministic 300-to-600 accelerator cohort
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_42_lane_300_to_600_accelerator
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("evidence/market_portfolio/MATRIX_42_LANE_300_TO_600_ACCELERATOR_LAST.json").read_text(encoding="utf-8"))
          assert j["status"]=="PASS"
          assert j["portfolio_visibility"]["all_42_remain_supervised"] is True
          assert j["portfolio_visibility"]["selected_cohort_does_not_suspend_other_lanes"] is True
          assert j["selection_policy"]["model_refit"] is False
          assert j["selection_policy"]["historical_backfill"] is False
          assert j["selection_policy"]["post_start_backfill"] is False
          assert j["selection_policy"]["odds_used_to_generate_probability"] is False
          assert j["selection_policy"]["automatic_wagering"] is False
          assert j["selection_policy"]["real_money"]=="BLOCKED"
          print(json.dumps({"status":"PASS","selected_cohort":j["selected_cohort"],"ordered_cohorts":j["ordered_cohorts"]},sort_keys=True))
          PY

      - name: Audit exact post-600 LAB lanes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_gate600_post_audit
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("evidence/market_portfolio/MATRIX_GATE600_POST_AUDIT_LAST.json").read_text(encoding="utf-8"))
          assert j["status"]=="PASS"
          assert j["gate600_lab_lane_count"]>=1
          assert j["adjudication_policy"]["pass_requires_exact_settled_600"] is True
          assert j["adjudication_policy"]["pass_requires_brier_better_than_poisson"] is True
          assert j["adjudication_policy"]["pass_requires_logloss_better_than_poisson"] is True
          assert j["adjudication_policy"]["no_automatic_promotion"] is True
          assert j["protections"]["exact_fixture_intersection_between_42_lane_ledger_and_final_calibration_ledger"] is True
          assert j["protections"]["final_ft_only"] is True
          assert j["protections"]["historical_backfill"] is False
          assert j["protections"]["post_start_backfill"] is False
          assert j["protections"]["automatic_wagering"] is False
          assert j["protections"]["real_money"]=="BLOCKED"
          print(json.dumps({
              "status":"PASS",
              "audit_overall_verdict":j["audit_overall_verdict"],
              "lanes":[{
                  "lane":x["market_lane"],
                  "freeze":x["prospective_freeze_count"],
                  "settled":x["exact_settled_count"],
                  "remaining_settled_to_600":x["remaining_settled_to_600"],
                  "verdict":x["verdict"],
              } for x in j["lanes"]],
          },sort_keys=True))
          PY

      - name: Track football 5000-settled milestone
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_football_5000_settled_milestone
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("evidence/market_portfolio/MATRIX_FOOTBALL_5000_SETTLED_MILESTONE_LAST.json").read_text(encoding="utf-8"))
          assert j["status"]=="PASS"
          assert j["target_settled_count"]==5000
          assert j["remaining_to_5000"]==max(0,5000-j["current_settled_count"])
          assert j["settlement_contract"]["final_ft_only"] is True
          assert j["settlement_contract"]["automatic_promotion"] is False
          assert j["settlement_contract"]["automatic_wagering"] is False
          assert j["settlement_contract"]["real_money"]=="BLOCKED"
          print(json.dumps({
              "status":"PASS",
              "milestone_state":j["milestone_state"],
              "current_settled_count":j["current_settled_count"],
              "remaining_to_5000":j["remaining_to_5000"],
              "progress_pct":j["progress_pct"],
              "next_required_action":j["next_required_action"],
          },sort_keys=True))
          PY

      - name: Build blocked-lane activation plan
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.matrix_blocked_market_activation_plan
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("evidence/market_portfolio/MATRIX_BLOCKED_MARKET_ACTIVATION_PLAN_LAST.json").read_text())
          assert j["status"]=="PASS"
          assert j["blocked_model_count"]==len(j["rows"])
          assert 0 <= j["blocked_model_count"] <= 13
          assert all(x["next_required_action"] for x in j["rows"])
          assert all(x["must_continue_collecting"] is True for x in j["rows"])
          assert j["policy"]["price_does_not_generate_p_matrix"] is True
          assert j["policy"]["real_money"]=="BLOCKED"
          print(json.dumps({
            "status":"PASS",
            "blocked_model_count":j["blocked_model_count"],
            "immediate_model_lab_candidate_count":j["immediate_model_lab_candidate_count"],
            "immediate_model_lab_candidates":j["immediate_model_lab_candidates"],
          },sort_keys=True))
          PY

      - name: Persist canonical supervisor evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-market-supervisor
          git config user.email matrix-market-supervisor@users.noreply.github.com
          git add evidence/market_portfolio/MATRIX_MULTI_MARKET_SUPERVISOR_LAST.json
          git add evidence/market_portfolio/MATRIX_BLOCKED_MARKET_ACTIVATION_PLAN_LAST.json
          git add evidence/market_portfolio/MATRIX_42_LANE_PROSPECTIVE_REGISTRY_LAST.json
          git add evidence/market_portfolio/MATRIX_42_LANE_FOOTBALL_FREEZE_BRIDGE_LAST.json
          git add evidence/market_portfolio/MATRIX_42_LANE_PERIOD_GOALS_FREEZE_BRIDGE_LAST.json
          git add evidence/market_portfolio/MATRIX_42_LANE_TENNIS_MATCH_WINNER_BRIDGE_LAST.json
          git add evidence/market_portfolio/MATRIX_42_LANE_TEAM_SHOTS_OFFLINE_BRIDGE_LAST.json
          git add evidence/market_portfolio/MATRIX_42_LANE_ZERO_PROSPECTIVE_BLOCKERS_LAST.json
          git add evidence/market_portfolio/MATRIX_42_LANE_ACTION_BOARD_LAST.json
          git add evidence/market_portfolio/MATRIX_42_LANE_300_TO_600_ACCELERATOR_LAST.json
          git add evidence/market_portfolio/MATRIX_GATE600_POST_AUDIT_LAST.json
          git add evidence/market_portfolio/MATRIX_FOOTBALL_5000_SETTLED_MILESTONE_LAST.json
          git add evidence/market_portfolio/MATRIX_42_LANE_FREEZE_INBOX.jsonl
          if [ -f evidence/market_portfolio/MATRIX_42_LANE_PROSPECTIVE_LEDGER.jsonl ]; then
            git add evidence/market_portfolio/MATRIX_42_LANE_PROSPECTIVE_LEDGER.jsonl
          fi
          if [ -f evidence/api_football/market_expansion/market_binding_catalog.json ]; then
            git add evidence/api_football/market_expansion/market_binding_catalog.json
          fi
          if git diff --cached --quiet; then
            echo "NO_CANONICAL_SUPERVISOR_CHANGE"
            exit 0
          fi
          git commit -m "evidence(markets): persist canonical 42-lane supervisor"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              sleep $((attempt*2))
              continue
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then
              exit 0
            fi
            sleep $((attempt*2))
          done
          exit 1
