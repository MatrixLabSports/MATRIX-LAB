name: MATRIX Premium Resultados cada 5 minutos

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: matrix-premium-results-5m
  cancel-in-progress: false

jobs:
  premium-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - name: Checkout rama operativa
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests pytest pillow

      - name: Verify premium card and result contracts
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_matrix_premium_cards.py tests/test_matrix_premium_result_watcher.py

      - name: Enforce safety
        run: |
          test "$MATRIX_MODE" = "SHADOW"
          test "$REAL_MONEY" = "BLOCKED"
          test "$AUTO_BETTING" = "DISABLED"

      - name: Watch FINAL and publish premium result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MATRIX_PREMIUM_TELEGRAM_CHAT_ID: ${{ secrets.MATRIX_PREMIUM_TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: PYTHONPATH=. python -m tools.matrix_premium_result_watcher

      - name: Persist premium delivery evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-premium-results
          git config user.email matrix-premium-results@users.noreply.github.com
          git add evidence/notifications/telegram/MATRIX_PREMIUM_DELIVERY_LEDGER.json
          if [ -d evidence/notifications/telegram/premium_cards/results ]; then
            git add evidence/notifications/telegram/premium_cards/results
          fi
          if git diff --cached --quiet; then
            echo "SIN_CAMBIOS_PREMIUM"
            exit 0
          fi
          git commit -m "evidence(premium): persist result delivery state"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if git rebase origin/repair/cor09-world-pipeline && git push origin HEAD:repair/cor09-world-pipeline; then
              exit 0
            fi
            git rebase --abort || true
          done
          exit 1
