name: API-Football extended team PIT dataset

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-extended-team-pit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-football-extended-team-pit
  cancel-in-progress: false

jobs:
  pit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tests
        run: python -m pip install pytest

      - name: Run PIT regression tests
        run: python -m pytest -q tests/test_api_football_extended_team_pit_dataset.py

      - name: Build strict point-in-time team datasets
        run: python -m tools.api_football_extended_team_pit_dataset

      - name: Enforce PIT anti-leakage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/api_football/market_expansion/team_pit/manifest.json").read_text())
          assert p["status"]=="PASS"
          assert p["same_match_target_used_in_features"] is False
          assert p["validation_used_for_parameter_tuning"] is False
          assert p["protected_final_holdout_used"] is False
          assert p["prospective_calibration_used"] is False
          assert p["odds_used_to_generate_probability"] is False
          assert p["metrics_opened"] is False
          assert p["real_money"]=="BLOCKED"
          assert p["input_unique_fixture_count"]>=250
          for lane,row in p["lanes"].items():
              assert row["minimum_history"]==5
              assert row["maximum_history"]==20
          print("MATRIX_EXTENDED_TEAM_PIT_GATE: PASS")
          PY

      - name: Persist PIT evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-pit"
          git config user.email "matrix-football-pit@users.noreply.github.com"
          git add evidence/api_football/market_expansion/team_pit
          if git diff --cached --quiet; then
            echo "NO_PIT_EVIDENCE_TO_PERSIST"
            exit 3
          fi
          git commit -m "evidence(football): persist strict PIT extended team datasets"
          git status --porcelain
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline

