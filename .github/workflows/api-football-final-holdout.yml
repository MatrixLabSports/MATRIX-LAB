name: API-Football FINAL holdout adjudication

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-final-holdout.yml

permissions:
  contents: write

concurrency:
  group: api-football-final-holdout-adjudication
  cancel-in-progress: false

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Verify final holdout adjudicator before opening
        run: python -m pytest -q tests/test_api_football_final_holdout_adjudication.py
      - name: Open FINAL holdout exactly once with frozen parameters
        run: python -m tools.api_football_final_holdout_adjudication
      - name: Enforce no refit and no silent promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/api_football/challenger/final_holdout_adjudication.json").read_text())
          assert d["holdout_row_count"]==357
          assert d["holdout_identity_match"] is True
          assert d["parameter_refit_performed"] is False
          assert d["parameter_search_performed"] is False
          assert d["holdout_open_count"]==1
          assert d["governed_engine_promoted"] is False
          assert d["p_matrix_generated"] is False
          assert d["automatic_wagering"] is False
          assert d["real_money"]=="BLOCKED"
          print("MATRIX_FOOTBALL_FINAL_HOLDOUT_GATE: PASS")
          print("final_holdout_status=",d["final_holdout_status"])
          print("all_three_markets_holdout_superiority=",d["all_three_markets_holdout_superiority"])
          print("metrics=",d["metrics"])
          PY
      - name: Persist immutable FINAL holdout adjudication
        run: |
          git config user.name "matrix-football-final-holdout"
          git config user.email "matrix-football-final-holdout@users.noreply.github.com"
          git add evidence/api_football/challenger/final_holdout_adjudication.json
          git commit -m "evidence(football): persist one-time FINAL holdout adjudication"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
