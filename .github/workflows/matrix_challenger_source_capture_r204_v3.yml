name: MATRIX Challenger Source Capture R204 v3

on:
  push:
    paths:
      - '.github/workflows/matrix_challenger_source_capture_r204_v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare directories
        run: mkdir -p capture/tml capture/reference

      - name: Download pinned TML Challenger raw-replica files
        shell: bash
        run: |
          set -euo pipefail
          COMMIT='17370954eb9b689e8c85e12ebb7cdfed00f25c43'
          BASE="https://raw.githubusercontent.com/gmalbert/tennis-predictions/${COMMIT}/tml-data"
          for YEAR in 2022 2023 2024 2025 2026; do
            curl -fL --retry 4 --retry-delay 2 "$BASE/${YEAR}_challenger.csv" -o "capture/tml/${YEAR}_challenger.csv"
          done

      - name: Verify exact Git blob identities at pinned commit
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local f="$1" expected="$2"
            actual="$(git hash-object "$f")"
            echo "$f blob=$actual bytes=$(stat -c%s "$f")"
            test "$actual" = "$expected"
          }
          check_blob capture/tml/2022_challenger.csv afaf801773250898e38945a945334194406325c0
          check_blob capture/tml/2023_challenger.csv b3899402a57ce2469a14058d6a6521bf55c062b2
          check_blob capture/tml/2024_challenger.csv dd4bedf5509548981e695101f763d99c946f2533
          check_blob capture/tml/2025_challenger.csv 1fde930268f9714a5e747fc0f78de517cc53ed00
          check_blob capture/tml/2026_challenger.csv 48428c4a6fa952426811b00d605e7978fa3626e1

      - name: Download pinned June 2026 combined Challenger reference
        shell: bash
        run: |
          set -euo pipefail
          COMMIT='83733587353df8a41f2fd4f516147d5aa83f5a8d'
          URL="https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/${COMMIT}/atp_matches_qual_chall_2026.csv"
          curl -fL --retry 4 --retry-delay 2 "$URL" -o capture/reference/atp_matches_qual_chall_2026.csv

      - name: Build source manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, subprocess
          from pathlib import Path
          root=Path('capture')
          files=[*(root/'tml').glob('*_challenger.csv'),root/'reference'/'atp_matches_qual_chall_2026.csv']
          m={'schema':'MATRIX_CHALLENGER_SOURCE_CAPTURE_R204_V3','tml_repo':'gmalbert/tennis-predictions','tml_commit':'17370954eb9b689e8c85e12ebb7cdfed00f25c43','reference_repo':'Aneeshers/tennis-sackmann-archive','reference_commit':'83733587353df8a41f2fd4f516147d5aa83f5a8d','files':[]}
          for p in sorted(files):
              data=p.read_bytes()
              with p.open('r',encoding='utf-8-sig',newline='') as fh: rows=list(csv.DictReader(fh))
              dates=[]; levels=set(); surfaces=set()
              for r in rows:
                  d=(r.get('tourney_date') or '').strip()
                  if d.isdigit(): dates.append(int(d))
                  if (r.get('tourney_level') or '').strip(): levels.add(r['tourney_level'].strip())
                  if (r.get('surface') or '').strip(): surfaces.add(r['surface'].strip())
              blob=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
              m['files'].append({'path':str(p),'bytes':len(data),'git_blob_sha1':blob,'sha256':hashlib.sha256(data).hexdigest(),'rows':len(rows),'min_tourney_date':min(dates) if dates else None,'max_tourney_date':max(dates) if dates else None,'tourney_levels':sorted(levels),'surfaces':sorted(surfaces)})
          (root/'MATRIX_CHALLENGER_SOURCE_CAPTURE_R204_V3_MANIFEST.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          (cd capture && sha256sum tml/*.csv reference/*.csv > SHA256SUMS.txt)
          cat capture/MATRIX_CHALLENGER_SOURCE_CAPTURE_R204_V3_MANIFEST.json

      - name: Upload source capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: matrix-challenger-r204-source-capture
          path: capture/
          retention-days: 1
          if-no-files-found: error
