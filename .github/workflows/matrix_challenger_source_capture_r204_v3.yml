name: MATRIX Challenger Source Capture R204 v3

on:
  push:
    paths:
      - '.github/workflows/matrix_challenger_source_capture_r204_v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare directories
        run: mkdir -p capture/tml capture/reference

      - name: Download pinned TML Challenger raw-replica files
        shell: bash
        run: |
          set -euo pipefail
          COMMIT='17370954eb9b689e8c85e12ebb7cdfed00f25c43'
          BASE="https://raw.githubusercontent.com/gmalbert/tennis-predictions/${COMMIT}/tml-data"
          for YEAR in 2022 2023 2024 2025 2026; do
            curl -fL --retry 4 --retry-delay 2 "$BASE/${YEAR}_challenger.csv" -o "capture/tml/${YEAR}_challenger.csv"
          done

      - name: Verify exact Git blob identities at pinned commit
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local f="$1" expected="$2" expected_size="$3"
            actual="$(git hash-object "$f")"
            size="$(stat -c%s "$f")"
            echo "$f blob=$actual bytes=$size"
            test "$actual" = "$expected"
            test "$size" = "$expected_size"
          }
          check_blob capture/tml/2022_challenger.csv afaf801773250898e38945a945334194406325c0 1094100
          check_blob capture/tml/2023_challenger.csv b3899402a57ce2469a14058d6a6521bf55c062b2 1154154
          check_blob capture/tml/2024_challenger.csv dd4bedf5509548981e695101f763d99c946f2533 1228360
          check_blob capture/tml/2025_challenger.csv 1fde930268f9714a5e747fc0f78de517cc53ed00 1414046
          check_blob capture/tml/2026_challenger.csv 48428c4a6fa952426811b00d605e7978fa3626e1 1097414

      - name: Download and verify pinned June 2026 combined Challenger reference
        shell: bash
        run: |
          set -euo pipefail
          COMMIT='83733587353df8a41f2fd4f516147d5aa83f5a8d'
          URL="https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/${COMMIT}/atp/atp_matches_qual_chall_2026.csv"
          FILE='capture/reference/atp_matches_qual_chall_2026.csv'
          curl -fL --retry 4 --retry-delay 2 "$URL" -o "$FILE"
          BLOB="$(git hash-object "$FILE")"
          SIZE="$(stat -c%s "$FILE")"
          echo "$FILE blob=$BLOB bytes=$SIZE"
          test "$BLOB" = '44816ed0175384de008d81c1734066aa821e855b'
          test "$SIZE" = '1189359'

      - name: Download and verify same-family June 2026 TML Challenger snapshot
        shell: bash
        run: |
          set -euo pipefail
          COMMIT='a4ba1dd78e3b48d9415e80adba5420766bebc5b9'
          URL="https://raw.githubusercontent.com/gmalbert/tennis-predictions/${COMMIT}/tml-data/2026_challenger.csv"
          FILE='capture/reference/2026_challenger_same_family_20260609.csv'
          curl -fL --retry 4 --retry-delay 2 "$URL" -o "$FILE"
          BLOB="$(git hash-object "$FILE")"
          echo "$FILE blob=$BLOB bytes=$(stat -c%s "$FILE")"
          test "$BLOB" = 'df54fb4987935fffe410c08dff37a4d6a4f46820'

      - name: Build source manifest, same-family continuity audit and checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, subprocess
          from pathlib import Path
          root=Path('capture')
          files=[*(root/'tml').glob('*_challenger.csv'),*(root/'reference').glob('*.csv')]
          m={'schema':'MATRIX_CHALLENGER_SOURCE_CAPTURE_R204_V4','tml_repo':'gmalbert/tennis-predictions','tml_commit':'17370954eb9b689e8c85e12ebb7cdfed00f25c43','same_family_reference_commit':'a4ba1dd78e3b48d9415e80adba5420766bebc5b9','cross_family_reference_repo':'Aneeshers/tennis-sackmann-archive','cross_family_reference_commit':'83733587353df8a41f2fd4f516147d5aa83f5a8d','files':[]}
          def rows(p):
              with p.open('r',encoding='utf-8-sig',newline='') as fh: return list(csv.DictReader(fh))
          for p in sorted(files):
              data=p.read_bytes(); rs=rows(p)
              dates=[]; levels=set(); surfaces=set()
              for r in rs:
                  d=(r.get('tourney_date') or '').strip()
                  if d.isdigit(): dates.append(int(d))
                  lv=(r.get('tourney_level') or '').strip(); sf=(r.get('surface') or '').strip()
                  if lv: levels.add(lv)
                  if sf: surfaces.add(sf)
              blob=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
              m['files'].append({'path':str(p),'bytes':len(data),'git_blob_sha1':blob,'sha256':hashlib.sha256(data).hexdigest(),'rows':len(rs),'min_tourney_date':min(dates) if dates else None,'max_tourney_date':max(dates) if dates else None,'tourney_levels':sorted(levels),'surfaces':sorted(surfaces)})
          current=rows(root/'tml'/'2026_challenger.csv')
          historical=rows(root/'reference'/'2026_challenger_same_family_20260609.csv')
          cutoff=max(int(r['tourney_date']) for r in historical if str(r.get('tourney_date','')).isdigit())
          def ident(r):
              return ((r.get('tourney_id') or '').strip().lower(),(r.get('tourney_date') or '').strip(),(r.get('winner_name') or '').strip().lower(),(r.get('loser_name') or '').strip().lower(),(r.get('round') or '').strip())
          h={ident(r) for r in historical if str(r.get('tourney_date','')).isdigit() and int(r['tourney_date'])<=cutoff}
          c={ident(r) for r in current if str(r.get('tourney_date','')).isdigit() and int(r['tourney_date'])<=cutoff}
          m['same_family_continuity']={'historical_cutoff':cutoff,'historical_unique_ids':len(h),'current_unique_ids_through_cutoff':len(c),'matched_historical_ids':len(h & c),'missing_historical_ids':len(h-c),'extra_current_ids':len(c-h),'pass_exact_subset':len(h-c)==0,'missing_sample':sorted(h-c)[:20],'extra_sample':sorted(c-h)[:20]}
          (root/'MATRIX_CHALLENGER_SOURCE_CAPTURE_R204_V4_MANIFEST.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          (cd capture && sha256sum tml/*.csv reference/*.csv > SHA256SUMS.txt)
          cat capture/MATRIX_CHALLENGER_SOURCE_CAPTURE_R204_V4_MANIFEST.json

      - name: Upload source capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: matrix-challenger-r204-source-capture
          path: capture/
          retention-days: 1
          if-no-files-found: error
