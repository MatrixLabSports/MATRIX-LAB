name: MATRIX Hybrid Elite Three Research Model Prospective OOS

on:
  workflow_dispatch:
  schedule:
    - cron: "43 2,8,14,20 * * *"
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/matrix_hybrid_three_model_research_oos.py
      - tests/test_matrix_hybrid_three_model_research_oos.py
      - tools/matrix_hybrid_original_dual_freeze_lineage.py
      - tests/test_matrix_hybrid_original_dual_freeze_lineage.py
      - .github/workflows/matrix-hybrid-three-model-prospective-oos.yml

permissions:
  contents: write

concurrency:
  group: matrix-hybrid-three-model-prospective-oos
  cancel-in-progress: false

jobs:
  strict-three-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTOMATIC_WAGERING: "false"
      HYBRID_AUTO_PROMOTION: DISABLED
    steps:
      - name: Checkout original physical forecasts and independent outcome settlement
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify actual source identity, PIT and no-post-kickoff-leak
        shell: bash
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = BLOCKED
          test "$AUTOMATIC_WAGERING" = false
          test "$HYBRID_AUTO_PROMOTION" = DISABLED
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=. python -m pytest -q \
            tests/test_matrix_hybrid_three_model_research_oos.py \
            tests/test_matrix_independent_free_poisson_oos.py \
            tests/test_matrix_hybrid_original_dual_freeze_lineage.py

      - name: Verify earliest original freeze versus later research-bound formula freeze
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_hybrid_original_dual_freeze_lineage
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/matrix_hybrid_elite/MATRIX_HYBRID_ORIGINAL_DUAL_FREEZE_LINEAGE_LAST.json").read_bytes())
          assert r["schema"]=="MATRIX_HYBRID_ORIGINAL_DUAL_FREEZE_LINEAGE_V1"
          assert r["physical_fixture_count"]>=37
          assert r["lineage_rejected_fixture_count"]==0,r["rejected"]
          assert r["lineage_matched_fixture_count"]==r["physical_fixture_count"]
          assert r["two_snapshot_fixture_count"]>=37
          assert r["first_frozen_forecast_wins_settlement"] is True
          assert r["second_frozen_forecast_does_not_increment_observation_count"] is True
          assert r["telegram_signal_authorized"] is False
          assert r["real_money"]=="BLOCKED"
          print("ORIGINAL_DUAL_FREEZE_LINEAGE_VERIFIED",r["lineage_matched_fixture_count"])
          PY

      - name: Reconcile three model predictions only with SHA-proven settled results
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_hybrid_three_model_research_oos
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("evidence/matrix_hybrid_elite/MATRIX_HYBRID_THREE_MODEL_OOS_LAST.json")
          result=json.loads(path.read_text(encoding="utf-8"))
          assert result["schema"] == "MATRIX_HYBRID_THREE_MODEL_PROSPECTIVE_RESEARCH_OOS_V1"
          assert result["real_money"] == "BLOCKED"
          assert result["telegram_signal_authorized"] is False
          assert result["automatic_wagering"] is False
          assert result["original_official_p_matrix_present"] is False
          assert result["original_hybrid_lab_model_certified"] is False
          assert result["model_winner_authorized"] is False
          assert result["research_automated_model_promotion"] is False
          assert result["three_model_authenticated_settled_count"] >= 0
          assert result["three_model_authenticated_settled_count"] == len(result["result_rows"])
          if result["underlying_two_model_rejected_count"] or result["three_model_rejected"]:
              raise SystemExit("HYBRID_THREE_MODEL_RESEARCH_INTEGRITY_BLOCKED")
          print("THREE_MODEL_RESEARCH_OUTCOMES",
                result["three_model_authenticated_settled_count"],
                "PENDING", result["three_model_pending_fixture_count"],
                "WINNER_AUTHORIZED", False)
          PY

      - name: Persist research scorecard only, never calibrated MATRIX or signals
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          P="evidence/matrix_hybrid_elite/MATRIX_HYBRID_THREE_MODEL_OOS_LAST.json"
          Q="evidence/matrix_hybrid_elite/MATRIX_HYBRID_ORIGINAL_DUAL_FREEZE_LINEAGE_LAST.json"
          if [ ! -f "$P" ] && [ ! -f "$Q" ]; then echo NO_THREE_MODEL_EVIDENCE; exit 0; fi
          git config user.name matrix-hybrid-three-model-research
          git config user.email matrix-hybrid-three-model-research@users.noreply.github.com
          for E in "$P" "$Q"; do
            if [ -f "$E" ]; then git add -- "$E"; fi
          done
          if git diff --cached --quiet; then echo THREE_MODEL_UNCHANGED; exit 0; fi
          git commit -m "evidence(hybrid): SHA-verified prospective three-model research OOS"
          for retry in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep "$retry"
          done
          exit 1
