name: MATRIX Football Source Recovery Offline
on:
  workflow_dispatch:
  schedule:
    - cron: "47 5,11,17,23 * * *"
permissions:
  contents: read
jobs:
  source-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Test source recovery fail-closed contract
        run: python -m pytest -q tests/test_matrix_football_source_recovery_audit.py
      - name: Inspect available evidence without network calls
        run: python -m tools.matrix_football_source_recovery_audit
      - name: Upload canonical recovery diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: matrix-football-source-recovery
          path: evidence/governance/MATRIX_FOOTBALL_SOURCE_RECOVERY_LAST.json
          if-no-files-found: error
