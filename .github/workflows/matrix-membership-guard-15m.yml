name: MATRIX Membership Guard cada 15 minutos

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: matrix-membership-guard-15m
  cancel-in-progress: false

jobs:
  membership-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests pytest
      - name: Verify membership policy and guard
        run: PYTHONPATH=. python -m pytest -q tests/test_matrix_commercial_architecture_guard.py tests/test_matrix_membership_guard.py
      - name: Enforce membership expiries
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MATRIX_PREMIUM_TELEGRAM_CHAT_ID: ${{ secrets.MATRIX_PREMIUM_TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python -m tools.matrix_membership_guard
      - name: Persist membership evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-membership-guard
          git config user.email matrix-membership-guard@users.noreply.github.com
          git add evidence/notifications/telegram/MATRIX_MEMBERSHIP_LEDGER.json evidence/governance/MATRIX_MEMBERSHIP_GUARD_LAST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence(membership): persist expiry enforcement state"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
