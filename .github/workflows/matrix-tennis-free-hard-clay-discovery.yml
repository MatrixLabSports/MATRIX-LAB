name: MATRIX Tennis Browser-First Free Hard Clay Discovery

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/matrix_tennis_free_browser_daily_discovery.py
      - tests/test_matrix_tennis_free_browser_daily_discovery.py
      - .github/workflows/matrix-tennis-free-hard-clay-discovery.yml

permissions:
  contents: write

concurrency:
  group: matrix-tennis-free-hard-clay-discovery
  cancel-in-progress: false

jobs:
  browser-first-free:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify no fixture or holdout can be invented
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_matrix_tennis_free_browser_daily_discovery.py
      - name: Reconcile today's and yesterday's existing authentic browser captures
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Bogota date +%F)"
          YESTERDAY="$(TZ=America/Bogota date -d yesterday +%F)"
          for D in "$YESTERDAY" "$TODAY"; do
            PYTHONPATH=. python -m tools.matrix_tennis_free_browser_daily_discovery \
              --date "$D" \
              --out "evidence/tennis_calendar_reconciliation/$D/MATRIX_TENNIS_FREE_BROWSER_DISCOVERY.json"
          done
          cp "evidence/tennis_calendar_reconciliation/$TODAY/MATRIX_TENNIS_FREE_BROWSER_DISCOVERY.json" \
             evidence/tennis_calendar_reconciliation/MATRIX_TENNIS_FREE_BROWSER_DISCOVERY_LAST.json
      - name: Assert all Hard and Clay and live admission protections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/tennis_calendar_reconciliation/MATRIX_TENNIS_FREE_BROWSER_DISCOVERY_LAST.json").read_text())
          assert r["source_priority"]==["SOFASCORE","FLASHSCORE","OPTIONAL_AUTHORIZED_API"]
          assert r["model_calibration_mutated"] is False
          assert r["hard_new_prospective_observations"]==0
          assert r["clay_new_prospective_observations"]==0
          assert r["telegram_signal_authorized"] is False
          assert r["real_money"]=="BLOCKED"
          print("BROWSER_FIRST_DISCOVERY_ONLY_NOT_ADMISSION",r["observed_source_links"])
          PY
      - name: Persist free discovery research without touching original model or holdouts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-free-tennis-discovery"
          git config user.email "matrix-free-tennis-discovery@users.noreply.github.com"
          git add -- evidence/tennis_calendar_reconciliation
          if git diff --cached --quiet; then
            echo "NO_NEW_BROWSER_EVIDENCE"
            exit 0
          fi
          git commit -m "evidence(tennis): browser-first free Hard/Clay source discovery"
          for i in 1 2 3 4 5; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then
              echo "BROWSER_FIRST_FREE_DISCOVERY_PERSISTED"
              exit 0
            fi
            sleep "$i"
          done
          exit 1
