name: MATRIX Workflow Regression Contracts

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/workflow-regression-contracts.yml
      - .github/workflows/football-clv-continuous-watcher.yml
      - .github/workflows/telegram-green-signals.yml
      - tools/football_clv_tracking_cycle.py
      - tools/workflow_regression_contracts.py
      - tests/test_football_clv_tracking_cycle.py
      - tests/test_telegram_sharp_reference_gate.py
      - tests/test_football_sharp_consensus.py
      - tests/test_telegram_monitoring_watchdog.py
      - tests/test_telegram_quote_recovery_window.py
      - tools/telegram_causal_trace.py
      - tests/test_telegram_causal_trace.py
  pull_request:
    paths:
      - .github/workflows/football-clv-continuous-watcher.yml
      - .github/workflows/telegram-green-signals.yml
      - tools/football_clv_tracking_cycle.py
      - tools/workflow_regression_contracts.py

permissions:
  contents: read

concurrency:
  group: matrix-workflow-regression-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest requests Pillow

      - name: Enforce semantic workflow contracts
        run: PYTHONPATH=. python -m tools.workflow_regression_contracts

      - name: Re-run certified CLV and Telegram regressions
        run: |
          PYTHONPATH=. python -m pytest -q             tests/test_football_clv_tracking_cycle.py             tests/test_telegram_sharp_reference_gate.py             tests/test_football_sharp_consensus.py             tests/test_telegram_monitoring_watchdog.py             tests/test_telegram_quote_recovery_window.py

      - name: Verify causal trace without provider calls
        run: PYTHONPATH=. python -m pytest -q tests/test_telegram_causal_trace.py

      - name: Generate and validate immutable Telegram causal trace
        run: |
          PYTHONPATH=. python -m tools.telegram_causal_trace
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("evidence/notifications/telegram/MATRIX_TELEGRAM_CAUSAL_TRACE_LAST.json").read_text())
          assert report["current_schema_attempts"] == sum(report["identity_states"].values())
          assert report["current_schema_attempts"] == sum(report["discard_reasons"].values())
          assert report["exact_over_2_5_seen_attempts"] == sum(report["exact_line_seen_discard_reasons"].values())
          assert report["exact_over_2_5_seen_attempts"] == sum(report["exact_line_seen_identity_states"].values())
          assert report["exact_line_seen_but_executable_quote_rejected_attempts"] <= report["exact_over_2_5_seen_attempts"]
          print("TELEGRAM_CAUSAL_STRATA_CONSISTENT")
          PY
          python -m json.tool evidence/notifications/telegram/MATRIX_TELEGRAM_CAUSAL_TRACE_LAST.json > /dev/null
          test -z "$(git status --porcelain -- evidence/notifications/telegram/MATRIX_TELEGRAM_QUOTE_ATTEMPTS.jsonl)"

      - name: Preserve causal trace as downloadable CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-telegram-causal-trace
          path: evidence/notifications/telegram/MATRIX_TELEGRAM_CAUSAL_TRACE_LAST.json
          if-no-files-found: warn
          retention-days: 14

      - name: Final CI gate
        run: |
          test "$REAL_MONEY" = "BLOCKED"
          test "$AUTO_BETTING" = "DISABLED"
          echo "MATRIX_WORKFLOW_REGRESSION_CI=PASS"
