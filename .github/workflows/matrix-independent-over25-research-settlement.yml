name: MATRIX Independent Over25 Prospectively Frozen Results

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/matrix_independent_over25_research_settlement.py
      - tests/test_matrix_independent_over25_research_settlement.py
      - .github/workflows/matrix-independent-over25-research-settlement.yml

permissions:
  contents: write

concurrency:
  group: matrix-independent-over25-research-settlement
  cancel-in-progress: false

jobs:
  independent-research-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
      MATRIX_MODE: SHADOW
    steps:
      - name: Checkout original research branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install independent tests
        run: python -m pip install --disable-pip-version-check pytest

      - name: Prove settlement never reuses future scores or modifies forecasts
        run: PYTHONPATH=. python -m pytest -q tests/test_matrix_independent_over25_research_settlement.py tests/test_matrix_independent_over25_prematch_freeze.py

      - name: Capture final independent scores only after kickoff, never betting
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = BLOCKED
          test "$AUTO_BETTING" = DISABLED
          PYTHONPATH=. python -m tools.matrix_independent_over25_research_settlement

      - name: Validate latest settlement has original risk gates closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("evidence/football_world_inventory/MATRIX_INDEPENDENT_OVER25_SETTLEMENT_LAST.json").read_text(encoding="utf-8"))
          assert j["real_money"]=="BLOCKED"
          assert j["telegram_signal_authorized"] is False
          assert j["automatic_wagering"] is False
          assert j["original_calibrated_parameters_mutated"] is False
          assert j["scientific_six_league_oos_certified"] is False
          assert j["http_calls"]<=6
          print("AUTHENTIC_RESEARCH_SETTLEMENT_ONLY",j["scanned_forecasts"],j["settled_total"],j["http_calls"])
          PY

      - name: Persist settled original source bytes and freeze ledger immutably
        run: |
          set -euo pipefail
          git config user.name "matrix-independent-over25-results"
          git config user.email "matrix-independent-over25-results@users.noreply.github.com"
          git add -- evidence/football_world_inventory/MATRIX_INDEPENDENT_OVER25_SETTLEMENT_LAST.json
          if [ -d evidence/football_research_freezes ]; then
            git add -- evidence/football_research_freezes
          fi
          if git diff --cached --quiet; then
            echo "NO_RESEARCH_RESULT_CHANGE"
            exit 0
          fi
          git commit -m "evidence(over25): persist independently observed settled frozen forecast"
          for retry in 1 2 3 4 5; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then
              echo "PROSPECTIVE_RESULTS_PHYSICALLY_PERSISTED"
              exit 0
            fi
            sleep "$retry"
          done
          exit 1
