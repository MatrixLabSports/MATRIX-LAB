# MATRIX_COLOMBIA_14BOOK_RECHECK_24OCT2026
# MATRIX_SHARP_CATALOG_RECHECK_21OCT2026
name: MATRIX odds-api.net Colombia Catalog Probe

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/odds-api-net-colombia-catalog-probe.yml

permissions:
  contents: write

concurrency:
  group: odds-api-net-colombia-catalog-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Validate governed secret
        env:
          ODDS_API_NET_KEY: ${{ secrets.ODDS_API_NET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ODDS_API_NET_KEY"
          test "$REAL_MONEY" = "BLOCKED"
          test "$AUTO_BETTING" = "DISABLED"
          echo "ODDS_API_NET_KEY_PRESENT_REAL_MONEY_BLOCKED"

      - name: Run Colombia catalog probe
        env:
          ODDS_API_NET_KEY: ${{ secrets.ODDS_API_NET_KEY }}
        run: PYTHONPATH=. python -m tools.odds_api_net_colombia_catalog_probe

      - name: Persist physical evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-odds-catalog
          git config user.email matrix-odds-catalog@users.noreply.github.com
          git add evidence/odds_api_net/colombia_catalog/manifest.json
          git add evidence/odds_api_net/colombia_catalog/colombia_bookmakers.bin
          if git diff --cached --quiet; then
            echo "NO_CATALOG_CHANGES"
            exit 0
          fi
          git commit -m "evidence(odds): persist Colombia bookmaker catalog"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then
              exit 0
            fi
            sleep $((attempt*2))
          done
          exit 1
