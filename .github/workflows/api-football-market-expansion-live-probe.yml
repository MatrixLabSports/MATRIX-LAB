name: API-Football market expansion live probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-market-expansion-live-probe.yml
  schedule:
    - cron: "13,28,43,58 * * * *"

permissions:
  contents: write

concurrency:
  group: api-football-market-expansion-live-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests pytest

      - name: Credential preflight
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}"
          API_FOOTBALL_KEY="$API_FOOTBALL_KEY" python - <<'PY'
          import os
          os.environ["API_FOOTBALL_KEY"].encode("ascii")
          print("API_FOOTBALL_CREDENTIAL: CONFIGURED")
          PY

      - name: Syntax gate
        run: python -m py_compile tools/api_football_market_expansion_live_probe.py

      - name: Run governed live probes
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m tools.api_football_market_expansion_live_probe


      - name: One-shot verify global strength map
        run: |
          python -m pytest -q tests/test_matrix_global_strength_map.py
          python -m tools.matrix_global_strength_map

      - name: Enforce global strength-map protections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/global_strength_map/strength_map.json").read_text())
          assert p["status"]=="PASS"
          assert p["protections"]["read_only_evidence_aggregation"] is True
          assert p["protections"]["changes_p_matrix"] is False
          assert p["protections"]["changes_frozen_probabilities"] is False
          assert p["protections"]["changes_model_parameters"] is False
          assert p["protections"]["opens_sealed_tennis_metrics"] is False
          assert p["protections"]["real_money"]=="BLOCKED"
          print("GLOBAL_STRENGTH_MAP_ONE_SHOT: PASS")
          PY

      - name: Enforce no-promotion protections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/api_football/market_expansion/live_probe/last_run.json").read_text())
          assert p["status"]=="PASS"
          assert p["team_total_shots_prospective_freeze_allowed"] is False
          assert p["player_shots_prospective_freeze_allowed"] is False
          assert p["automatic_wagering"] is False
          assert p["real_money"]=="BLOCKED"
          print("MATRIX_MARKET_EXPANSION_LIVE_PROBE_GATE: PASS")
          PY

      - name: Persist live-probe evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-market-expansion"
          git config user.email "matrix-football-market-expansion@users.noreply.github.com"
          git add evidence/api_football/market_expansion/live_probe
          git add evidence/global_strength_map
          if git diff --cached --quiet; then
            echo "NO_MARKET_EXPANSION_MATERIAL_CHANGE"
            exit 0
          fi
          git commit -m "evidence(football): persist market expansion live probe"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline

