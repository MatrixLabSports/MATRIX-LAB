name: API-Football Over 2.5 live odds probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-over25-live-odds-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install requests

      - name: Run Over 2.5 odds probe
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m tools.api_football_over25_live_odds_probe

      - name: Enforce protections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/api_football/over25_live_odds/last_run.json").read_text())
          assert p["status"]=="PASS"
          assert p["automatic_wagering"] is False
          assert p["real_money"]=="BLOCKED"
          print("OVER25_LIVE_ODDS_PROBE: PASS")
          PY

      - name: Persist odds evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-over25-odds"
          git config user.email "matrix-football-over25-odds@users.noreply.github.com"
          git add evidence/api_football/over25_live_odds
          git commit -m "evidence(football): persist current Over 2.5 odds"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
