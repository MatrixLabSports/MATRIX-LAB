name: MATRIX Tennis Opera 03NOV Physical Dual-Source Link Audit

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - evidence/tennis_calendar_physical/2026-11-03/**
      - tools/matrix_tennis_opera_03nov_link_audit.py
      - tests/test_matrix_tennis_opera_03nov_link_audit.py
      - .github/workflows/matrix-tennis-opera-03nov-link-audit.yml

permissions:
  contents: write

concurrency:
  group: matrix-tennis-opera-03nov-readonly
  cancel-in-progress: false

jobs:
  certify-link-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTOMATIC_WAGERING: "false"
    steps:
      - name: Checkout only the operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Strict regression tests on observed source data
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_matrix_tennis_opera_03nov_link_audit.py

      - name: Verify the date-scoped evidence and generate read-only reconciliation
        shell: bash
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = BLOCKED
          test "$AUTOMATIC_WAGERING" = false
          ROOT=evidence/tennis_calendar_physical/2026-11-03
          OUT=evidence/tennis_calendar_reconciliation/2026-11-03/MATRIX_TENNIS_OPERA_DUAL_SOURCE_LINK_REVIEW.json
          PYTHONPATH=. python -m tools.matrix_tennis_opera_03nov_link_audit \
            --sofascore "$ROOT/sofascore_opera_full_link_observations.json" \
            --flashscore "$ROOT/flashscore_opera_full_link_observations.json" \
            --out "$OUT"
          python - "$OUT" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          c=r["source_counts"]
          assert r["schema"]=="MATRIX_TENNIS_OPERA_20261103_DUAL_SOURCE_LINK_REVIEW_V1"
          assert r["target_date_bogota"]=="2026-11-03"
          assert r["source_order"]==["SOFASCORE","FLASHSCORE","APIS"]
          assert r["status"]=="PLAYER_LINK_IDENTITY_CANDIDATES_ONLY_NOT_CERTIFIED_FIXTURES"
          assert c["sofascore_visible_links"]==688
          assert c["sofascore_explicit_target_date_links"]==678
          assert c["sofascore_without_target_date"]==10
          assert c["sofascore_date_with_visible_clock"]==640
          assert c["sofascore_date_without_visible_clock"]==38
          assert c["flashscore_visible_links"]==423
          assert c["flashscore_named_player_pair_unique_links"]==276
          assert c["flashscore_unstructured_links"]==133
          assert r["candidate_pair_count"]==230
          assert r["date_without_visible_clock_link_review_eligible"] is False
          assert r["ambiguous_pair_count"]==0
          assert all(x["same_fixture_certified"] is False for x in r["candidate_pairs"])
          assert r["flashscore_date_selector"]=="martes, 3 de noviembre de 2026"
          assert r["flashscore_individual_match_date_certified"] is False
          assert r["provider_page_coverage_complete"] is False
          assert r["same_fixture_date_cross_provider_certified"] is False
          assert r["utc_kickoff_certified"] is False
          assert r["surface_certified"] is False
          assert r["bookmaker_quote_verified"] is False
          assert r["model_probability_generation_authorized"] is False
          assert r["calibration_parameters_modified"] is False
          assert r["signal_generation_authorized"] is False
          assert r["telegram_messages_sent"]==0
          assert r["automatic_wagering"] is False
          assert r["real_money"]=="BLOCKED"
          assert all(len(v)==64 for v in r["source_sha256"].values())
          print("PASS_688_SOFA_423_FLASH_230_TIMED_PLAYER_LINK_CANDIDATES_NO_SIGNAL_PROMOTION")
          PY

      - name: Store only diagnostic proof in GitHub
        shell: bash
        run: |
          set -euo pipefail
          P=evidence/tennis_calendar_reconciliation/2026-11-03/MATRIX_TENNIS_OPERA_DUAL_SOURCE_LINK_REVIEW.json
          git config user.name matrix-tennis-browser-first
          git config user.email matrix-tennis-browser-first@users.noreply.github.com
          git add "$P"
          if git diff --cached --quiet; then
            echo REVIEW_EVIDENCE_ALREADY_COMMITTED
            exit 0
          fi
          git commit -m "evidence(tennis): persist 03nov Opera dual-source player-link-only reconciliation"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
