name: MATRIX RapidAPI Tennis Live Shadow

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/rapidapi_tennis_live_shadow.py
      - tests/test_rapidapi_tennis_live_shadow.py
      - .github/workflows/rapidapi-tennis-live-shadow.yml

permissions:
  contents: write

concurrency:
  group: rapidapi-tennis-live-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install requests pytest

      - name: Prove shadow governance
        run: python -m pytest -q tests/test_rapidapi_tennis_live_shadow.py tests/test_api_tennis_retired_no_network.py

      - name: Capture targeted live shadow
        env:
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
        run: |
          D="$(TZ=America/Bogota date +%F)"
          python -m tools.rapidapi_tennis_live_shadow             --cycles 4             --interval-seconds 15             --out "evidence/live_tennis_lab/$D/MATRIX_RAPIDAPI_TENNIS_LIVE_SHADOW_V1.json"

      - name: Validate no calibration admission
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          d=datetime.now(ZoneInfo("America/Bogota")).date().isoformat()
          p=Path(f"evidence/live_tennis_lab/{d}/MATRIX_RAPIDAPI_TENNIS_LIVE_SHADOW_V1.json")
          j=json.loads(p.read_text())
          assert j["calibration_admission"]["admitted_to_existing_live_gate"] is False
          assert j["protections"]["api_tennis_retired_source_used"] is False
          assert j["protections"]["metrics_opened"] is False
          assert j["protections"]["real_money"] == "BLOCKED"
          print(json.dumps({
              "network_calls":j["network_calls"],
              "challenger_men_clay_candidate_rows":j["challenger_men_clay_candidate_rows"],
              "quality_valid_shadow_candidate_rows":j["quality_valid_shadow_candidate_rows"],
              "candidate_event_ids":j["candidate_event_ids"]
          },sort_keys=True))
          PY

      - name: Persist shadow evidence only
        run: |
          D="$(TZ=America/Bogota date +%F)"
          git config user.name matrix-rapidapi-tennis-live-shadow
          git config user.email matrix-rapidapi-tennis-live-shadow@users.noreply.github.com
          git add "evidence/live_tennis_lab/$D/MATRIX_RAPIDAPI_TENNIS_LIVE_SHADOW_V1.json"
          if git diff --cached --quiet; then
            echo "NO_SHADOW_CHANGE"
            exit 0
          fi
          git commit -m "evidence(live): capture RapidAPI Tennis shadow"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then
              exit 0
            fi
            sleep $((attempt*2))
          done
          exit 1
