name: API-Football canonical PIT analysis inputs

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - app/research/football/match_analysis_input.py
      - tools/api_football_canonicalize_analysis_inputs.py
      - tools/api_football_freeze_experimental_shadow.py
      - tools/api_football_compare_shadow_to_pinnacle.py
      - tests/test_api_football_canonical_analysis_inputs.py
      - tests/test_api_football_experimental_shadow_freeze.py
      - tests/test_api_football_shadow_pinnacle_comparison.py
      - evidence/api_football/team_last_fallback/benchmark_after_team_last.json
      - evidence/api_football/team_last_fallback/history_readiness_after_team_last.json
      - .github/workflows/api-football-canonical-analysis-inputs.yml

permissions:
  contents: write

concurrency:
  group: api-football-canonical-pit-analysis-inputs
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install targeted test dependency
        run: python -m pip install pytest

      - name: Run temporal canonicalization tests
        run: python -m pytest -q tests/test_api_football_canonical_analysis_inputs.py

      - name: Run shadow-freeze adversarial tests
        run: python -m pytest -q tests/test_api_football_experimental_shadow_freeze.py

      - name: Run Pinnacle diagnostic comparison tests
        run: python -m pytest -q tests/test_api_football_shadow_pinnacle_comparison.py

      - name: Build canonical analysis inputs at true runtime UTC
        run: python -m tools.api_football_canonicalize_analysis_inputs

      - name: Enforce PIT and governance invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path

          from tools.api_football_canonicalize_analysis_inputs import (
              MAX_TRACKED_TEXT_BYTES,
              load_chunked_canonical_bundle,
          )

          root = Path("evidence/api_football/canonical_analysis")
          bundle, manifest = load_chunked_canonical_bundle(root)

          assert manifest["status"] == "PASS"
          assert manifest["analysis_as_of_source"] == "RUNTIME_UTC_NOW"
          assert manifest["real_money"] == "BLOCKED"
          assert manifest["automatic_wagering"] is False
          assert manifest["model_probability_generated"] is False
          assert manifest["p_matrix_status"] == "NOT_GENERATED"
          assert manifest["baseline_poisson_status"] == "EXPERIMENTAL_NOT_PROMOTED"
          assert manifest["odds_used_to_generate_model_probability"] is False

          assert bundle["analysis_as_of_utc"] == manifest["analysis_as_of_utc"]
          assert len(bundle["inputs"]) == manifest["ready_input_count"]
          assert len(bundle["blocked_future_inputs"]) == manifest["blocked_future_input_count"]
          assert len(bundle["not_future_targets"]) == manifest["not_future_at_analysis_count"]

          assert manifest["storage_format"] == "CHUNKED_JSON_V1"
          assert manifest["legacy_monolith_removed"] is True
          assert not (root / "canonical_inputs.json").exists()
          chunk_paths = sorted((root / "chunks").glob("part_*.json"))
          assert len(chunk_paths) == manifest["chunk_count"]
          assert all(path.stat().st_size <= MAX_TRACKED_TEXT_BYTES for path in chunk_paths)

          as_of = datetime.fromisoformat(manifest["analysis_as_of_utc"])
          for row in bundle["inputs"]:
              kickoff = datetime.fromisoformat(row["kickoff_utc"])
              assert as_of < kickoff
              assert row["as_of_utc"] == manifest["analysis_as_of_utc"]
              assert row["readiness"]["status"] == "READY_FOR_EXPERIMENTAL_EVALUATION"
              for history in list(row["home_history"]) + list(row["away_history"]):
                  observed = datetime.fromisoformat(history["observed_at_utc"])
                  history_kickoff = datetime.fromisoformat(history["kickoff_utc"])
                  assert history_kickoff < kickoff
                  assert observed <= as_of
                  assert observed < kickoff

          print("API_FOOTBALL_CANONICAL_PIT_INPUT_GATE: PASS")
          print("analysis_as_of_utc=", manifest["analysis_as_of_utc"])
          print("total_fixture_count=", manifest["total_fixture_count"])
          print("ready_input_count=", manifest["ready_input_count"])
          print("blocked_future_input_count=", manifest["blocked_future_input_count"])
          print("not_future_at_analysis_count=", manifest["not_future_at_analysis_count"])
          print("storage_format=", manifest["storage_format"])
          print("chunk_count=", manifest["chunk_count"])
          print("p_matrix_status=", manifest["p_matrix_status"])
          print("real_money=", manifest["real_money"])
          PY

      - name: Freeze synchronized experimental research baseline
        run: python -m tools.api_football_freeze_experimental_shadow

      - name: Enforce canonical-to-shadow synchronization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime
          import json
          from pathlib import Path

          canonical = json.loads(
              Path("evidence/api_football/canonical_analysis/manifest.json").read_text(encoding="utf-8")
          )
          shadow = json.loads(
              Path("evidence/api_football/experimental_shadow/shadow_freeze.json").read_text(encoding="utf-8")
          )
          adjudication = json.loads(
              Path("evidence/api_football/experimental_shadow/engine_adjudication.json").read_text(encoding="utf-8")
          )

          assert shadow["source_canonical_bundle_sha256"] == canonical["bundle_sha256"]
          assert shadow["source_canonical_analysis_as_of_utc"] == canonical["analysis_as_of_utc"]
          assert datetime.fromisoformat(shadow["freeze_at_utc"]) >= datetime.fromisoformat(canonical["analysis_as_of_utc"])
          assert shadow["frozen_prediction_count"] <= canonical["ready_input_count"]
          assert shadow["p_matrix_status"] == "NOT_GENERATED"
          assert shadow["model_status"] == "EXPERIMENTAL_NOT_PROMOTED"
          assert shadow["protections"]["odds_used_to_generate_probability"] is False
          assert shadow["protections"]["outcomes_used_to_generate_probability"] is False
          assert shadow["protections"]["real_money"] == "BLOCKED"
          assert adjudication["frozen_shadow_input_count"] == shadow["frozen_prediction_count"]
          assert adjudication["governed_p_matrix_engine_available"] is False
          assert adjudication["real_money"] == "BLOCKED"

          freeze = datetime.fromisoformat(shadow["freeze_at_utc"])
          for row in shadow["rows"]:
              assert freeze < datetime.fromisoformat(row["kickoff_utc"])
              assert row["market_count"] >= 3
              assert row["decision"] == "NO_BET"
              assert row["p_matrix"] is None

          print("API_FOOTBALL_CANONICAL_SHADOW_SYNC_GATE: PASS")
          print("canonical_bundle_sha256=", canonical["bundle_sha256"])
          print("analysis_as_of_utc=", canonical["analysis_as_of_utc"])
          print("freeze_at_utc=", shadow["freeze_at_utc"])
          print("frozen_prediction_count=", shadow["frozen_prediction_count"])
          PY

      - name: Compare synchronized shadow to Pinnacle reference diagnostically
        run: python -m tools.api_football_compare_shadow_to_pinnacle

      - name: Enforce Pinnacle diagnostic isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("evidence/api_football/pinnacle_shadow_comparison/manifest.json").read_text(encoding="utf-8")
          )
          comparison = json.loads(
              Path("evidence/api_football/pinnacle_shadow_comparison/comparison.json").read_text(encoding="utf-8")
          )

          assert manifest["status"] == "PASS"
          assert manifest["comparison_role"] == "DIAGNOSTIC_REFERENCE_ONLY"
          assert manifest["p_matrix_status"] == "NOT_GENERATED"
          assert manifest["odds_used_to_generate_shadow_probability"] is False
          assert manifest["model_promotion"] is False
          assert manifest["automatic_wagering"] is False
          assert manifest["real_money"] == "BLOCKED"
          assert comparison["protections"]["odds_used_to_generate_shadow_probability"] is False
          assert comparison["protections"]["outcomes_used_to_generate_shadow_probability"] is False
          assert comparison["protections"]["reference_is_diagnostic_only"] is True
          assert comparison["protections"]["reference_does_not_promote_model"] is True
          assert comparison["protections"]["real_money"] == "BLOCKED"
          assert len(comparison["rows"]) == manifest["comparison_row_count"]
          assert len({row["fixture_id"] for row in comparison["rows"]}) == manifest["matched_fixture_count"]
          assert all(row["decision"] == "NO_BET" for row in comparison["rows"])

          print("API_FOOTBALL_PINNACLE_DIAGNOSTIC_ISOLATION_GATE: PASS")
          print("matched_fixture_count=", manifest["matched_fixture_count"])
          print("comparison_row_count=", manifest["comparison_row_count"])
          print("accepted_pinnacle_quote_observations_scanned=", manifest["accepted_pinnacle_quote_observations_scanned"])
          print("rejected_pinnacle_quote_observations=", manifest["rejected_pinnacle_quote_observations"])
          print("real_money=", manifest["real_money"])
          PY

      - name: Persist canonical PIT, synchronized shadow and Pinnacle diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-api-football-canonical"
          git config user.email "matrix-api-football-canonical@users.noreply.github.com"
          git add evidence/api_football/canonical_analysis evidence/api_football/experimental_shadow evidence/api_football/pinnacle_shadow_comparison
          if git diff --cached --quiet; then
            echo "NO_CANONICAL_ANALYSIS_EVIDENCE_CHANGE"
            exit 0
          fi
          git commit -m "evidence(api-football): persist canonical PIT analysis inputs"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
