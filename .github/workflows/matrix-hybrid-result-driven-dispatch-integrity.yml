name: MATRIX Hybrid Result Driven Dispatch Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/matrix-independent-over25-research-settlement.yml
      - .github/workflows/matrix-independent-free-poisson-oos.yml
      - .github/workflows/matrix-hybrid-three-model-prospective-oos.yml
      - .github/workflows/matrix-hybrid-four-model-prospective-oos.yml
      - .github/workflows/matrix-hybrid-result-driven-dispatch-integrity.yml
      - tests/test_matrix_hybrid_result_driven_dispatch_contract.py
  schedule:
    - cron: "37 5 * * *"

permissions:
  contents: read

jobs:
  check-result-driven-hybrid-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REAL_MONEY: BLOCKED
      AUTOMATIC_WAGERING: "false"
      HYBRID_AUTO_PROMOTION: DISABLED
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            tests/test_matrix_hybrid_result_driven_dispatch_contract.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline workflow contract dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML
      - name: Prove chained triggers require genuine newly verified results
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = BLOCKED
          test "$AUTOMATIC_WAGERING" = false
          test "$HYBRID_AUTO_PROMOTION" = DISABLED
          PYTHONPATH=. python -m pytest -q tests/test_matrix_hybrid_result_driven_dispatch_contract.py
