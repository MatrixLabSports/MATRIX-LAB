name: API-Football Player Shots Role Certification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-player-shots-role-certification.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-football-player-shots-role-certification
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pytest requests

      - name: Verify role mapping
        run: python -m pytest -q tests/test_api_football_player_shots_role_source_certification.py

      - name: Certify historical to prematch role equivalence
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m tools.api_football_player_shots_role_source_certification

      - name: Initialize prospective lane
        run: python -m tools.api_football_player_shots_prospective_init

      - name: Enforce governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/api_football/market_expansion/player_shots_role_certification/last_run.json").read_text())
          s=json.loads(Path("evidence/api_football/player_shots_prospective/state.json").read_text())
          assert s["real_money"]=="BLOCKED"
          assert s["automatic_wagering"] is False
          assert s["parameter_tuning_allowed"] is False
          assert s["gates"]["30"]["metrics_opened"] is False
          if p["prospective_freeze_allowed"]:
              assert s["status"]=="ACTIVE_WAITING_FIRST_PREMATCH_FREEZE"
              assert s["cross_source_role_equivalence_certified"] is True
              assert s["expected_minutes_pit_prospective_certified"] is True
          else:
              assert s["status"]=="BLOCKED_SOURCE_CERTIFICATION"
          print("PLAYER_SHOTS_PROSPECTIVE_GOVERNANCE: PASS")
          PY

      - name: Persist evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-player-shots"
          git config user.email "matrix-football-player-shots@users.noreply.github.com"
          git add evidence/api_football/market_expansion/player_shots_role_certification
          git add evidence/api_football/player_shots_prospective
          git commit -m "evidence(football): certify Player Shots role source and initialize lane"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
