name: API-Football extended team models v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-extended-team-models-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-football-extended-team-models-v2
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Verify temporal selection tests
        run: python -m pytest -q tests/test_api_football_extended_team_models_v2.py

      - name: Build v2 challengers
        run: python -m tools.api_football_extended_team_models_v2

      - name: Enforce v2 governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/api_football/market_expansion/team_models_v2/summary.json").read_text())
          assert p["selection_policy"]=="TEMPORAL_INTERNAL_FOLDS_ON_TRAIN_ONLY; FINAL_50_UNTOUCHED_UNTIL_FINAL_EVALUATION"
          assert p["prospective_gates"]==[30,50,100,200]
          assert p["automatic_wagering"] is False
          assert p["real_money"]=="BLOCKED"
          for lane,row in p["lanes"].items():
              assert row["train_count"]>=200
              assert row["validation_count"]==50
          print("MATRIX_EXTENDED_TEAM_MODELS_V2_GATE: PASS")
          PY

      - name: Persist v2 model evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-extended-models-v2"
          git config user.email "matrix-football-extended-models-v2@users.noreply.github.com"
          git add evidence/api_football/market_expansion/team_models_v2
          if git diff --cached --quiet; then
            echo "NO_V2_MODEL_EVIDENCE_TO_PERSIST"
            exit 3
          fi
          git commit -m "evidence(football): persist extended v2 historical OOS models"
          git status --porcelain
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
