name: MATRIX Colombia 239 Authentic Over25 Research Quotes 15m
on:
  schedule:
    - cron: "7,22,37,52 21-23 24 11 *"
    - cron: "7,22,37,52 0-1 25 11 *"
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
      - main
    paths:
      - .github/workflows/matrix-colombia-239-authentic-quote-research-15m.yml
      - tools/matrix_colombia_239_safe_research_quote_adapter.py
      - tests/test_matrix_colombia_239_safe_research_quote_adapter.py
permissions:
  contents: write
concurrency:
  group: matrix-independent-over25-quote-watcher-15m
  cancel-in-progress: false
jobs:
  research-only-quote-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - name: Checkout operative research files, never alter production calibrations
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tested research quote dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Validate no-odds-outside-120m and strict research-only identity
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_matrix_colombia_239_safe_research_quote_adapter.py
      - name: Collect native provider odds only within 120m of a genuinely matched event
        env:
          ODDS_API_NET_KEY: ${{ secrets.ODDS_API_NET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          P="evidence/football_world_inventory/2026-11-24/MATRIX_COL_239_RESEARCH_QUOTE_LAST.json"
          PYTHONPATH=. python -m tools.matrix_colombia_239_safe_research_quote_adapter \
            --observations evidence/football_world_inventory/2026-11-24/MATRIX_COLOMBIA_BROWSER_THREE_SOURCE_DIRECT_OBSERVATIONS.json \
            --three-source evidence/football_world_inventory/2026-11-24/MATRIX_COLOMBIA_THREE_SOURCE_READINESS_RUN_45090559298.json \
            --shadow evidence/football_world_inventory/2026-11-22/MATRIX_COLOMBIA_239_ORIGINAL_FORMULA_SHADOW_RUN_45089678156.json \
            --previous "$P" --out "$P"
          python - "$P" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["real_money"]=="BLOCKED"
          assert d["automatic_wagering"] is False
          assert d["telegram_messages_sent"]==0
          assert d["signal_generation_authorized"] is False
          assert d["production_p_matrix_authorized"] is False
          assert d["official_original_model_enriched_feature_parity_verified"] is False
          print("COLOMBIA_AUTHENTIC_PRICES_RESEARCH_ONLY",d["network_calls"],d["bookmaker_quote_verified_count"],d["sharp_120s_verified_count"])
          PY
      - name: Persist only genuine source network attempts, no wagers or Telegram
        shell: bash
        run: |
          set -euo pipefail
          P="evidence/football_world_inventory/2026-11-24/MATRIX_COL_239_RESEARCH_QUOTE_LAST.json"
          CALLS="$(python - "$P" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding="utf-8"))["network_calls"])
          PY
          )"
          if [ "$CALLS" -eq 0 ]; then
            echo "NO_AUTHENTIC_QUOTE_REQUEST_OUTSIDE_WINDOW_OR_PROVIDER_BLOCK"
            exit 0
          fi
          git config user.name matrix-colombia-research-quotes
          git config user.email matrix-colombia-research-quotes@users.noreply.github.com
          git add -- "$P"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence(colombia): real-time research-only Colombia Over25 book and sharp quote attempts"
          for attempt in 1 2 3; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
