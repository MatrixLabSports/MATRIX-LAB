name: API-Football market-scoped SHADOW P_MATRIX

on:
  push:
    branches: [repair/cor09-world-pipeline]
    paths:
      - 'tools/api_football_market_shadow_p_matrix.py'
      - 'tests/test_api_football_market_shadow_p_matrix.py'
      - '.github/workflows/api-football-market-shadow-p-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-football-market-shadow-p-matrix
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run fail-closed tests
        run: python -m pytest -q tests/test_api_football_market_shadow_p_matrix.py
      - name: Generate real prospective SHADOW P_MATRIX
        run: python -m tools.api_football_market_shadow_p_matrix
      - name: Enforce output governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/api_football/prospective_daily/2026-10-06/20261005T122152Z/p_matrix_shadow/p_matrix_shadow.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['p_matrix_status']=='GENERATED_SHADOW'
          assert x['scored_count'] > 0
          assert x['source_ready_input_count']==148
          assert x['markets_generated']==['1x2','over_2_5']
          assert x['btts_status']=='BLOCKED_FINAL_HOLDOUT_NOT_SUPERIOR'
          assert x['protections']['parameter_refit'] is False
          assert x['protections']['parameter_search'] is False
          assert x['protections']['final_holdout_reused'] is False
          assert x['protections']['odds_used_to_generate_probability'] is False
          assert x['protections']['target_outcomes_used'] is False
          assert x['protections']['automatic_wagering'] is False
          assert x['protections']['real_money']=='BLOCKED'
          print('MATRIX_FOOTBALL_SHADOW_P_MATRIX_GATE: PASS')
          print('scored_count=',x['scored_count'])
          print('blocked_count=',x['blocked_count'])
          print('bundle_sha256=',x['bundle_sha256'])
          PY
      - name: Persist physical evidence
        run: |
          set -euo pipefail
          git config user.name 'matrix-football-shadow-p-matrix'
          git config user.email 'matrix-football-shadow-p-matrix@users.noreply.github.com'
          git add evidence/api_football/prospective_daily/2026-10-06/20261005T122152Z/p_matrix_shadow/p_matrix_shadow.json
          if git diff --cached --quiet; then
            echo 'NO_NEW_P_MATRIX_EVIDENCE'
            exit 3
          fi
          git commit -m 'evidence(football): persist first prospective SHADOW P_MATRIX'
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
