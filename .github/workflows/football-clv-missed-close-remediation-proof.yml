name: MATRIX Football CLV missed-close remediation proof

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/football-clv-missed-close-remediation-proof.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest requests

      - name: Run CLV remediation tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_football_clv_tracking_cycle.py \
            tests/test_football_clv_odds_api_net_capture.py

      - name: Verify main watcher architecture
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/football-clv-continuous-watcher.yml > /tmp/clv-watcher.yml
          grep -q "football_clv_odds_api_net_capture" /tmp/clv-watcher.yml
          grep -q "ODDS_API_NET_KEY" /tmp/clv-watcher.yml
          grep -q "CLV_WATCHER_OPERATIONAL_REFRESH=PASS" /tmp/clv-watcher.yml
          grep -q "git rebase --autostash origin/repair/cor09-world-pipeline" /tmp/clv-watcher.yml
          grep -q "POLL_SECONDS: 90" /tmp/clv-watcher.yml

      - name: Write remediation proof
        shell: bash
        env:
          ODDS_API_NET_KEY: ${{ secrets.ODDS_API_NET_KEY }}
        run: |
          set -euo pipefail
          mkdir -p evidence/clv/football/over_2_5
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path("evidence/clv/football/over_2_5")
          diagnosis=json.loads((root/"MATRIX_CLV_MISSED_CLOSE_ROOT_CAUSE_15OCT2026.json").read_text())
          payload={
              "schema":"MATRIX_FOOTBALL_CLV_MISSED_CLOSE_REMEDIATION_PROOF_V1",
              "verified_at_utc":datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
              "workflow_sha":os.environ.get("GITHUB_SHA"),
              "tests_passed":True,
              "root_cause_classification":diagnosis["classification"],
              "repairs":{
                  "per_attempt_telemetry":True,
                  "operational_branch_refresh_each_cycle":True,
                  "odds_api_net_preferred_transport_implemented":True,
                  "api_football_strict_fresh_fallback_retained":True,
                  "strict_fresh_gate_seconds":120,
                  "freshness_gate_relaxed":False,
              },
              "odds_api_net_credential_configured":bool(os.environ.get("ODDS_API_NET_KEY","").strip()),
              "runtime_transport_status":(
                  "READY_FOR_LIVE_ODDS_API_NET_CAPTURE"
                  if os.environ.get("ODDS_API_NET_KEY","").strip()
                  else "BLOCKED_CREDENTIAL_REQUIRED_API_FOOTBALL_FALLBACK_ACTIVE"
              ),
              "automatic_wagering":False,
              "real_money":"BLOCKED",
              "result":"PASS_INTERNAL_REMEDIATION",
          }
          (root/"MATRIX_CLV_MISSED_CLOSE_REMEDIATION_PROOF_LAST.json").write_text(
              json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          print(json.dumps(payload,sort_keys=True))
          PY

      - name: Persist proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-clv-remediation"
          git config user.email "matrix-clv-remediation@users.noreply.github.com"
          git add evidence/clv/football/over_2_5/MATRIX_CLV_MISSED_CLOSE_REMEDIATION_PROOF_LAST.json
          git commit -m "evidence(clv): prove missed-close remediation"
          git fetch origin repair/cor09-world-pipeline
          git rebase --autostash origin/repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
