name: MATRIX Independent Free Poisson Prospective OOS

on:
  schedule:
    - cron: "25 1,5,9,13,17,21 * * *"
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/matrix-independent-free-poisson-oos.yml
      - tools/matrix_independent_free_poisson_oos.py
      - tests/test_matrix_independent_free_poisson_oos.py
      - tools/matrix_independent_free_poisson_v1.py
      - tests/test_matrix_independent_free_poisson_v1.py

permissions:
  contents: write
  actions: write

concurrency:
  group: matrix-independent-free-poisson-oos
  cancel-in-progress: false

jobs:
  independent-oos-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTOMATIC_WAGERING: "false"
    steps:
      - name: Checkout original immutable outcomes and separated Poisson freezes
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify prospectivity, exact source hash binding and blocked wagering
        shell: bash
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = BLOCKED
          test "$AUTOMATIC_WAGERING" = false
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=. python -m pytest -q \
            tests/test_matrix_independent_free_poisson_v1.py \
            tests/test_matrix_independent_free_poisson_oos.py

      - name: Record previous independently verified OOS count
        id: previous_oos
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('evidence/football_world_inventory/MATRIX_FREE_POISSON_OOS_SCORECARD_LAST.json')
          prev=json.loads(p.read_bytes())['independently_verified_settled_pairs'] if p.is_file() else 0
          assert type(prev) is int and prev>=0
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              print(f'count={prev}',file=f)
          print('PREVIOUS_VERIFIED_POISSON_OOS',prev)
          PY
      - name: Score only previously frozen independent probabilities with actual final scores
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_independent_free_poisson_oos
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/football_world_inventory/MATRIX_FREE_POISSON_OOS_SCORECARD_LAST.json").read_text(encoding="utf-8"))
          assert d["real_money"]=="BLOCKED"
          assert d["automatic_wagering"] is False
          assert d["production_p_matrix_authorized"] is False
          assert d["telegram_signal_authorized"] is False
          assert d["canonical_model_parity_certified"] is False
          assert d["independently_verified_settled_pairs"]>=0
          print("INDEPENDENT_OOS_SHA_BACKED",d["independently_verified_settled_pairs"],"PENDING",d["future_forecasts_pending"],"UNRESOLVED",d["started_without_verified_final"])
          PY

      - name: Persist research scorecard without touching official calibration or Telegram
        shell: bash
        run: |
          set -euo pipefail
          P="evidence/football_world_inventory/MATRIX_FREE_POISSON_OOS_SCORECARD_LAST.json"
          git config user.name matrix-independent-poisson-oos
          git config user.email matrix-independent-poisson-oos@users.noreply.github.com
          git add -- "$P"
          if git diff --cached --quiet; then echo NO_NEW_OOS_REPORT; exit 0; fi
          git commit -m "evidence(football): independent Poisson OOS verification, real-money blocked"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

      - name: Wake three-model OOS only for newly verified paired results
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_VERIFIED_COUNT: ${{ steps.previous_oos.outputs.count }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          j=json.loads(Path('evidence/football_world_inventory/MATRIX_FREE_POISSON_OOS_SCORECARD_LAST.json').read_bytes())
          assert j['real_money']=='BLOCKED' and j['telegram_signal_authorized'] is False
          assert j['production_p_matrix_authorized'] is False and j['automatic_wagering'] is False
          before=int(os.environ['PREVIOUS_VERIFIED_COUNT'])
          after=j['independently_verified_settled_pairs']
          assert type(after) is int and after>=before
          Path('/tmp/matrix_new_verified_poisson_oos.txt').write_text(str(after-before))
          print('NEW_VERIFIED_POISSON_OOS_PAIRS',after-before)
          PY
          new_count="$(cat /tmp/matrix_new_verified_poisson_oos.txt)"
          if [ "$new_count" -gt 0 ]; then
            gh workflow run matrix-hybrid-three-model-prospective-oos.yml \
              --repo "$GITHUB_REPOSITORY" --ref repair/cor09-world-pipeline
            echo "THREE_MODEL_OOS_DISPATCHED_FROM_NEW_VERIFIED_PAIRS"
          else
            echo "NO_NEW_VERIFIED_PAIRS_NO_THREE_MODEL_FANOUT"
          fi
