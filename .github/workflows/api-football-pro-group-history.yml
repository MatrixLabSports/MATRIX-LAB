name: API-Football Pro group history capture

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-football-pro-group-history-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependency
        run: python -m pip install requests

      - name: Verify persisted Pro entitlement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("evidence/api_football/pro_entitlement_probe/manifest.json")
          payload = json.loads(p.read_text(encoding="utf-8"))
          assert payload["pro_entitlement_verified"] is True
          assert payload["season_2026"]["status"] == "PASS"
          assert payload["team_last_20"]["status"] == "PASS"
          print("API_FOOTBALL_PRO_ENTITLEMENT_VERIFIED")
          PY

      - name: Capture league-season history
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MATRIX_API_FOOTBALL_HISTORY_DIR: evidence/api_football/history
          MATRIX_API_FOOTBALL_HISTORY_MAX_REQUESTS: "40"
          MATRIX_API_FOOTBALL_DAILY_RESERVE: "40"
        run: |
          set -euo pipefail
          rm -rf "$MATRIX_API_FOOTBALL_HISTORY_DIR"
          python -m tools.api_football_group_history_capture

      - name: Enforce history gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("evidence/api_football/history")
          manifest = json.loads((root / "history_capture_manifest.json").read_text(encoding="utf-8"))
          assert manifest["status"] == "PASS"
          assert manifest["network_calls_performed"] > 0
          assert manifest["provider_error_group_count"] == 0
          assert manifest["free_plan_season_range_blocked"] is False
          assert manifest["real_money"] == "BLOCKED"
          print("API_FOOTBALL_PRO_GROUP_HISTORY_GATE: PASS")
          print("requested_groups=", manifest["requested_group_count"])
          print("captured_groups=", manifest["captured_group_count"])
          print("network_calls=", manifest["network_calls_performed"])
          print("ready_minimum_history=", manifest["ready_minimum_history_count"])
          print("blocked_minimum_history=", manifest["blocked_minimum_history_count"])
          print("daily_remaining=", manifest["last_rate_limit"]["daily_remaining"])
          PY

      - name: Persist history evidence
        run: |
          set -euo pipefail
          git config user.name "matrix-api-football-pro-history"
          git config user.email "matrix-api-football-pro-history@users.noreply.github.com"
          git add evidence/api_football/history
          if git diff --cached --quiet; then
            echo "NO_HISTORY_EVIDENCE_TO_PERSIST"
            exit 3
          fi
          git commit -m "evidence(api-football): persist Pro league-season history capture"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
