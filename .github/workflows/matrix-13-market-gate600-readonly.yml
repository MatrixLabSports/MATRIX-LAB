name: MATRIX 13 Market Gate600 Read-Only Certification

on:
  workflow_dispatch:
  schedule:
    - cron: "11,26,41,56 * * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/matrix-13-market-gate600-readonly.yml

permissions:
  contents: write

concurrency:
  group: matrix-13-market-gate600-readonly
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - name: Checkout canonical operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner only
        run: python -m pip install pytest requests

      - name: Verify 13-lane and account-suspension temporal-safety invariants
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = BLOCKED
          test "$AUTO_BETTING" = DISABLED
          PYTHONPATH=. python -m pytest -q tests/test_matrix_13_market_gate600_committee.py tests/test_matrix_13_market_exact_cohort_calibration.py tests/test_matrix_13_cohort_archived_final_readiness.py tests/test_api_football_prospective_api_settlement.py tests/test_matrix_13_cohort_independent_results.py

      - name: Produce bounded read-only decision report
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_13_market_gate600_committee
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/governance/MATRIX_13_MARKET_GATE600_COMMITTEE_LAST.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["summary"]["gate600_reached"] == 13
          assert len(r["lanes"]) == 13
          assert r["governance"]["real_money"] == "BLOCKED"
          assert r["governance"]["telegram_messages_sent"] == 0
          assert r["governance"]["automatic_wagering"] is False
          assert not any(x["automatically_promoted"] or x["telegram_signal_authorized_by_this_audit"] for x in r["lanes"])
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"13-lane gate600 diagnostic: {len(r['lanes'])}/13; no automatic promotion; real money BLOCKED.\n")
          PY

      - name: Join frozen predictions with FT and SHA256-verified halftime receipts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_13_market_exact_cohort_calibration
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/governance/MATRIX_13_MARKET_EXACT_COHORT_CALIBRATION_LAST.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          assert data["summary"]["markets_targeted"] == 13
          assert len(data["lanes"]) == 13
          assert data["safety"]["real_money"] == "BLOCKED"
          assert data["safety"]["telegram_messages_sent"] == 0
          assert not any(x["telegram_authorized_by_audit"] or x["parameters_refitted"] for x in data["lanes"])
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("### Exact-cohort calibration (diagnostic only)\n")
              for row in data["lanes"]:
                  out.write(f"- {row['market_key']}: {row['exact_cohort_final_verified']} strict FT outcomes; {row['decision']}\n")
          PY

      - name: Audit archived FT evidence and classify account-suspended responses
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_13_cohort_archived_final_readiness
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/governance/MATRIX_13_COHORT_ARCHIVED_FINAL_READINESS_LAST.json").read_text(encoding="utf-8"))
          assert r["target_market_count"] == 13
          assert r["unsettled_fixture_triage_count"] == r["distinct_missing_market_fixture_ids"]
          assert all(x["prospective_freeze_not_to_be_rewritten"] for x in r["unsettled_fixture_triage"])
          assert r["protections"]["real_money"] == "BLOCKED"
          assert r["protections"]["no_api_calls"] and r["protections"]["read_only"]
          assert all(x["settlements_appended"] == 0 and not x["production_authorized"] for x in r["lanes"])
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### Previously archived raw FT recovery readiness (NO LEDGER WRITES)\n")
              for x in r["lanes"]:
                  f.write(f"- {x['market_key']}: missing {x['missing_settlement_event_count']}; archived standard FT {x['recoverable_archived_standard_ft_events']}; archived valid halftime {x['recoverable_archived_halftime_events']}\n")
          PY

      - name: Capture authenticated independent historical football results in quarantine
        shell: bash
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = BLOCKED
          PYTHONPATH=. python -m tools.matrix_13_cohort_independent_results
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/football_cohort_recovery/MATRIX_INDEPENDENT_FINAL_RECONCILIATION_LAST.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["real_money"]=="BLOCKED"
          assert r["telegram_signal_authorized"] is False
          assert r["canonical_ledger_appends"]==0
          assert r["quota_bounded_provider_calls"]<=1
          assert all(x["authorized_to_append_canonical_settlement"] is False for x in r["matched"])
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"Independent authenticated finals: {r['status']}; queued {r['eligible_queued_fixtures']}; exact fulltime matches {r['identity_matched_standard_final']}; verified halftime {r['half_time_certified']}; no auto-promotion.\n")
          PY

      - name: Persist only diagnostic evidence to operational branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-gate600-audit
          git config user.email matrix-gate600-audit@users.noreply.github.com
          git add evidence/governance/MATRIX_13_MARKET_GATE600_COMMITTEE_LAST.json evidence/governance/MATRIX_13_MARKET_EXACT_COHORT_CALIBRATION_LAST.json evidence/governance/MATRIX_13_COHORT_ARCHIVED_FINAL_READINESS_LAST.json evidence/football_cohort_recovery/MATRIX_INDEPENDENT_FINAL_RECONCILIATION_LAST.json
          if [ -f evidence/football_cohort_recovery/FOOTBALL_DATA_ORG_RAW_LAST.json ]; then
            git add evidence/football_cohort_recovery/FOOTBALL_DATA_ORG_RAW_LAST.json
          fi
          if git diff --cached --quiet; then
            echo "NO_CHANGED_SOURCE_NO_NEW_EVIDENCE_COMMIT"
            exit 0
          fi
          git commit -m "evidence(markets): canonical 13-lane freeze vs settlement gate audit"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
