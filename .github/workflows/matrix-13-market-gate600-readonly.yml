name: MATRIX 13 Market Gate600 Read-Only Certification
# Re-run against the now-present independent SHA ledger to persist the 604/535/501 cohort results.
# The immutable source and both original/independent ledgers must never be overwritten by rebase conflict resolution.

on:
  workflow_dispatch:
  schedule:
    - cron: "11,26,41,56 * * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/matrix-13-market-gate600-readonly.yml

permissions:
  contents: write

concurrency:
  group: matrix-13-market-gate600-readonly
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - name: Checkout canonical operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner only
        run: python -m pip install pytest requests

      - name: Verify 13-lane and account-suspension temporal-safety invariants
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = BLOCKED
          test "$AUTO_BETTING" = DISABLED
          PYTHONPATH=. python -m pytest -q tests/test_matrix_13_market_gate600_committee.py tests/test_matrix_13_market_exact_cohort_calibration.py tests/test_matrix_13_cohort_archived_final_readiness.py tests/test_api_football_prospective_api_settlement.py tests/test_matrix_13_cohort_independent_results.py tests/test_matrix_13_cohort_espn_mls_results.py tests/test_matrix_13_cohort_espn_cup_results.py tests/test_matrix_13_cohort_independent_settlement.py tests/test_matrix_13_cohort_formal_scoring_gate.py

      - name: Produce bounded read-only decision report
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_13_market_gate600_committee
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/governance/MATRIX_13_MARKET_GATE600_COMMITTEE_LAST.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["summary"]["gate600_reached"] == 13
          assert len(r["lanes"]) == 13
          assert r["governance"]["real_money"] == "BLOCKED"
          assert r["governance"]["telegram_messages_sent"] == 0
          assert r["governance"]["automatic_wagering"] is False
          assert not any(x["automatically_promoted"] or x["telegram_signal_authorized_by_this_audit"] for x in r["lanes"])
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"13-lane gate600 diagnostic: {len(r['lanes'])}/13; no automatic promotion; real money BLOCKED.\n")
          PY

      - name: Join frozen predictions with FT and SHA256-verified halftime receipts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_13_market_exact_cohort_calibration
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/governance/MATRIX_13_MARKET_EXACT_COHORT_CALIBRATION_LAST.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          assert data["summary"]["markets_targeted"] == 13
          assert len(data["lanes"]) == 13
          assert data["safety"]["real_money"] == "BLOCKED"
          assert data["safety"]["telegram_messages_sent"] == 0
          assert not any(x["telegram_authorized_by_audit"] or x["parameters_refitted"] for x in data["lanes"])
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("### Exact-cohort calibration (diagnostic only)\n")
              for row in data["lanes"]:
                  out.write(f"- {row['market_key']}: {row['exact_cohort_final_verified']} strict FT outcomes; {row['decision']}\n")
          PY

      - name: Audit archived FT evidence and classify account-suspended responses
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_13_cohort_archived_final_readiness
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/governance/MATRIX_13_COHORT_ARCHIVED_FINAL_READINESS_LAST.json").read_text(encoding="utf-8"))
          assert r["target_market_count"] == 13
          assert r["unsettled_fixture_triage_count"] == r["distinct_missing_market_fixture_ids"]
          assert all(x["prospective_freeze_not_to_be_rewritten"] for x in r["unsettled_fixture_triage"])
          assert r["protections"]["real_money"] == "BLOCKED"
          assert r["protections"]["no_api_calls"] and r["protections"]["read_only"]
          assert all(x["settlements_appended"] == 0 and not x["production_authorized"] for x in r["lanes"])
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### Previously archived raw FT recovery readiness (NO LEDGER WRITES)\n")
              for x in r["lanes"]:
                  f.write(f"- {x['market_key']}: missing {x['missing_settlement_event_count']}; archived standard FT {x['recoverable_archived_standard_ft_events']}; archived valid halftime {x['recoverable_archived_halftime_events']}\n")
          PY

      - name: Capture authenticated independent historical football results in quarantine
        shell: bash
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = BLOCKED
          PYTHONPATH=. python -m tools.matrix_13_cohort_independent_results
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/football_cohort_recovery/MATRIX_INDEPENDENT_FINAL_RECONCILIATION_LAST.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["real_money"]=="BLOCKED"
          assert r["telegram_signal_authorized"] is False
          assert r["canonical_ledger_appends"]==0
          assert r["quota_bounded_provider_calls"]<=1
          assert all(x["authorized_to_append_canonical_settlement"] is False for x in r["matched"])
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"Independent authenticated finals: {r['status']}; queued {r['eligible_queued_fixtures']}; exact fulltime matches {r['identity_matched_standard_final']}; verified halftime {r['half_time_certified']}; no auto-promotion.\n")
          PY

      - name: Verify public ESPN MLS 90-minute results against immutable frozen identities
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_13_cohort_espn_mls_results
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/football_cohort_recovery/MATRIX_ESPN_MLS_EXACT_FINAL_LAST.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["real_money"]=="BLOCKED"
          assert r["canonical_ledger_appends"]==0
          assert r["telegram_authorized"] is False
          assert r["network_calls"]<=3
          assert r["exact_final_matches"]==len(r["matches"])
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"ESPN MLS authentic FT: queued={r['queue_count']}, exact={r['exact_final_matches']}, calls={r['network_calls']}; no automatic canonical settlement.\n")
          PY

      - name: Reconcile Spanish German English cup results under exact identity gate
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_13_cohort_espn_cup_results
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/football_cohort_recovery/MATRIX_ESPN_CUPS_EXACT_FINAL_LAST.json").read_text(encoding="utf-8"))
          assert r["real_money"]=="BLOCKED"
          assert r["canonical_ledger_appends"]==0
          assert r["telegram_authorized"] is False
          assert r["network_calls"]<=8
          assert r["exact_final_matches"]==len(r["matched"])
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"ESPN Cup finals: {r['exact_final_matches']} exact from {r['target_count']} frozen candidates, without auto-settlement.\n")
          PY

      - name: Append independently cross-validated standard FT to separate hash-chained cohort ledger
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_13_cohort_independent_settlement
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/football_cohort_recovery/MATRIX_INDEPENDENT_VERIFIED_FT_SYNC_LAST.json").read_text(encoding="utf-8"))
          assert r["status"]=="PASS_VERIFIED_INDEPENDENT_FT_RESEARCH_ONLY"
          assert r["real_money"]=="BLOCKED"
          assert r["automatic_wagering"] is False
          assert r["no_poststart_prediction_backfill"] is True
          assert r["no_automatic_promotion"] is True
          assert r["verified_independent_ledger"]["canonical_api_football_ledger_unchanged"] is True
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"Independent append-only finals: new {r['verified_independent_ledger']['new']}, total {r['verified_independent_ledger']['total']}; original API-Football immutable {r['original_api_football_settled_count']}.\n")
          PY

      - name: Recompute original thirteen market cohorts with verified independent finals
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_13_market_exact_cohort_calibration
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/governance/MATRIX_13_MARKET_EXACT_COHORT_CALIBRATION_LAST.json").read_text(encoding="utf-8"))
          assert r["summary"]["markets_targeted"]==13
          assert r["summary"]["combined_distinct_verified_final_rows"] >= r["summary"]["settlement_source_rows"]
          assert r["safety"]["real_money"]=="BLOCKED"
          assert all(x["telegram_authorized_by_audit"] is False for x in r["lanes"])
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"Recomputed strict cohorts: {r['summary']['markets_with_600_exact_final']}/13 at 600 standard FT; independent source {r['summary']['independent_ledger_final_rows']}.\n")
          PY

      - name: Run formal proper-scoring decision gate on verified cohorts at 600
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_13_cohort_formal_scoring_gate
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/governance/MATRIX_13_MARKET_FORMAL_SCORING_GATE_LAST.json").read_text(encoding="utf-8"))
          assert len(r["lanes"])==13
          assert r["protections"]["real_money"]=="BLOCKED"
          assert r["protections"]["no_parameter_refit"] is True
          assert r["protections"]["no_automatic_market_promotion"] is True
          assert r["summary"]["newly_promoted"]==0
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"Formal scoring: {r['summary']['formal_core_scoring_comparisons_completed']} core-market comparisons, {r['summary']['gate600_final_count']} reached 600; zero promotions.\n")
          PY

      - name: Persist only diagnostic evidence to operational branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-gate600-audit
          git config user.email matrix-gate600-audit@users.noreply.github.com
          git add evidence/governance/MATRIX_13_MARKET_GATE600_COMMITTEE_LAST.json evidence/governance/MATRIX_13_MARKET_EXACT_COHORT_CALIBRATION_LAST.json evidence/governance/MATRIX_13_COHORT_ARCHIVED_FINAL_READINESS_LAST.json evidence/football_cohort_recovery/MATRIX_INDEPENDENT_FINAL_RECONCILIATION_LAST.json
          git add evidence/football_cohort_recovery/MATRIX_ESPN_MLS_EXACT_FINAL_LAST.json
          git add evidence/football_cohort_recovery/MATRIX_ESPN_CUPS_EXACT_FINAL_LAST.json
          git add evidence/football_cohort_recovery/MATRIX_INDEPENDENT_VERIFIED_FT_SYNC_LAST.json
          git add evidence/governance/MATRIX_13_MARKET_FORMAL_SCORING_GATE_LAST.json
          if [ -f evidence/football_cohort_recovery/MATRIX_INDEPENDENT_VERIFIED_FT_LEDGER.jsonl ]; then
            git add evidence/football_cohort_recovery/MATRIX_INDEPENDENT_VERIFIED_FT_LEDGER.jsonl
          fi
          for f in evidence/football_cohort_recovery/ESPN_MLS_*_RAW.json evidence/football_cohort_recovery/ESPN_CUP_*_RAW.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if [ -f evidence/football_cohort_recovery/FOOTBALL_DATA_ORG_RAW_LAST.json ]; then
            git add evidence/football_cohort_recovery/FOOTBALL_DATA_ORG_RAW_LAST.json
          fi
          if git diff --cached --quiet; then
            echo "NO_CHANGED_SOURCE_NO_NEW_EVIDENCE_COMMIT"
            exit 0
          fi
          git commit -m "evidence(markets): canonical 13-lane freeze vs settlement gate audit"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
