name: MATRIX Over25 Authentic Baseline Windows Verification

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/matrix_championship_baseline_pit_replay.py
      - tests/test_matrix_championship_baseline_pit_replay.py
      - tools/matrix_football_independent_over25_shadow.py
      - tools/matrix_persist_championship_baseline.py
      - .github/workflows/matrix-over25-authentic-baseline-windows.yml

permissions:
  contents: write

concurrency:
  group: matrix-over25-authentic-baseline-windows
  cancel-in-progress: false

jobs:
  baseline-verification:
    runs-on: [self-hosted, windows, matrix-browser-odds]
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
      MATRIX_MODE: SHADOW
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout authentic recorded HTTP and four bound source files
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Verify hard financial safety and Python 3.11
        run: |
          python -c "import os,sys; assert sys.version_info[:2]==(3,11); assert os.environ['REAL_MONEY']=='BLOCKED'; assert os.environ['AUTO_BETTING']=='DISABLED'; assert os.environ['MATRIX_MODE']=='SHADOW'"

      - name: Test original mathematical baseline replay against raw authenticated HTTP bytes
        run: python -m pytest -q tests/test_matrix_championship_baseline_pit_replay.py tests/test_matrix_championship_prospective_pit_attestation.py tests/test_matrix_football_independent_over25_shadow.py

      - name: Verify actual Championship raw HTTP historical baseline independently
        run: |
          python -m tools.matrix_championship_baseline_pit_replay --date 2026-11-03 --out evidence/football_world_inventory/2026-11-03/MATRIX_CHAMPIONSHIP_OVER25_BASELINE_WINDOWS_${{ github.run_id }}.json
          python -c "import json,os,pathlib; p=pathlib.Path('evidence/football_world_inventory/2026-11-03')/('MATRIX_CHAMPIONSHIP_OVER25_BASELINE_WINDOWS_'+os.environ['GITHUB_RUN_ID']+'.json'); d=json.loads(p.read_text(encoding='utf-8')); assert d['verified_research_baseline_count']>=1; assert d['calibrated_model_equivalence_verified'] is False; assert d['telegram_signal_authorized'] is False; assert d['production_p_matrix_authorized'] is False; assert d['real_money']=='BLOCKED'; print('REAL_AUTHENTIC_BASELINE_VERIFIED='+str(d['verified_research_baseline_count']))"

      - name: Upload actual immutable baseline proof
        uses: actions/upload-artifact@v4
        with:
          name: matrix-over25-authentic-baseline-windows
          path: evidence/football_world_inventory/2026-11-03/MATRIX_CHAMPIONSHIP_OVER25_BASELINE_WINDOWS_${{ github.run_id }}.json

      - name: Persist actual baseline proof in GitHub without changing Windows policies
        run: python -m tools.matrix_persist_championship_baseline
