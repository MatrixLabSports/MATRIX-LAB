name: API-Football Player Shots Lineup Role v3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-player-shots-lineup-role-v3.yml
  workflow_dispatch:
  schedule:
    - cron: "9,24,39,54 * * * *"

permissions:
  contents: write

concurrency:
  group: api-football-player-shots-lineup-role-v3
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pytest requests

      - name: Verify lineup-role protections
        run: python -m pytest -q tests/test_api_football_player_shots_lineup_role_v3.py

      - name: Acquire lineup roles resumably and build when complete
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m tools.api_football_player_shots_lineup_role_v3_batch

      - name: Enforce governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("evidence/api_football/market_expansion/player_shots_lineup_role_v3")
          p=json.loads((root/"acquisition_progress.json").read_text())
          assert p["real_money"]=="BLOCKED"
          if p["status"]=="COMPLETE_MODEL_EVALUATED":
              m=json.loads((root/"model.json").read_text())
              d=json.loads((root/"dataset_manifest.json").read_text())
              assert d["historical_role_source"]=="/fixtures/lineups"
              assert d["prospective_role_source"]=="/fixtures/lineups"
              assert d["same_role_semantics_by_construction"] is True
              assert d["current_match_minutes_used_as_feature"] is False
              assert d["same_match_target_used_in_features"] is False
              assert m["internal_selection"]["final_validation_used_for_selection"] is False
              assert m["validation_used_for_parameter_tuning"] is False
              assert m["odds_used_to_generate_probability"] is False
              assert m["automatic_wagering"] is False
              assert m["real_money"]=="BLOCKED"
          print("PLAYER_SHOTS_LINEUP_ROLE_V3_GOVERNANCE: PASS")
          PY

      - name: Persist corrected evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-player-shots-v3"
          git config user.email "matrix-football-player-shots-v3@users.noreply.github.com"
          git add evidence/api_football/market_expansion/player_shots_lineup_role_v3
          if git diff --cached --quiet; then
            echo "NO_PLAYER_SHOTS_V3_PROGRESS"
            exit 0
          fi
          git commit -m "evidence(football): persist resumable lineup-role Player Shots v3"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
