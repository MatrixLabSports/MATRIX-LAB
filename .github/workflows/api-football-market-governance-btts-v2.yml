name: API-Football market governance and BTTS v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-market-governance-btts-v2.yml

permissions:
  contents: write

jobs:
  govern-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Run market governance and BTTS v2 tests
        run: python -m pytest -q tests/test_api_football_market_governance_btts_v2.py
      - name: Persist market-specific governance
        run: python -m tools.api_football_market_governance
      - name: Build BTTS challenger v2 without original holdout
        run: python -m tools.api_football_btts_challenger_v2
      - name: Enforce permanent holdout exclusion and no promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path("evidence/api_football/market_governance/market_governance.json").read_text())
          b=json.loads(Path("evidence/api_football/btts_challenger_v2/manifest.json").read_text())
          e=json.loads(Path("evidence/api_football/btts_challenger_v2/exclusion_registry.json").read_text())
          assert set(g["approved_markets"])=={"1x2","over_2_5"}
          assert g["rejected_markets"]==["btts"]
          assert b["development_count"]==1665
          assert b["validation_count"]==357
          assert b["forbidden_final_holdout_count"]==357
          assert b["forbidden_final_holdout_outcomes_read"] is False
          assert b["forbidden_final_holdout_used_for_training"] is False
          assert b["forbidden_final_holdout_used_for_validation"] is False
          assert e["training_validation_overlap_count"]==0
          assert b["governed_engine_promoted"] is False
          assert b["p_matrix_generated"] is False
          assert b["real_money"]=="BLOCKED"
          print("MATRIX_FOOTBALL_MARKET_GOVERNANCE_BTTS_V2_GATE: PASS")
          print("approved_markets=",g["approved_markets"])
          print("rejected_markets=",g["rejected_markets"])
          print("btts_candidate_status=",b["candidate_status"])
          print("validation_superiority=",b["validation_superiority"])
          print("selected=",b["selected"])
          PY
      - name: Persist governance and BTTS v2 evidence
        run: |
          git config user.name "matrix-football-market-governance"
          git config user.email "matrix-football-market-governance@users.noreply.github.com"
          git add evidence/api_football/market_governance evidence/api_football/btts_challenger_v2
          if git diff --cached --quiet; then
            echo NO_MARKET_GOVERNANCE_EVIDENCE_CHANGE
            exit 0
          fi
          git commit -m "evidence(football): persist market governance and BTTS v2"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline

