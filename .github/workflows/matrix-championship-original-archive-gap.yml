name: MATRIX Championship Original Archive Exhaustive Coverage Gate

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/matrix_championship_original_archive_gap.py
      - tests/test_matrix_championship_original_archive_gap.py
      - .github/workflows/matrix-championship-original-archive-gap.yml

permissions:
  contents: write

concurrency:
  group: matrix-championship-original-archive-gap
  cancel-in-progress: false

jobs:
  verify-archived-coverage-no-signal-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REAL_MONEY: BLOCKED
      AUTOMATIC_WAGERING: "false"
    steps:
      - name: Checkout full physical repository evidence tree
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify no legacy source or source mismatch can promote a signal
        run: |
          set -euo pipefail
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_matrix_championship_original_archive_gap.py

      - name: Exhaustively scan repository's original Championship 2026 archive
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_championship_original_archive_gap
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/football_world_inventory/2026-11-03/MATRIX_CHAMPIONSHIP_ORIGINAL_ARCHIVE_GAP_LAST.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["schema"]=="MATRIX_CHAMPIONSHIP_ORIGINAL_ARCHIVE_GAP_V1"
          assert j["original_repository_tree_scanned"]=="evidence/api_football"
          assert j["scope"]=="EXISTING_LOCAL_GITHUB_CHECKOUT_ONLY"
          assert j["new_model_probabilities_generated"]==0
          assert j["canonical_production_files_written"]==0
          assert j["bookmaker_quotes_verified"]==0
          assert j["telegram_signals_authorized"] is False
          assert j["automatic_wagering"] is False
          assert j["real_money"]=="BLOCKED"
          print("CHAMPIONSHIP_ORIGINAL_GROUPS="+str(j["original_championship_group_archives_found"]))
          print("RESEARCH_ONLY_COUNT="+str(len(j["cross_source_matches_with_research_p_at_least_0_60"])))
          PY

      - name: Persist real original archive coverage without editing predictions
        shell: bash
        run: |
          set -euo pipefail
          P=evidence/football_world_inventory/2026-11-03/MATRIX_CHAMPIONSHIP_ORIGINAL_ARCHIVE_GAP_LAST.json
          git config user.name matrix-championship-archive-audit
          git config user.email matrix-championship-archive-audit@users.noreply.github.com
          git add "$P"
          if git diff --cached --quiet; then echo ARCHIVE_COVERAGE_ALREADY_PRESENT; exit 0; fi
          git commit -m "evidence(football): certify original Championship archive availability versus two research-only prospects"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
