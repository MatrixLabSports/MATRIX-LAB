name: MATRIX Independent Over25 Quote Watcher 15m

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/matrix-independent-over25-quote-watcher-15m.yml

permissions:
  contents: write

concurrency:
  group: matrix-independent-over25-quote-watcher-15m
  cancel-in-progress: false

jobs:
  quote-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - name: Checkout operational branch without modifying production
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install read-only audit dependencies
        run: python -m pip install requests pytest Pillow

      - name: Certify exact quote audit regression contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_matrix_independent_over25_quote_audit.py tests/test_matrix_independent_over25_day_selector.py

      - name: Select verified 120m fixture across Bogota midnight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.matrix_independent_over25_day_selector --out /tmp/matrix_quote_day_selection.json
          D="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/matrix_quote_day_selection.json',encoding='utf-8'))
          assert data['real_money']=='BLOCKED'
          assert data['telegram_authorized'] is False
          print(data['selected_date'] or '')
          PY
          )"
          echo "date=$D" >> "$GITHUB_OUTPUT"
          if [ -z "$D" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "WAIT_FOR_STRICTLY_PREMATCH_DATED_PRIMARY_SOURCE_AND_FROZEN_MODEL"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "CERTIFIED_INDEPENDENT_SOURCE_DATE=$D"
      - name: Obtain strictly fresh quotes only inside 120-minute pre-kickoff window
        if: steps.preflight.outputs.ready == 'true'
        env:
          ODDS_API_NET_KEY: ${{ secrets.ODDS_API_NET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          D="${{ steps.preflight.outputs.date }}"
          R="evidence/football_world_inventory/$D"
          python -m tools.matrix_independent_over25_quote_audit \
            --intake "$R/MATRIX_FOOTBALL_INDEPENDENT_FIXTURE_INTAKE.json" \
            --shadow "$R/MATRIX_INDEPENDENT_OVER25_HISTORY_SHADOW.json" \
            --previous "$R/MATRIX_INDEPENDENT_OVER25_QUOTE_AUDIT.json" \
            --out "$R/MATRIX_INDEPENDENT_OVER25_QUOTE_AUDIT.json"

      - name: Persist only physical quote network attempts, never authorize Telegram
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="${{ steps.preflight.outputs.date }}"
          P="evidence/football_world_inventory/$D/MATRIX_INDEPENDENT_OVER25_QUOTE_AUDIT.json"
          python - "$P" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding="utf-8"))
          assert j["real_money"]=="BLOCKED"
          assert j["automatic_wagering"] is False
          assert j["signal_generation_authorized"] is False
          assert j["telegram_messages_sent"] == 0
          print("NETWORK_CALLS=",j["network_calls"],"QUOTA=",j["quota_status"])
          PY
          CALLS="$(python - "$P" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))["network_calls"])
          PY
          )"
          if [ "$CALLS" -eq 0 ]; then
            echo "NO_PROVIDER_CALL_KEEP_PRIOR_EVIDENCE"
            exit 0
          fi
          git config user.name matrix-independent-quote-watch
          git config user.email matrix-independent-quote-watch@users.noreply.github.com
          git add "$P"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence(football): 15m independent exact Over25 quote attempt $D"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
