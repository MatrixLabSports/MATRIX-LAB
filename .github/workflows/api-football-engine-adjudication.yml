name: API-Football physical engine adjudication

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-engine-adjudication.yml

permissions:
  contents: write

concurrency:
  group: api-football-physical-engine-adjudication
  cancel-in-progress: false

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run engine adjudication tests
        run: python -m pytest -q tests/test_api_football_engine_registry_adjudication.py

      - name: Build physical adjudication
        run: python -m tools.api_football_engine_registry_adjudication

      - name: Enforce fail-closed classification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("evidence/api_football/engine_registry/physical_adjudication.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["decision"] == "NO_GOVERNED_ENGINE_EXECUTABLE"
          assert d["core_registry_football_status"] == "NOT_REGISTERED"
          assert d["engine_executable_count"] == 0
          assert d["governed_p_matrix_engine_available"] is False
          assert d["governed_p_matrix_engine"] is None
          assert d["p_matrix_status"] == "NOT_GENERATED"
          assert d["protections"]["no_silent_promotion"] is True
          assert d["protections"]["automatic_wagering"] is False
          assert d["protections"]["real_money"] == "BLOCKED"

          poisson = next(x for x in d["classifications"] if x["engine_id"] == "transparent_poisson_baseline_v1")
          assert poisson["classification"] == "EXPERIMENTAL_ONLY"
          assert poisson["technical_execution_verified"] is True
          assert poisson["engine_executable_for_p_matrix"] is False
          assert poisson["decision"] == "NO_BET"

          print("MATRIX_FOOTBALL_ENGINE_ADJUDICATION_GATE: PASS")
          print("canonical_ready_input_count=", d["canonical_ready_input_count"])
          print("decision=", d["decision"])
          print("p_matrix_status=", d["p_matrix_status"])
          PY

      - name: Persist adjudication evidence to operational branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-engine-adjudicator"
          git config user.email "matrix-football-engine-adjudicator@users.noreply.github.com"
          git add evidence/api_football/engine_registry/physical_adjudication.json
          if git diff --cached --quiet; then
            echo "NO_ENGINE_ADJUDICATION_EVIDENCE_CHANGE"
            exit 0
          fi
          git commit -m "evidence(football): persist physical engine adjudication"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
