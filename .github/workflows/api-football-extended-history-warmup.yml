name: API-Football extended history warmup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-extended-history-warmup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-football-extended-history-warmup
  cancel-in-progress: false

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests pytest

      - name: Run warmup selection tests
        run: python -m pytest -q tests/test_api_football_extended_market_history_warmup.py

      - name: Require API-Football credential
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${API_FOOTBALL_KEY:-}" ]]; then
            echo "API_FOOTBALL_KEY_NOT_CONFIGURED"
            exit 2
          fi

      - name: Capture protected warmup history
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MATRIX_EXTENDED_WARMUP_MAX_FIXTURES: "80"
          MATRIX_API_FOOTBALL_DAILY_RESERVE: "5000"
        run: |
          set -euo pipefail
          python -m tools.api_football_extended_market_history_warmup

      - name: Enforce warmup governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/api_football/market_expansion/historical_warmup/manifest.json").read_text())
          assert p["status"]=="PASS"
          assert p["protected_final_holdout_count"]==357
          assert p["protected_holdout_intersection_count"]==0
          assert p["prospective_intersection_count"]==0
          assert p["feature_usage_policy"]=="TARGET_FEATURES_MUST_USE_STRICTLY_EARLIER_MATCHES_ONLY"
          assert p["odds_used_to_generate_probability"] is False
          assert p["metrics_opened"] is False
          assert p["automatic_wagering"] is False
          assert p["real_money"]=="BLOCKED"
          assert p["network_calls"] <= p["selected_count"]*2
          print("MATRIX_EXTENDED_HISTORY_WARMUP_GATE: PASS")
          PY

      - name: Persist warmup evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-history-warmup"
          git config user.email "matrix-football-history-warmup@users.noreply.github.com"
          git add evidence/api_football/market_expansion/historical_warmup
          if git diff --cached --quiet; then
            echo "NO_WARMUP_EVIDENCE_TO_PERSIST"
            exit 3
          fi
          git commit -m "evidence(football): persist extended-history warmup"
          git status --porcelain
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
