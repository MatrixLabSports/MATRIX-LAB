name: COR02-03 prospective holdout freeze

on:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/cor0203-prospective-freeze.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Verify sealed runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s evidence/cor0203/runtime/MATRIX_COR0203_PRE2026_STATE_R706.json.gz.b64
          test -s evidence/cor0203/runtime/MATRIX_COR0203_ELO_GLICKO_PROSPECTIVE_BUNDLE_R706.json
          test -s evidence/cor0203/runtime/MATRIX_COR0203_PROSPECTIVE_EVENTS_R707.json
          test -s evidence/cor0203/runtime/MATRIX_COR0203_MODEL_BINDING_R707.json
          test -s evidence/cor0203/preholdout/2026_challenger_live_snapshot.csv
          test "$(sha256sum evidence/cor0203/runtime/MATRIX_COR0203_PRE2026_STATE_R706.json.gz.b64 | awk '{print $1}')" = "384b5537ad9715b552d26464db3d01980021a24e9f6d7e0fcc93ba154efde125"
          test "$(sha256sum evidence/cor0203/runtime/MATRIX_COR0203_ELO_GLICKO_PROSPECTIVE_BUNDLE_R706.json | awk '{print $1}')" = "ef5788fa4212c67880a52af85359bed1483ba1d59b1655e28390bbfaf0187ec8"
          test "$(sha256sum evidence/cor0203/preholdout/2026_challenger_live_snapshot.csv | awk '{print $1}')" = "d3f0e7edca273d0e1fcd4700581cf00398e46719f0aaadb62a1c97ec0ffa6ab5"

      - name: Freeze first ELO Glicko holdout batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/cor0203/holdout
          FREEZE_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('evidence/cor0203/runtime/MATRIX_COR0203_MODEL_BINDING_R707.json').read_text())
          e=json.loads(Path('evidence/cor0203/runtime/MATRIX_COR0203_PROSPECTIVE_EVENTS_R707.json').read_text())
          assert b['candidates']['elo']['identity']=='R218_ELO_BOTH'
          assert b['candidates']['glicko']['identity']=='R223_BATCH_GLICKO_RATING_BOTH'
          assert e['model_binding']=='MATRIX_COR0203_MODEL_BINDING_R707_V1'
          assert e['starting_observation_count']==0
          assert len(e['events'])==6
          print('R707_BINDING_AND_PREREGISTRATION=PASS')
          PY
          python tools/cor0203_prospective_producer.py             --state-b64 evidence/cor0203/runtime/MATRIX_COR0203_PRE2026_STATE_R706.json.gz.b64             --bundle evidence/cor0203/runtime/MATRIX_COR0203_ELO_GLICKO_PROSPECTIVE_BUNDLE_R706.json             --annual-2026 evidence/cor0203/preholdout/2026_challenger_live_snapshot.csv             --events evidence/cor0203/runtime/MATRIX_COR0203_PROSPECTIVE_EVENTS_R707.json             --freeze-at "$FREEZE_AT"             --out evidence/cor0203/holdout/MATRIX_COR0203_HOLDOUT_BATCH_R707.json

      - name: Assert metrics remain sealed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/cor0203/holdout/MATRIX_COR0203_HOLDOUT_BATCH_R707.json')
          x=json.loads(p.read_text())
          assert x['starting_observation_count']==0
          assert x['added_observations']==6
          assert x['ending_observation_count']==6
          assert x['window1_count']==6
          assert x['metrics']=='SEALED_UNTIL_600'
          assert x['outcomes_read']==0
          assert all(o['outcome'] is None and o['metrics_opened'] is False for o in x['observations'])
          assert all(o['freeze_at_utc'] < o['event_start_utc'] for o in x['observations'])
          print('COR0203_BATCH_R707_VALIDATION=PASS')
          PY

      - name: Commit sealed holdout batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'matrix-ci'
          git config user.email 'matrix-ci@users.noreply.github.com'
          git add evidence/cor0203/holdout/MATRIX_COR0203_HOLDOUT_BATCH_R707.json
          if git diff --cached --quiet; then
            echo 'No holdout batch changes'
            exit 0
          fi
          git commit -m 'evidence(cor02-03): freeze corrected R707 ELO Glicko holdout batch'
          git push origin HEAD:repair/cor09-world-pipeline
