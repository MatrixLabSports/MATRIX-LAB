name: MATRIX Player Shots v3 Prospective Calibration

on:
  schedule:
    - cron: "3 */2 * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "MATRIX Football Daily Governed Pipeline"
    types:
      - completed
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/api_football_player_shots_v3_supervisor.py
      - tests/test_api_football_player_shots_v3_supervisor.py
      - .github/workflows/api-football-player-shots-v3-prospective.yml

permissions:
  contents: write

concurrency:
  group: api-football-player-shots-v3-prospective
  cancel-in-progress: false

jobs:
  calibrate:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install governed dependencies
        run: python -m pip install pytest requests

      - name: Regression tests
        run: PYTHONPATH=. python -m pytest -q tests/test_api_football_player_shots_v3_supervisor.py

      - name: Safety gates
        shell: bash
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = "BLOCKED"
          test "$AUTO_BETTING" = "DISABLED"

      - name: Run Player Shots v3 freeze settlement and threshold calibration
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          test -n "$API_FOOTBALL_KEY"
          python -m tools.api_football_player_shots_v3_supervisor

      - name: Validate threshold-only opening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/api_football/player_shots_v3_prospective/state.json")
          j=json.loads(p.read_text())
          n=int(j["calibration_observation_count"])
          assert j["real_money"]=="BLOCKED"
          assert j["automatic_wagering"] is False
          assert j["parameter_tuning_allowed"] is False
          for threshold in (30,50,100,200):
              g=j["gates"][str(threshold)]
              if n>=threshold:
                  assert g["status"]=="OPENED_AT_THRESHOLD"
                  assert g["metrics_opened"] is True
                  assert g["observations_used"]==threshold
              else:
                  assert g["status"]=="SEALED"
                  assert g["metrics_opened"] is False
          print(json.dumps({
              "freezes":j["freeze_observation_count"],
              "calibration":n,
              "gate30":j["gates"]["30"]["status"],
              "real_money":j["real_money"],
          },sort_keys=True))
          PY

      - name: Persist Player Shots v3 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-player-shots-v3-calibration
          git config user.email matrix-player-shots-v3-calibration@users.noreply.github.com
          git add evidence/api_football/player_shots_v3_prospective
          if git diff --cached --quiet; then
            echo "NO_PLAYER_SHOTS_V3_CHANGE"
            exit 0
          fi
          git commit -m "evidence(football): refresh Player Shots v3 prospective calibration"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then
              exit 0
            fi
            sleep $((attempt*2))
          done
          exit 1
