name: COR02-03 Ultra targeted profile identity R742

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cor0203-ultra-profile-identity-r742.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Verify generalized biography-only collector
        run: python -m pytest -q tests/test_cor0203_rapidapi_profile_identity.py
      - name: Collect exact numeric-ID profiles for R741 identity blockers
        env:
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
        run: |
          python -m tools.cor0203_rapidapi_profile_identity \
            --target "83315=James McCabe" \
            --target "95698=Federico Cina" \
            --out evidence/cor0203/identity/MATRIX_COR0203_RAPIDAPI_PROFILE_IDENTITY_R742.json \
            --schema MATRIX_COR0203_RAPIDAPI_PROFILE_IDENTITY_R742_V1 \
            --purpose "Identity/biography only for the two R741 provider-ID blockers."
      - name: Enforce exact-target identity-only evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/cor0203/identity/MATRIX_COR0203_RAPIDAPI_PROFILE_IDENTITY_R742.json")
          d=json.loads(p.read_text())
          assert d["schema"]=="MATRIX_COR0203_RAPIDAPI_PROFILE_IDENTITY_R742_V1"
          assert len(d["records"])==2
          assert {r["numeric_player_id"] for r in d["records"]}=={"83315","95698"}
          assert d["post_cut_competitive_data_used"] is False
          assert d["outcomes_used"] is False
          assert d["odds_used"] is False
          assert d["current_ranking_fields_used"] is False
          assert d["automatic_wagering"] is False
          assert d["real_money"]=="BLOCKED"
          for r in d["records"]:
              assert r["provider_player_id"]==f'rapidapi-tennis:player:{r["numeric_player_id"]}'
              assert r["profile_name"]
              assert "currentRank" not in r
              assert "points" not in r
          print("COR0203_ULTRA_TARGETED_PROFILE_IDENTITY_R742: PASS")
          print("records_sha256=",d["records_sha256"])
          PY
      - name: Persist R742 targeted identity evidence
        run: |
          git config user.name "matrix-cor0203-identity"
          git config user.email "matrix-cor0203-identity@users.noreply.github.com"
          git add evidence/cor0203/identity/MATRIX_COR0203_RAPIDAPI_PROFILE_IDENTITY_R742.json
          git commit -m "evidence(cor02-03): persist targeted Ultra profile identity R742"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
