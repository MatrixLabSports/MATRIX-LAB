name: API-Football prospective calibration gates 30-50-100

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-prospective-calibration.yml
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: write

concurrency:
  group: api-football-prospective-calibration-gates
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Verify sealed-threshold tests
        run: python -m pytest -q tests/test_api_football_prospective_calibration.py
      - name: Sync calibration ledger and gates
        run: python -m tools.api_football_prospective_calibration
      - name: Enforce 30-50-100 truth gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("evidence/api_football/prospective_calibration")
          sync=json.loads((root/"sync_last.json").read_text())
          gates=json.loads((root/"gates.json").read_text())

          assert sync["ledger_hash_chain_verified"] is True
          assert sync["parameters_mutated"] is False
          assert sync["metrics_policy"]=="SEALED_UNTIL_EACH_THRESHOLD_30_50_100"
          assert sync["real_money"]=="BLOCKED"

          n=gates["calibration_observation_count"]
          for threshold in (30,50,100):
              g=gates["gates"][str(threshold)]
              if n < threshold:
                  assert g["status"]=="SEALED"
                  assert g["metrics_opened"] is False
                  assert g["metrics"] is None
              else:
                  assert g["status"]=="OPENED_AT_THRESHOLD"
                  assert g["metrics_opened"] is True
                  assert g["observations_used"]==threshold
                  assert isinstance(g["metrics"],dict)

          assert gates["parameter_tuning_allowed"] is False
          assert gates["original_357_holdout_reuse_allowed"] is False
          assert gates["p_matrix_status"]=="NOT_GENERATED"
          assert gates["automatic_wagering"] is False
          assert gates["real_money"]=="BLOCKED"

          print("MATRIX_FOOTBALL_PROSPECTIVE_CALIBRATION_GATE: PASS")
          print("calibration_observation_count=",n)
          print("gate_30=",gates["gates"]["30"]["status"])
          print("gate_50=",gates["gates"]["50"]["status"])
          print("gate_100=",gates["gates"]["100"]["status"])
          PY
      - name: Persist calibration state
        run: |
          git config user.name "matrix-football-prospective-calibration"
          git config user.email "matrix-football-prospective-calibration@users.noreply.github.com"
          git add evidence/api_football/prospective_calibration
          if git diff --cached --quiet; then
            echo NO_PROSPECTIVE_CALIBRATION_CHANGE
            exit 0
          fi
          git commit -m "evidence(football): update prospective calibration gates"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
