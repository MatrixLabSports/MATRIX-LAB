name: MATRIX Tennis Free User-Authorized Browser 30m

on:
  schedule:
    - cron: "14,44 * * * *"
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/matrix-selfhosted-tennis-browser-free-30m.yml
      - tools/matrix_tennis_windows_browser_calendar_capture.py
      - tests/test_matrix_tennis_windows_browser_calendar_capture.py
      - tools/windows/persist_matrix_tennis_browser_evidence.ps1

permissions:
  contents: write

concurrency:
  group: matrix-selfhosted-tennis-browser-free-30m
  cancel-in-progress: false

jobs:
  read-visible-tennis:
    runs-on: [self-hosted, windows, matrix-browser-odds]
    timeout-minutes: 12
    env:
      MATRIX_BROWSER_CDP_ENDPOINT: http://127.0.0.1:9222
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - name: Enforce local Python and no wagering
        shell: cmd
        run: |
          python -c "import sys; assert sys.version_info[:2]==(3,11)"
          if not "%REAL_MONEY%"=="BLOCKED" exit /B 1
          if not "%AUTO_BETTING%"=="DISABLED" exit /B 1
      - name: Install permitted dependencies and validate source rules
        shell: cmd
        run: |
          python -m pip install --disable-pip-version-check playwright pytest tzdata
          python -m pytest -q tests/test_matrix_tennis_windows_browser_calendar_capture.py tests/test_matrix_tennis_browser_first_free_intake.py tests/test_matrix_tennis_exact_browser_crossmatch.py tests/test_matrix_tennis_browser_challenger_pit_gate.py
      - name: Reuse ordinary browser CDP without bypassing provider restrictions
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools\\windows\\start_matrix_browser_cdp.ps1 -Port 9222
      - name: Capture normal visible SofaScore and Flashscore calendars without direct provider API access
        shell: cmd
        run: python -m tools.matrix_tennis_windows_browser_calendar_capture
      - name: Build exact research-only free identity and PIT metadata admission reports
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $bogota=[System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow,"SA Pacific Standard Time")
          $day=$bogota.ToString("yyyy-MM-dd")
          python -m tools.matrix_tennis_browser_first_free_intake --date $day
          if ($LASTEXITCODE -ne 0) { throw "TENNIS_FREE_INTAKE_FAILED" }
          python -m tools.matrix_tennis_exact_browser_crossmatch --date $day
          if ($LASTEXITCODE -ne 0) { throw "TENNIS_CROSSMATCH_FAILED" }
          $details="evidence/tennis_calendar_physical/$day/sofascore_verified_match_details.json"
          if (Test-Path -LiteralPath $details) {
            python -m tools.matrix_tennis_browser_challenger_pit_gate --date $day
            if ($LASTEXITCODE -ne 0) { throw "TENNIS_PIT_SOURCE_GATE_FAILED" }
          }
      - name: Commit only authentic non-governed research calendar evidence
        if: always()
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools\\windows\\persist_matrix_tennis_browser_evidence.ps1
