name: API-Football prospective market freeze

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-prospective-market-freeze.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest requests
      - name: Build or append prospective freeze
        run: python -m tools.api_football_prospective_market_freeze
      - name: Run prospective pipeline tests
        run: python -m pytest -q tests/test_api_football_prospective_market_pipeline.py tests/test_api_football_prospective_api_settlement.py
      - name: Enforce freeze invariants
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          root=Path("evidence/api_football/prospective_market_freeze")
          d=json.loads((root/"freeze.json").read_text())
          m=json.loads((root/"manifest.json").read_text())
          assert d["frozen_event_count"]>0
          assert d["protections"]["future_only"] is True
          assert d["protections"]["unseen_events_only"] is True
          assert d["protections"]["original_357_holdout_excluded"] is True
          assert d["protections"]["outcomes_read_at_freeze"] is False
          assert d["protections"]["missing_feature_imputation"] is False
          assert d["protections"]["settlement_final_only"] is True
          assert d["protections"]["p_matrix_generated"] is False
          assert d["protections"]["real_money"]=="BLOCKED"
          for row in d["rows"]:
              assert row["outcome"] is None
              assert row["settlement_status"]=="PENDING_FINAL"
              assert datetime.fromisoformat(row["freeze_at_utc"]) < datetime.fromisoformat(row["kickoff_utc"])
          print("MATRIX_FOOTBALL_PROSPECTIVE_FREEZE_GATE: PASS")
          print("frozen_event_count=",d["frozen_event_count"])
          print("excluded_event_count=",d["excluded_event_count"])
          print("freeze_sha256=",m["freeze_sha256"])
          PY
      - name: Persist prospective freeze
        run: |
          git config user.name "matrix-football-prospective-freeze"
          git config user.email "matrix-football-prospective-freeze@users.noreply.github.com"
          git add evidence/api_football/prospective_market_freeze
          if git diff --cached --quiet; then
            echo NO_PROSPECTIVE_FREEZE_EVIDENCE_CHANGE
            exit 0
          fi
          git commit -m "evidence(football): persist prospective market freeze"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline

# Trigger first physical prospective freeze.
