name: MATRIX Benter Second-Stage Readiness Audit

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/matrix_benter_second_stage_readiness_audit.py
      - tests/test_matrix_benter_second_stage_readiness_audit.py
      - .github/workflows/matrix-benter-second-stage-readiness-audit.yml
      - evidence/clv/football/over_2_5/prospective_clv_ledger.jsonl
      - evidence/notifications/telegram/MATRIX_TELEGRAM_SIGNAL_LEDGER.json

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REAL_MONEY: BLOCKED
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run tests
        run: PYTHONPATH=. python -m pytest -q tests/test_matrix_benter_second_stage_readiness_audit.py
      - name: Build readiness audit
        run: PYTHONPATH=. python -m tools.matrix_benter_second_stage_readiness_audit
      - name: Enforce fail-closed governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/api_football/model_validation/MATRIX_BENTER_SECOND_STAGE_READINESS_AUDIT_V1.json")
          x=json.loads(p.read_text())
          assert x["decision_count"]>0
          assert x["matched_model_market_outcome_triplets"]>=0
          assert x["readiness"]["benter_style_second_stage_fit_allowed"] is False
          assert x["governance"]["production_p_matrix_modified"] is False
          assert x["governance"]["market_probability_fused_into_production"] is False
          assert x["governance"]["real_money"]=="BLOCKED"
          print("MATRIX_BENTER_READINESS_GATE: PASS")
          print("decision_count=",x["decision_count"])
          print("matched_triplets=",x["matched_model_market_outcome_triplets"])
          print("artifact_sha256=",x["artifact_sha256"])
          PY
      - name: Persist evidence
        run: |
          git config user.name matrix-benter-readiness
          git config user.email matrix-benter-readiness@users.noreply.github.com
          git add evidence/api_football/model_validation/MATRIX_BENTER_SECOND_STAGE_READINESS_AUDIT_V1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence(football): persist Benter second-stage readiness audit"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
