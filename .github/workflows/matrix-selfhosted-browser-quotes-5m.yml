name: MATRIX Self-Hosted Browser Quotes 5m

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: matrix-selfhosted-browser-quotes-5m
  cancel-in-progress: false

jobs:
  collect:
    runs-on: [self-hosted, windows, matrix-browser-odds]
    timeout-minutes: 12
    env:
      MATRIX_BROWSER_CDP_ENDPOINT: http://127.0.0.1:9222
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED

    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Verify previously installed Windows Python 3.11 without downloading or installer scripts
        shell: cmd
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3,11), 'MATRIX_REQUIRES_LOCAL_PYTHON_311'"
          python -m pip --version

      - name: Install collector dependencies
        shell: cmd
        run: python -m pip install --disable-pip-version-check playwright pytest requests pillow tzdata

      - name: Enforce safety gates
        shell: cmd
        run: |
          if not "%REAL_MONEY%"=="BLOCKED" exit /B 1
          if not "%AUTO_BETTING%"=="DISABLED" exit /B 1
          echo REAL_MONEY_BLOCKED_NO_AUTOMATIC_BETTING

      - name: Start or reuse persistent CDP browser (process-only policy, no OS setting changes)
        shell: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: .\\tools\\windows\\start_matrix_browser_cdp.ps1 -Port 9222

      - name: Verify browser collector contracts
        shell: cmd
        run: |
          python -m pytest -q tests/test_matrix_selfhosted_browser_quote_collector.py tests/test_matrix_quote_recovery_evidence.py

      - name: Verify CDP health
        shell: cmd
        run: python -m tools.matrix_selfhosted_browser_health

      - name: Capture authorized bookmaker browser evidence
        shell: cmd
        run: python -m tools.matrix_selfhosted_browser_quote_collector

      - name: Persist governed browser evidence
        if: always()
        shell: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          git config user.name "matrix-browser-runner"
          git config user.email "matrix-browser-runner@users.noreply.github.com"

          $files = @(
            "evidence/notifications/telegram/MATRIX_SELF_HOSTED_BROWSER_HEALTH_LAST.json",
            "evidence/notifications/telegram/MATRIX_BROWSER_CDP_COLLECTION_LAST.json"
          )
          foreach ($file in $files) {
            if (Test-Path $file) { git add -- $file }
          }
          if (Test-Path "evidence/notifications/telegram/browser_cdp") {
            git add -- "evidence/notifications/telegram/browser_cdp"
          }
          if (Test-Path "evidence/football_world_inventory") {
            Get-ChildItem "evidence/football_world_inventory" -Recurse -Filter "MATRIX_BETANO_QUOTE_*.json" |
              ForEach-Object {
                $rel = Resolve-Path -Relative $_.FullName
                git add -- $rel
              }
          }

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "MATRIX_BROWSER_NO_EVIDENCE_CHANGE"
            exit 0
          }

          git commit -m "evidence(browser): persist self-hosted quote collection cycle"
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            git fetch origin repair/cor09-world-pipeline
            if ($LASTEXITCODE -ne 0) { throw "BROWSER_EVIDENCE_FETCH_FAILED" }
            git rebase origin/repair/cor09-world-pipeline
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort
              throw "BROWSER_EVIDENCE_REBASE_CONFLICT_FAIL_CLOSED"
            }
            git push origin HEAD:repair/cor09-world-pipeline
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (2 * $attempt)
          }
          throw "BROWSER_EVIDENCE_PUSH_FAILED"
