name: MATRIX Self-Hosted Browser Quotes 5m

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/matrix-selfhosted-browser-quotes-5m.yml
      - tools/matrix_selfhosted_browser_quote_collector.py
      - tools/matrix_calendar_browser_observations.py
      - tools/windows/collect_matrix_sofa_calendar.ps1
      - tests/test_matrix_calendar_browser_observations.py
      - tools/windows/start_matrix_browser_cdp.ps1
      - tools/windows/persist_matrix_browser_evidence.ps1
      - tests/test_matrix_selfhosted_browser_quote_collector.py
      - tests/test_matrix_browser_independent_research_quote_targets.py
      - tests/test_matrix_browser_candidate_pipeline_diagnostic.py
      - tools/matrix_telegram_input_health.py
      - tests/test_matrix_telegram_input_health.py
      - tools/matrix_independent_triple_source_calendar_certificate.py
      - tests/test_matrix_independent_triple_source_calendar_certificate.py
      - tools/matrix_independent_feature_parity_audit.py
      - tests/test_matrix_independent_feature_parity_audit.py
      - tools/matrix_independent_over25_championship_raw_feature_parity.py
      - tests/test_matrix_independent_over25_championship_raw_feature_parity.py
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: write

concurrency:
  group: matrix-selfhosted-browser-quotes-5m
  cancel-in-progress: false

jobs:
  collect:
    runs-on: [self-hosted, windows, matrix-browser-odds]
    timeout-minutes: 12
    env:
      MATRIX_BROWSER_CDP_ENDPOINT: http://127.0.0.1:9222
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED

    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Verify previously installed Windows Python 3.11 without downloading or installer scripts
        shell: cmd
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3,11), 'MATRIX_REQUIRES_LOCAL_PYTHON_311'"
          python -m pip --version

      - name: Install collector dependencies
        shell: cmd
        run: python -m pip install --disable-pip-version-check playwright pytest requests pillow tzdata

      - name: Enforce safety gates
        shell: cmd
        run: |
          if not "%REAL_MONEY%"=="BLOCKED" exit /B 1
          if not "%AUTO_BETTING%"=="DISABLED" exit /B 1
          echo REAL_MONEY_BLOCKED_NO_AUTOMATIC_BETTING

      - name: Start or reuse persistent CDP browser (process-only policy, no OS setting changes)
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools\\windows\\start_matrix_browser_cdp.ps1 -Port 9222

      - name: Verify browser collector contracts
        shell: cmd
        run: |
          python -m pytest -q tests/test_matrix_selfhosted_browser_quote_collector.py tests/test_matrix_calendar_browser_observations.py tests/test_matrix_quote_recovery_evidence.py tests/test_matrix_browser_independent_research_quote_targets.py tests/test_matrix_browser_candidate_pipeline_diagnostic.py tests/test_matrix_telegram_input_health.py tests/test_matrix_independent_triple_source_calendar_certificate.py tests/test_matrix_independent_feature_parity_audit.py tests/test_matrix_independent_over25_championship_raw_feature_parity.py

      - name: Verify immutable 11:24 versus latest PIT cycle and monthly 429 before authorized browser capture
        shell: cmd
        run: python -m pytest -q tests/test_matrix_championship_atomic_pit_cycle.py tests/test_matrix_independent_over25_quote_audit.py

      - name: Verify CDP health
        shell: cmd
        run: python -m tools.matrix_selfhosted_browser_health

      - name: Collect real SofaScore calendar observations from existing CDP before pricing
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools\\windows\\collect_matrix_sofa_calendar.ps1

      - name: Capture authorized bookmaker browser evidence
        shell: cmd
        run: python -m tools.matrix_selfhosted_browser_quote_collector

      - name: Persist governed browser evidence
        if: always()
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools\\windows\\persist_matrix_browser_evidence.ps1
