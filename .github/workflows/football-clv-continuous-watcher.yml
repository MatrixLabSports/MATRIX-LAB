# MATRIX_PHYSICAL_TRIGGER 2026-10-23T22:15-05:00 verify-next-day-clv-freeze
name: MATRIX Football CLV Continuous Watcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/football-clv-continuous-watcher.yml
  workflow_run:
    workflows:
      - MATRIX Football Daily Governed Pipeline
      - Telegram Señales Verdes MATRIX
    types:
      - completed

permissions:
  contents: write
  actions: write

concurrency:
  group: matrix-football-clv-continuous-watcher
  cancel-in-progress: false

jobs:
  watch:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
      WATCH_SECONDS: 19800
      POLL_SECONDS: 90

    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install targeted dependencies
        run: python -m pip install pytest requests

      - name: Verify CLV protections before watch
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_football_clv_tracking_cycle.py \
            tests/test_football_clv_odds_api_net_capture.py

      - name: Verify CLV tests do not mutate persisted evidence
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- evidence/clv/football/over_2_5; then
            echo "CLV_TEST_EVIDENCE_MUTATION_DETECTED" >&2
            exit 1
          fi
          echo "CLV_TEST_EVIDENCE_ISOLATION=PASS"

      - name: Validate watcher safety and secrets
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_NET_KEY: ${{ secrets.ODDS_API_NET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$MATRIX_MODE" = "SHADOW"
          test "$REAL_MONEY" = "BLOCKED"
          test "$AUTO_BETTING" = "DISABLED"
          test -n "$API_FOOTBALL_KEY"
          test -n "$ODDS_API_NET_KEY"
          echo "CLV_CONTINUOUS_WATCHER_SAFETY: PASS"
          echo "CLV_ODDS_API_NET_SECRET_PRESENT: PASS"

      - name: Verify startup coverage and per-cycle refresh contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/football-clv-continuous-watcher.yml > /tmp/football-clv-continuous-watcher.yml
          python - <<'PY'
          from pathlib import Path
          s=Path("/tmp/football-clv-continuous-watcher.yml").read_text(encoding="utf-8")
          required=[
              "workflow_run:",
              "MATRIX Football Daily Governed Pipeline",
              "git fetch origin repair/cor09-world-pipeline",
              "git rebase --autostash origin/repair/cor09-world-pipeline",
              "CLV_WATCHER_OPERATIONAL_REFRESH=PASS",
              "POLL_SECONDS: 90",
              "cancel-in-progress: false",
              'assert j["closing_freshness_policy"]["max_provider_quote_age_seconds"]==120',
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit("CLV_WATCHER_COVERAGE_CONTRACT_MISSING="+repr(missing))
          cycle=s.index('echo "CLV_WATCH_CYCLE=$cycle')
          refresh=s.index("git fetch origin repair/cor09-world-pipeline", cycle)
          freeze=s.index("python -m tools.football_clv_tracking_cycle --freeze-only", cycle)
          capture=s.index("python -m tools.football_clv_odds_api_net_capture", freeze)
          fallback=s.index("python -m tools.football_clv_tracking_cycle", capture)
          quality=s.index("python -m tools.football_clv_subgate_quality", fallback)
          if not (cycle < refresh < freeze < capture < fallback < quality):
              raise SystemExit("CLV_WATCHER_REFRESH_ORDER_INVALID")
          print("CLV_WATCHER_STARTUP_COVERAGE_CONTRACT=PASS")
          print("CLV_WATCHER_PER_CYCLE_REFRESH_ORDER=PASS")
          print("CLV_SUBGATE_30_QUALITY_MONITOR_CONTRACT=PASS")
          print("CLV_STRICT_FRESH_GATE_SECONDS=120")
          PY

      - name: Verify CLV per-attempt telemetry contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          targets=[
              Path("tools/football_clv_tracking_cycle.py"),
              Path("tools/football_clv_odds_api_net_capture.py"),
          ]
          required=[
              "attempted_at_utc",
              "provider_quote_updated_at_utc",
              "provider_quote_age_seconds",
              "gate_excess_seconds",
          ]
          for path in targets:
              s=path.read_text(encoding="utf-8")
              missing=[x for x in required if x not in s]
              if missing:
                  raise SystemExit(f"CLV_PER_ATTEMPT_TELEMETRY_MISSING {path}: {missing}")
          assert "MAX_PINNACLE_PROVIDER_QUOTE_AGE_SECONDS = 120" in Path("tools/football_clv_tracking_cycle.py").read_text(encoding="utf-8")
          print("CLV_PER_ATTEMPT_TELEMETRY_CONTRACT=PASS")
          print("CLV_TELEMETRY_FIELDS="+",".join(required))
          print("CLV_STRICT_FRESH_GATE_SECONDS=120")
          PY

      - name: Verify CLV incomplete-market diagnostics contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          checks={
              Path("tools/football_clv_tracking_cycle.py"):[
                  "_diagnose_pinnacle_over25_market",
                  "market_diagnostic",
                  "TOTAL_2_5_LINE_MISSING",
                  "OVER_2_5_MISSING",
                  "UNDER_2_5_MISSING",
              ],
              Path("tools/football_clv_odds_api_net_capture.py"):[
                  "_diagnose_total_25",
                  "market_diagnostic",
                  "TOTAL_2_5_LINE_MISSING",
                  "OVER_2_5_MISSING",
                  "UNDER_2_5_MISSING",
              ],
          }
          for path, required in checks.items():
              s=path.read_text(encoding="utf-8")
              missing=[x for x in required if x not in s]
              if missing:
                  raise SystemExit(f"CLV_INCOMPLETE_MARKET_DIAGNOSTIC_MISSING {path}: {missing}")
          assert "MAX_PINNACLE_PROVIDER_QUOTE_AGE_SECONDS = 120" in Path("tools/football_clv_tracking_cycle.py").read_text(encoding="utf-8")
          print("CLV_INCOMPLETE_MARKET_DIAGNOSTIC_CONTRACT=PASS")
          print("CLV_STRICT_FRESH_GATE_SECONDS=120")
          PY

      - name: Continuous CLV watch and immediate persistence
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_NET_KEY: ${{ secrets.ODDS_API_NET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-clv-continuous-watcher"
          git config user.email "matrix-clv-continuous-watcher@users.noreply.github.com"

          started_at="$(date -u +%s)"
          deadline="$((started_at + WATCH_SECONDS))"
          cycle=0

          persist_if_changed() {
            git add evidence/clv/football/over_2_5
            if git diff --cached --quiet; then
              echo "CLV_NO_STATE_CHANGE"
              return 0
            fi
            git commit -m "evidence(clv): persist continuous watcher cycle"
            for attempt in 1 2 3 4; do
              git fetch origin repair/cor09-world-pipeline
              if ! git rebase origin/repair/cor09-world-pipeline; then
                git rebase --abort || true
                return 1
              fi
              if git push origin HEAD:repair/cor09-world-pipeline; then
                echo "CLV_WATCHER_PUSH_SUCCEEDED_ATTEMPT=$attempt"
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          remaining_future() {
            PYTHONPATH=. python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from app.research.football.prospective_ledger import (
              ClosingOddsReference,
              FootballProspectiveEvidenceLedger,
              FrozenProspectiveDecision,
          )
          path=Path("evidence/clv/football/over_2_5/prospective_clv_ledger.jsonl")
          ledger=FootballProspectiveEvidenceLedger(path)
          closed=set()
          decisions=[]
          for event in ledger.load_events():
              if event.event_type=="CLOSING_ODDS_RECORDED":
                  closed.add(ClosingOddsReference.from_mapping(event.payload).decision_id)
              elif event.event_type=="DECISION_FROZEN":
                  decisions.append(FrozenProspectiveDecision.from_mapping(event.payload))
          now=datetime.now(timezone.utc)
          remaining=0
          next_kickoff=None
          for d in decisions:
              if d.decision_id in closed:
                  continue
              kickoff=datetime.fromisoformat(d.fixture_kickoff_utc.replace("Z","+00:00")).astimezone(timezone.utc)
              if kickoff <= now:
                  continue
              remaining += 1
              if next_kickoff is None or kickoff < next_kickoff:
                  next_kickoff=kickoff
          print(f"REMAINING_FUTURE={remaining}")
          print(f"NEXT_KICKOFF_UTC={next_kickoff.isoformat() if next_kickoff else 'NONE'}")
          PY
          }

          echo "CLV_CONTINUOUS_WATCHER_STARTED_UTC=$(date -u --iso-8601=seconds)"
          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            cycle=$((cycle + 1))
            echo "CLV_WATCH_CYCLE=$cycle UTC=$(date -u --iso-8601=seconds)"

            # Long-lived jobs must refresh the operational branch before every
            # cycle. Otherwise newly persisted daily reports/decisions can remain
            # invisible until after kickoff.
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase --autostash origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              echo "CLV_WATCHER_OPERATIONAL_REFRESH_FAILED" >&2
              exit 1
            fi
            echo "CLV_WATCHER_OPERATIONAL_REFRESH=PASS"

            PYTHONPATH=. python -m tools.football_clv_tracking_cycle --freeze-only
            PYTHONPATH=. python -m tools.football_clv_odds_api_net_capture
            PYTHONPATH=. python -m tools.football_clv_tracking_cycle
            PYTHONPATH=. python -m tools.football_clv_subgate_quality
            persist_if_changed

            status="$(remaining_future)"
            echo "$status"
            remaining="$(printf '%s\n' "$status" | sed -n 's/^REMAINING_FUTURE=//p')"
            if [ "$remaining" -eq 0 ]; then
              echo "CLV_CONTINUOUS_WATCHER_NO_FUTURE_DECISIONS"
              break
            fi

            sleep "$POLL_SECONDS"
          done

          echo "CLV_CONTINUOUS_WATCHER_FINISHED_UTC=$(date -u --iso-8601=seconds)"

      - name: Final CLV state gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/clv/football/over_2_5/state.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["protections"]["real_money"]=="BLOCKED"
          assert j["protections"]["automatic_wagering"] is False
          assert j["protections"]["odds_used_to_generate_probability"] is False
          assert j["closing_freshness_policy"]["max_provider_quote_age_seconds"]==120
          if j["closing_odds_count"] < 300:
              assert j["metrics_opened"] is False
              assert j["metrics"] is None
          print("CLV_CONTINUOUS_WATCHER_FINAL_GATE: PASS")
          print("decision_count=",j["decision_count"])
          print("closing_odds_count=",j["closing_odds_count"])
          print("missed_after_kickoff=",j["closing_cycle"]["missed_after_kickoff"])
          print("remaining_to_open_metrics=",j["remaining_to_open_metrics"])
          print("real_money=",j["protections"]["real_money"])
          PY

      - name: Renew watcher if future decisions remain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remaining="$(PYTHONPATH=. python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from app.research.football.prospective_ledger import (
              ClosingOddsReference,
              FootballProspectiveEvidenceLedger,
              FrozenProspectiveDecision,
          )
          path=Path("evidence/clv/football/over_2_5/prospective_clv_ledger.jsonl")
          ledger=FootballProspectiveEvidenceLedger(path)
          closed=set()
          decisions=[]
          for event in ledger.load_events():
              if event.event_type=="CLOSING_ODDS_RECORDED":
                  closed.add(ClosingOddsReference.from_mapping(event.payload).decision_id)
              elif event.event_type=="DECISION_FROZEN":
                  decisions.append(FrozenProspectiveDecision.from_mapping(event.payload))
          now=datetime.now(timezone.utc)
          count=0
          for d in decisions:
              if d.decision_id in closed:
                  continue
              kickoff=datetime.fromisoformat(d.fixture_kickoff_utc.replace("Z","+00:00")).astimezone(timezone.utc)
              if kickoff > now:
                  count += 1
          print(count)
          PY
          )"
          echo "CLV_FUTURE_DECISIONS_AFTER_WATCH=$remaining"
          if [ "$remaining" -gt 0 ]; then
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/MatrixLabSports/MATRIX-LAB/actions/workflows/football-clv-continuous-watcher.yml/dispatches" \
              -d '{"ref":"main"}'
            echo "CLV_SUCCESSOR_DISPATCHED"
          else
            echo "CLV_SUCCESSOR_NOT_NEEDED"
          fi
# MATRIX_CLV_REFRESH_REPAIR 2026-10-15 stale-checkout-before-each-cycle
# MATRIX_CLV_MULTI_TRANSPORT_REPAIR 2026-10-15 odds-api-preferred-api-football-fallback
# MATRIX_CLV_SINGLE_WRITER_LATEST_VERSION_WINS 2026-10-15

# MATRIX_CLV_PER_ATTEMPT_TELEMETRY_V2 2026-10-16 exact-attempt-fields-and-test-isolation

# MATRIX_CLV_INCOMPLETE_MARKET_DIAGNOSTICS_V1 2026-10-16 persist-exact-subreason

# MATRIX_CLV_TELEGRAM_BRIDGE_TRIGGER 2026-10-17 prospective-signal-freeze
