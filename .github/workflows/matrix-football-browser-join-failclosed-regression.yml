name: MATRIX Football Browser Three-Source Fail-Closed Regression

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tests/test_matrix_football_free_browser_provider_research_join.py
      - tools/matrix_football_free_browser_provider_research_join.py
      - tools/matrix_football_free_third_source_research.py
      - .github/workflows/matrix-football-browser-join-failclosed-regression.yml

permissions:
  contents: read

jobs:
  original-browser-sha-research-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REAL_MONEY: BLOCKED
      AUTOMATIC_WAGERING: "false"
    steps:
      - name: Checkout only offline source research contracts
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools
            tests
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Execute actual SHA and missing-source fail-closed tests
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = BLOCKED
          test "$AUTOMATIC_WAGERING" = false
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=. python -m pytest -q tests/test_matrix_football_free_browser_provider_research_join.py tests/test_matrix_football_free_third_source_research.py tests/test_matrix_football_authorized_dual_browser_research.py
