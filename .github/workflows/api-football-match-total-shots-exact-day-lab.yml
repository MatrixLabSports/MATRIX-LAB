name: API-Football MATCH_TOTAL_SHOTS exact-day lab

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/api-football-match-total-shots-exact-day-lab.yml
      - tools/api_football_match_total_shots_exact_day_lab.py

permissions:
  contents: write

concurrency:
  group: api-football-match-total-shots-exact-day-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    env:
      MATRIX_TARGET_DATE_BOGOTA: "2026-10-10"
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - name: Checkout exact trigger state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install requests
      - name: Safety gates
        shell: bash
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = "BLOCKED"
          test "$AUTO_BETTING" = "DISABLED"
      - name: Require API-Football secret
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}"
          python - <<'PY'
          import os
          os.environ["API_FOOTBALL_KEY"].encode("ascii")
          print("API_FOOTBALL_KEY_PRESENT_AND_ASCII")
          PY
      - name: Run MATCH_TOTAL_SHOTS exact-day research lab
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          python -m tools.api_football_match_total_shots_exact_day_lab
      - name: Assert research-only protections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/api_football/match_total_shots_lab/2026-10-10/last_run.json").read_text())
          assert p["real_money"] == "BLOCKED"
          assert p["automatic_wagering"] is False
          assert p["telegram_signal_authorized"] is False
          print("MATCH_TOTAL_SHOTS_RESEARCH_PROTECTIONS=PASS")
          PY
      - name: Persist physical research evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-match-total-shots-lab"
          git config user.email "matrix-match-total-shots-lab@users.noreply.github.com"
          git add evidence/api_football/match_total_shots_lab/2026-10-10
          if git diff --cached --quiet; then
            echo "NO_MATCH_TOTAL_SHOTS_EVIDENCE"
            exit 3
          fi
          git commit -m "evidence(football): persist MATCH_TOTAL_SHOTS exact-day research lab"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
