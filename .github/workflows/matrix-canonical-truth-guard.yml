# MATRIX_USER_AUTHORIZED_FINAL_GUARD 2026-10-20T21:58-05:00
# MATRIX_USER_AUTHORIZED_FINAL_GUARD 2026-10-20T21:49-05:00
# MATRIX_USER_AUTHORIZED_FINAL_CERTIFICATION 2026-10-20T21:11-05:00
# FINAL_PHYSICAL_CERTIFICATION_REQUEST_CURRENT
# VERIFY_FOOTBALL_REFRESH_30MIN_20OCT2026
# FINAL_VERIFY_30MIN_CANONICAL_20OCT2026
# VERIFY_30_MINUTE_FRESHNESS_BOUNDARY_20OCT2026
# VERIFY_CONTROLS_POST_REFRESH_20OCT2026_1058UTC
# MATRIX_RECHECK_DAILY_BANKROLL_CANONICAL 2026-10-20
name: MATRIX Canonical Truth Guard

on:
  workflow_dispatch:
  schedule:
    - cron: "13,28,43,58 * * * *"
  workflow_run:
    workflows:
      - "MATRIX Football 4000 Canonical Tracker"
      - "API-Football prospective FINAL-only settlement now"
      - "MATRIX Tennis Three-Block Stagnation Audit"
      - "MATRIX Live Tennis Cumulative Gate Reconcile"
      - "MATRIX Tennis Hard Governed Day Resolution"
      - "MATRIX Tennis Clay Daily Prospective"
      - "MATRIX Telegram Daily Bankroll Canonical"
      - "Telegram MATRIX Supervisor cada 15 minutos"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - .github/workflows/matrix-canonical-truth-guard.yml

permissions:
  contents: write

concurrency:
  group: matrix-canonical-truth-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REAL_MONEY: BLOCKED
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Verify guard tests
        run: PYTHONPATH=. python -m pytest -q tests/test_matrix_canonical_truth_guard.py

      - name: Run canonical truth guard
        id: guard
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python -m tools.matrix_canonical_truth_guard             --registry evidence/governance/MATRIX_CANONICAL_SOURCE_REGISTRY.json             --out evidence/governance/MATRIX_CANONICAL_TRUTH_GUARD_LAST.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist physical evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-canonical-truth-guard
          git config user.email matrix-canonical-truth-guard@users.noreply.github.com
          git add evidence/governance/MATRIX_CANONICAL_TRUTH_GUARD_LAST.json
          if git diff --cached --quiet; then
            echo "NO_GUARD_CHANGE"
          else
            git commit -m "evidence(governance): persist canonical truth guard"
            for attempt in 1 2 3 4; do
              git fetch origin repair/cor09-world-pipeline
              if ! git rebase origin/repair/cor09-world-pipeline; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
              sleep $((attempt*2))
            done
            exit 1
          fi

      - name: Fail closed on stale or conflicting truth
        if: steps.guard.outputs.exit_code != '0'
        run: |
          echo "MATRIX_CANONICAL_TRUTH_GUARD: FAIL_CLOSED"
          exit 2
