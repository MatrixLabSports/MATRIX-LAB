name: MATRIX Dixon-Coles Full Over2.5 Challenger

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/matrix_dixon_coles_full_over25_challenger.py
      - tests/test_matrix_dixon_coles_full_over25_challenger.py
      - .github/workflows/matrix-dixon-coles-full-over25-challenger.yml

permissions:
  contents: write

concurrency:
  group: matrix-dixon-coles-full-over25-challenger
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REAL_MONEY: BLOCKED
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pytest numpy scipy

      - name: Run tests
        run: PYTHONPATH=. python -m pytest -q tests/test_matrix_dixon_coles_full_over25_challenger.py

      - name: Run full Dixon-Coles challenger
        run: PYTHONPATH=. python -m tools.matrix_dixon_coles_full_over25_challenger

      - name: Enforce research governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/api_football/model_validation/MATRIX_DIXON_COLES_FULL_OVER25_CHALLENGER_V1.json")
          x=json.loads(p.read_text())
          assert x["schema"]=="MATRIX_DIXON_COLES_FULL_OVER25_CHALLENGER_V1"
          assert x["holdout_row_count"]>0
          assert x["governance"]["research_only"] is True
          assert x["governance"]["production_engine_modified"] is False
          assert x["governance"]["p_matrix_modified"] is False
          assert x["governance"]["odds_used_to_generate_probability"] is False
          assert x["governance"]["second_stage_market_fusion_enabled"] is False
          assert x["governance"]["real_money"]=="BLOCKED"
          print("MATRIX_DIXON_COLES_FULL_GATE: PASS")
          print("holdout_row_count=",x["holdout_row_count"])
          print("delta_brier=",x["holdout_delta_dc_minus_frozen"]["brier"])
          print("delta_log_loss=",x["holdout_delta_dc_minus_frozen"]["log_loss"])
          print("adjudication=",x["adjudication"])
          print("artifact_sha256=",x["artifact_sha256"])
          PY

      - name: Persist evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-dixon-coles-research
          git config user.email matrix-dixon-coles-research@users.noreply.github.com
          git add evidence/api_football/model_validation/MATRIX_DIXON_COLES_FULL_OVER25_CHALLENGER_V1.json
          if git diff --cached --quiet; then
            echo "NO_DIXON_COLES_CHANGE"
            exit 0
          fi
          git commit -m "evidence(research): persist full Dixon-Coles challenger"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
