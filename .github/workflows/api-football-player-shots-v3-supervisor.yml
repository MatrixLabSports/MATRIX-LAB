name: API-Football Player Shots v3 Supervisor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-player-shots-v3-supervisor.yml
  workflow_dispatch:
  schedule:
    - cron: "12,27,42,57 * * * *"

permissions:
  contents: write

concurrency:
  group: api-football-player-shots-v3-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests pytest
      - name: Verify prospective protections
        run: python -m pytest -q tests/test_api_football_player_shots_v3_supervisor.py
      - name: Run Player Shots v3 supervisor
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m tools.api_football_player_shots_v3_supervisor
      - name: Enforce governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("evidence/api_football/player_shots_v3_prospective")
          p=json.loads((root/"last_run.json").read_text())
          s=json.loads((root/"state.json").read_text())
          assert p["status"]=="PASS"
          assert p["odds_used_to_generate_probability"] is False
          assert p["automatic_wagering"] is False
          assert p["real_money"]=="BLOCKED"
          assert s["historical_role_source"]=="/fixtures/lineups"
          assert s["prospective_role_source"]=="/fixtures/lineups"
          assert s["parameter_tuning_allowed"] is False
          assert s["real_money"]=="BLOCKED"
          for g in ("30","50","100","200"):
              if s["gates"][g]["metrics_opened"]:
                  assert s["gates"][g]["status"]=="OPENED_AT_THRESHOLD"
          print("PLAYER_SHOTS_V3_SUPERVISOR_GOVERNANCE: PASS")
          PY
      - name: Persist supervisor evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-player-shots-v3-supervisor"
          git config user.email "matrix-football-player-shots-v3-supervisor@users.noreply.github.com"
          git add evidence/api_football/player_shots_v3_prospective
          if git diff --cached --quiet; then
            echo "NO_PLAYER_SHOTS_V3_CHANGE"
            exit 0
          fi
          git commit -m "evidence(football): persist Player Shots v3 supervisor"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
