name: MATRIX Browser Capture Watchdog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/matrix-browser-capture-watchdog.yml
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_run:
    workflows:
      - Telegram Señales Verdes MATRIX
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: matrix-browser-capture-watchdog
  cancel-in-progress: false

jobs:
  verify-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
      MATRIX_MODE: SHADOW
      PYTHONPATH: .
    steps:
      - name: Checkout existing fail-closed research code
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          persist-credentials: false
      - name: Set up test Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact research safety and failover decision tests
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = BLOCKED
          test "$AUTO_BETTING" = DISABLED
          test "$MATRIX_MODE" = SHADOW
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_matrix_browser_capture_watchdog.py
      - name: Inspect actual latest five-minute browser runs without secrets
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/matrix-selfhosted-browser-quotes-5m.yml/runs?per_page=20" > "$RUNNER_TEMP/matrix-browser-runs.json"
          python -m tools.matrix_browser_capture_watchdog --runs-json "$RUNNER_TEMP/matrix-browser-runs.json" --max-age-seconds 720 --output "$RUNNER_TEMP/matrix-browser-watchdog-decision.json"
          export MATRIX_WATCHDOG_DECISION="$RUNNER_TEMP/matrix-browser-watchdog-decision.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          with open(os.environ["MATRIX_WATCHDOG_DECISION"],encoding="utf-8") as f:
              d=json.load(f)
          assert d["real_money"]=="BLOCKED" and d["automatic_wagering"] is False
          assert d["telegram_signal_authorized"] is False
          print("dispatch="+str(d["dispatch"]).lower())
          print("reason="+d["reason"])
          PY
      - name: Recover missing browser capture via existing research-only workflow
        if: steps.freshness.outputs.dispatch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run matrix-selfhosted-browser-quotes-5m.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "BROWSER_CAPTURE_FAILOVER_DISPATCHED: ${{ steps.freshness.outputs.reason }}"
      - name: Expose overdue local Windows runner instead of reporting healthy capture
        if: steps.freshness.outputs.reason == 'BROWSER_RUN_QUEUED_OVERDUE_LOCAL_RUNNER_REQUIRED'
        shell: bash
        run: |
          echo "::error title=MATRIX self-hosted runner offline or unavailable::Browser job has waited longer than 12 minutes for the Windows listener; restart the local runner. No duplicate workflow dispatched and no green signal authorized."
          echo "## MATRIX BROWSER LOCAL RUNNER RECOVERY REQUIRED" >> "$GITHUB_STEP_SUMMARY"
          echo "A queued self-hosted Windows job cannot execute bookmaker capture. Start C:\\actions-runner\\run.cmd on the authorized Windows host. Never replace missing prices with fabricated odds." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Save read-only run freshness and watchdog decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-browser-capture-watchdog
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/matrix-browser-watchdog-decision.json
            ${{ runner.temp }}/matrix-browser-runs.json
