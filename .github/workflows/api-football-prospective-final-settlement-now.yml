# MATRIX_PHYSICAL_TRIGGER 2026-10-09T05:41Z prove-workflow-run-chain
name: API-Football prospective FINAL-only settlement now

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/api-football-prospective-final-settlement-now.yml

permissions:
  contents: write

concurrency:
  group: api-football-prospective-final-settlement-now
  cancel-in-progress: false

jobs:
  settle-sync-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install governed dependencies
        run: python -m pip install pytest requests

      - name: Run settlement and V2 regression tests
        run: |
          python -m pytest -q \
            tests/test_api_football_prospective_api_settlement.py \
            tests/test_api_football_prospective_supervisor.py \
            tests/test_api_football_market_calibration_v2.py

      - name: Record supervisor due state
        run: |
          python -m tools.api_football_prospective_supervisor \
            --out evidence/api_football/prospective_supervisor/last_run.json

      - name: Settle API-Football standard FINAL results only
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m tools.api_football_prospective_api_settlement

      - name: Sync calibration ledger without opening metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.api_football_prospective_calibration import sync_calibration_ledger

          root = Path("evidence/api_football")
          sync = sync_calibration_ledger(root)
          out = root / "prospective_calibration" / "sync_last.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(
              json.dumps(sync, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          assert sync["ledger_hash_chain_verified"] is True
          assert sync["parameters_mutated"] is False
          assert sync["real_money"] == "BLOCKED"
          print(json.dumps(sync, sort_keys=True))
          PY

      - name: Sync separated V2 market lanes
        run: python tools/api_football_market_calibration_v2_sync.py

      - name: Enforce FINAL-only and sealed-metrics invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("evidence/api_football")
          settlement = json.loads(
              (root / "prospective_market_freeze" / "settlement_sync_last.json").read_text(encoding="utf-8")
          )
          assert settlement["status"] == "PASS"
          assert settlement["settlement_final_only"] is True
          assert settlement["metrics_opened"] is False
          assert settlement["outcomes_used_for_metrics"] == 0
          assert settlement["p_matrix_status"] == "NOT_GENERATED"
          assert settlement["real_money"] == "BLOCKED"

          for slug in ("1x2", "over_2_5", "under_2_5", "double_chance_1x", "double_chance_x2"):
              state = json.loads(
                  (root / "calibration_v2" / "lanes" / slug / "state.json").read_text(encoding="utf-8")
              )
              assert state["metrics_opened"] is False
              assert state["parameter_tuning_allowed"] is False
              assert state["real_money"] == "BLOCKED"

          print("FINAL_ONLY_SETTLEMENT_AND_V2_SEALED_GATE: PASS")
          print("new_settlement_count=", settlement["new_settlement_count"])
          print("ledger_final_count=", settlement["ledger_final_count"])
          PY

      - name: Persist governed evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-api-football-supervisor"
          git config user.email "matrix-api-football-supervisor@users.noreply.github.com"
          git add \
            evidence/api_football/prospective_supervisor/last_run.json \
            evidence/api_football/prospective_market_freeze/settlement_ledger.jsonl \
            evidence/api_football/prospective_market_freeze/settlement_sync_last.json \
            evidence/api_football/prospective_market_freeze/settlement_raw \
            evidence/api_football/prospective_calibration/ledger.jsonl \
            evidence/api_football/prospective_calibration/sync_last.json \
            evidence/api_football/calibration_v2/lanes
          if git diff --cached --quiet; then
            echo "NO_GOVERNED_SETTLEMENT_CHANGE"
            exit 0
          fi
          git commit -m "evidence(football): refresh FINAL-only prospective settlement and V2"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then
              echo "PUSH_SUCCEEDED_ATTEMPT=${attempt}"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
