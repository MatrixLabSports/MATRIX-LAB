name: MATRIX Elite Committee Guard

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - config/MATRIX_ELITE_COMMITTEE_REGISTRY.json
      - tools/matrix_elite_committee_guard.py
      - tests/test_matrix_elite_committee_guard.py

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_matrix_elite_committee_guard.py
      - run: PYTHONPATH=. python -m tools.matrix_elite_committee_guard
