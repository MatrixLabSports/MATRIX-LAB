name: MATRIX Double Chance 1X Promotion Readiness Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "13,28,43,58 * * * *"
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/matrix_double_chance_1x_promotion_readiness_audit.py
      - tools/telegram_multi_market_signal_gate.py
      - .github/workflows/api-football-double-chance-1x-promotion-readiness.yml
      - evidence/api_football/calibration_v2/OOS_4001_5000_STATE.json
      - evidence/api_football/calibration_v2/lanes/double_chance_1x/state.json

permissions:
  contents: read

concurrency:
  group: matrix-double-chance-1x-readiness
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build 1X readiness evidence
        run: PYTHONPATH=. python -m tools.matrix_double_chance_1x_promotion_readiness_audit
      - name: Assert fail-closed safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("evidence/api_football/governance/MATRIX_DOUBLE_CHANCE_1X_PROMOTION_READINESS_LAST.json").read_text())
          assert j["governance"]["real_money"]=="BLOCKED"
          assert j["governance"]["automatic_wagering"] is False
          assert j["governance"]["odds_may_not_generate_probability"] is True
          assert j["governance"]["p_matrix_must_exist_before_odds"] is True
          if not j["promotion_allowed"]:
              assert j["signal_status"]=="RESEARCH_ONLY"
              assert j["blockers"]
          print(j["status"], j["blockers"])
          PY
      - name: Rebuild multi-market gate
        run: PYTHONPATH=. python -m tools.telegram_multi_market_signal_gate
