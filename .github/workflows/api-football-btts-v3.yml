name: API-Football BTTS v3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-btts-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-football-btts-v3
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Verify BTTS v3 temporal protections
        run: python -m pytest -q tests/test_api_football_btts_challenger_v3.py

      - name: Build BTTS v3 candidate
        run: python -m tools.api_football_btts_challenger_v3

      - name: Enforce BTTS v3 governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/api_football/btts_challenger_v3/manifest.json").read_text())
          assert p["development_count"]==2022
          assert p["final_holdout_excluded_count"]==357
          assert p["final_holdout_used_for_tuning"] is False
          assert p["prospective_checkpoint_200_used_for_tuning"] is False
          assert p["prospective_ledger_used_for_tuning"] is False
          assert p["prospective_validation_policy"]["original_357_holdout_reuse"] is False
          assert p["prospective_validation_policy"]["checkpoint_200_reuse"] is False
          assert p["prospective_validation_policy"]["parameter_tuning_after_freeze"] is False
          assert p["p_matrix_generated"] is False
          assert p["automatic_wagering"] is False
          assert p["real_money"]=="BLOCKED"
          print("MATRIX_BTTS_V3_GOVERNANCE_GATE: PASS")
          PY

      - name: Persist BTTS v3 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-btts-v3"
          git config user.email "matrix-football-btts-v3@users.noreply.github.com"
          git add evidence/api_football/btts_challenger_v3
          if git diff --cached --quiet; then
            echo "NO_BTTS_V3_EVIDENCE_TO_PERSIST"
            exit 3
          fi
          git commit -m "evidence(football): persist BTTS v3 temporal OOS candidate"
          git status --porcelain
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
