name: MATRIX Provider Readiness Offline
on:
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governed operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify fail-closed provider inventory
        run: python -m pytest -q tests/test_matrix_provider_readiness_offline.py
      - name: Record provider evidence status without network calls
        run: python -m tools.matrix_provider_readiness_offline --out evidence/governance/MATRIX_PROVIDER_READINESS_OFFLINE_LAST.json
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: matrix-provider-readiness-offline
          path: evidence/governance/MATRIX_PROVIDER_READINESS_OFFLINE_LAST.json
          if-no-files-found: error
