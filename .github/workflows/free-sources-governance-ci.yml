name: Free Sources Governance CI

on:
  push:
    branches: [main]
    paths:
      - 'app/providers/free_sources.py'
      - 'tests/test_free_sources_governance.py'
      - 'governance/FREE_DATA_SOURCES_V1.md'
      - '.github/workflows/free-sources-governance-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_free_sources_governance.py
      - name: Assert permanent controls
        run: |
          grep -q 'REAL_MONEY=BLOCKED' governance/FREE_DATA_SOURCES_V1.md
          grep -q 'AUTO_BETTING=DISABLED' governance/FREE_DATA_SOURCES_V1.md
          grep -q 'Odds/market prices MUST NOT generate P_MATRIX' governance/FREE_DATA_SOURCES_V1.md
