name: Paid API Preservation Until 13OCT

on:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/paid-api-preservation-until-13oct.yml
  workflow_dispatch:
  schedule:
    - cron: "25 06 * * *"

permissions:
  contents: write

concurrency:
  group: paid-api-preservation-until-13oct
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Resolve preservation window
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          NOW_BOGOTA="$(TZ=America/Bogota date +%F)"
          RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "today_bogota=$NOW_BOGOTA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          if [[ "$NOW_BOGOTA" > "2026-10-13" ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "PRESERVATION_WINDOW_CLOSED"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "PRESERVATION_WINDOW_ACTIVE $NOW_BOGOTA"
          fi

      - name: Capture API-Tennis raw fixtures and ATP standings 08-13 OCT
        if: steps.guard.outputs.active == 'true'
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          RUN_ID: ${{ steps.guard.outputs.run_id }}
        run: |
          python -m tools.api_tennis_raw_archive             --start 2026-10-08             --stop 2026-10-13             --out-root "evidence/paid_api_archive/$RUN_ID/api_tennis"

      - name: Capture RapidAPI Tennis normalized world inventory 08-13 OCT
        if: steps.guard.outputs.active == 'true'
        env:
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
          RUN_ID: ${{ steps.guard.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "evidence/paid_api_archive/$RUN_ID/rapidapi_tennis"
          for D in 2026-10-08 2026-10-09 2026-10-10 2026-10-11 2026-10-12 2026-10-13; do
            python -m tools.tennis_world_inventory_rapidapi               --target-date-bogota "$D"               --out "evidence/paid_api_archive/$RUN_ID/rapidapi_tennis/${D}_world_inventory.json"               --fail-on-partial
          done

      - name: Capture API-Football raw fixtures 08-13 OCT
        if: steps.guard.outputs.active == 'true'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          RUN_ID: ${{ steps.guard.outputs.run_id }}
        run: |
          python -m tools.api_football_raw_archive             --start 2026-10-08             --stop 2026-10-13             --out-root "evidence/paid_api_archive/$RUN_ID/api_football"

      - name: Capture high-value RapidAPI Tennis historical stats probe
        if: steps.guard.outputs.active == 'true'
        continue-on-error: true
        env:
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
          RUN_ID: ${{ steps.guard.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "evidence/paid_api_archive/$RUN_ID/rapidapi_tennis_history"
          python -m tools.cor0203_rapidapi_stats_rich_history_probe             --max-targets 32             --out "evidence/paid_api_archive/$RUN_ID/rapidapi_tennis_history/stats_rich_probe.json"

      - name: Build preservation manifest
        if: steps.guard.outputs.active == 'true'
        env:
          RUN_ID: ${{ steps.guard.outputs.run_id }}
        run: |
          python -m tools.paid_api_archive_manifest             --root evidence/tennis_world_inventory             --root evidence/tennis/world_inventory             --root evidence/cor0203/acquisition             --root evidence/cor0203/api_tennis_stats_rich             --root evidence/cor0203/rapidapi_stats_rich             --root evidence/cor0203/preholdout             --root evidence/api_football/history             --root evidence/api_football/fixtures             --root evidence/api_football/prospective_daily             --root evidence/api_football/market_expansion             --root evidence/live_tennis_lab             --root "evidence/paid_api_archive/$RUN_ID"             --out "evidence/paid_api_archive/$RUN_ID/MATRIX_PAID_API_PRESERVATION_MANIFEST.json"

      - name: Build preservation certificate
        if: steps.guard.outputs.active == 'true'
        env:
          RUN_ID: ${{ steps.guard.outputs.run_id }}
          TODAY_BOGOTA: ${{ steps.guard.outputs.today_bogota }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          rid=os.environ["RUN_ID"]
          root=Path("evidence/paid_api_archive")/rid
          manifest=json.loads((root/"MATRIX_PAID_API_PRESERVATION_MANIFEST.json").read_text())
          api_tennis=json.loads((root/"api_tennis/manifest.json").read_text())
          api_football=json.loads((root/"api_football/manifest.json").read_text())
          rapid_files=sorted((root/"rapidapi_tennis").glob("*_world_inventory.json"))
          rapid=[]
          for p in rapid_files:
              j=json.loads(p.read_text())
              rapid.append({
                  "path":str(p),
                  "target_date_bogota":j.get("target_date_bogota"),
                  "unique_match_count":j.get("unique_match_count"),
                  "provider_network_calls":j.get("provider_network_calls"),
                  "sha256":hashlib.sha256(p.read_bytes()).hexdigest()
              })
          hist=root/"rapidapi_tennis_history/stats_rich_probe.json"
          hist_summary=None
          if hist.exists():
              h=json.loads(hist.read_text())
              hist_summary={
                  "path":str(hist),
                  "target_count":h.get("target_count"),
                  "provider_network_calls":h.get("provider_network_calls"),
                  "sha256":hashlib.sha256(hist.read_bytes()).hexdigest()
              }
          cert={
              "schema":"MATRIX_PAID_API_PRESERVATION_CERTIFICATE_V1",
              "generated_at_utc":datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "run_id":rid,
              "today_bogota":os.environ["TODAY_BOGOTA"],
              "preservation_deadline_bogota":"2026-10-13",
              "status":"PASS_SNAPSHOT_PRESERVED",
              "api_tennis":{
                  "date_start":api_tennis["date_start"],
                  "date_stop":api_tennis["date_stop"],
                  "fixture_rows":sum(x["fixture_rows"] for x in api_tennis["captures"]),
                  "standings_rows":api_tennis["standings"]["rows"],
                  "network_calls":api_tennis["network_calls"],
              },
              "rapidapi_tennis":{
                  "days_captured":len(rapid),
                  "snapshots":rapid,
                  "historical_probe":hist_summary,
              },
              "api_football":{
                  "date_start":api_football["date_start"],
                  "date_stop":api_football["date_stop"],
                  "fixture_rows":sum(x["fixture_rows"] for x in api_football["captures"]),
                  "network_calls":api_football["network_calls"],
              },
              "repository_evidence_inventory":manifest["summary"],
              "protections":{
                  "secrets_persisted":False,
                  "model_state_modified_by_archive":False,
                  "metrics_opened":False,
                  "automatic_wagering":False,
                  "real_money":"BLOCKED"
              }
          }
          raw=json.dumps(cert,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
          cert["sha256_without_self"]=hashlib.sha256(raw).hexdigest()
          (root/"MATRIX_PAID_API_PRESERVATION_CERTIFICATE.json").write_text(
              json.dumps(cert,indent=2,sort_keys=True,ensure_ascii=False)+"\n"
          )
          print(json.dumps({
              "status":cert["status"],
              "api_tennis_fixture_rows":cert["api_tennis"]["fixture_rows"],
              "rapidapi_days":cert["rapidapi_tennis"]["days_captured"],
              "api_football_fixture_rows":cert["api_football"]["fixture_rows"],
              "inventory_files":cert["repository_evidence_inventory"]["file_count"],
              "inventory_bytes":cert["repository_evidence_inventory"]["total_bytes"]
          },sort_keys=True))
          PY

      - name: Reject oversized archive files
        if: steps.guard.outputs.active == 'true'
        shell: bash
        env:
          RUN_ID: ${{ steps.guard.outputs.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          root=Path("evidence/paid_api_archive")/os.environ["RUN_ID"]
          too_large=[(str(p),p.stat().st_size) for p in root.rglob("*") if p.is_file() and p.stat().st_size>90*1024*1024]
          if too_large:
              raise SystemExit("ARCHIVE_FILE_EXCEEDS_90MB:"+str(too_large))
          print("ARCHIVE_SIZE_GATE_PASS")
          PY

      - name: Persist immutable archive snapshot
        if: steps.guard.outputs.active == 'true'
        shell: bash
        env:
          RUN_ID: ${{ steps.guard.outputs.run_id }}
        run: |
          set -euo pipefail
          git config user.name matrix-paid-api-archive
          git config user.email matrix-paid-api-archive@users.noreply.github.com
          git add "evidence/paid_api_archive/$RUN_ID"
          if git diff --cached --quiet; then
            echo "NO_ARCHIVE_CHANGE"
            exit 0
          fi
          git commit -m "evidence(archive): preserve paid API snapshot $RUN_ID"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then
              exit 0
            fi
            sleep $((attempt*2))
          done
          exit 1
