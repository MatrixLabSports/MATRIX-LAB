name: COR10 genuine future shadow execution

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cor10-genuine-future-shadow-execution.yml

permissions:
  contents: write

concurrency:
  group: cor10-genuine-future-shadow-execution
  cancel-in-progress: false

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Verify COR10 future-execution tests
        run: python -m pytest -q tests/test_cor10_genuine_future_shadow_execution.py
      - name: Create genuine future shadow execution
        run: python -m tools.cor10_genuine_future_shadow_execution
      - name: Enforce COR10 literal gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/cor10/MATRIX_COR10_GENUINE_FUTURE_EXECUTION.json").read_text())
          a=json.loads(Path("evidence/cor10/MATRIX_COR10_ADJUDICATION.json").read_text())
          assert a["pass"] is True
          assert a["status"]=="RESOLVED"
          assert a["execution_count"]==1
          assert a["future_execution_count"]==1
          assert a["future_execution_rate"]==1.0
          assert all(a["checks"].values())
          assert r["future_at_execution"] is True
          assert r["bookmaker"]=="Pinnacle"
          assert r["stake"]["amount"]>0
          assert r["stake"]["currency"]=="COP"
          assert r["stake"]["funds_transferred"] is False
          assert r["automatic_wagering"] is False
          assert r["real_money"]=="BLOCKED"
          print("MATRIX_COR10_LITERAL_GATE: PASS")
          print("execution_id=",r["execution_id"])
          print("executed_at_utc=",r["executed_at_utc"])
          print("kickoff_utc=",r["kickoff_utc"])
          print("bookmaker=",r["bookmaker"])
          print("decimal_odds=",r["decimal_odds"])
          print("stake=",r["stake"])
          PY
      - name: Persist COR10 evidence
        run: |
          git config user.name "matrix-cor10-adjudicator"
          git config user.email "matrix-cor10-adjudicator@users.noreply.github.com"
          git add evidence/cor10
          git commit -m "evidence(cor10): persist genuine future shadow execution"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
