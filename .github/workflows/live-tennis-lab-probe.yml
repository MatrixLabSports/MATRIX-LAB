name: Live Tennis Laboratory Probe

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/live_tennis_lab_probe.py
      - .github/workflows/live-tennis-lab-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Capture current live tennis snapshot
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVETENNISAPI_KEY }}
        run: python -m tools.live_tennis_lab_probe
      - name: Persist live snapshot
        run: |
          git config user.name "matrix-live-tennis-lab"
          git config user.email "matrix-live-tennis-lab@users.noreply.github.com"
          git add evidence/live_tennis_lab/2026-10-06/MATRIX_LIVE_TENNIS_LAB_SNAPSHOT.json
          git commit -m "evidence(live): persist live tennis laboratory snapshot"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
