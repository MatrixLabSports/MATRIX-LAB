name: MATRIX Colombia ESPN Canonical Experimental PIT Input
on:
  workflow_dispatch:
  push:
    branches: [repair/cor09-world-pipeline]
    paths:
      - .github/workflows/matrix-colombia-239-canonical-experimental.yml
      - tools/matrix_colombia_239_espn_canonical_experimental_bridge.py
      - tests/test_matrix_colombia_239_espn_canonical_experimental_bridge.py
permissions:
  contents: write
concurrency:
  group: matrix-colombia-239-espn-canonical-experimental
  cancel-in-progress: false
jobs:
  authentic-provider-canonical-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REAL_MONEY: BLOCKED
      AUTOMATIC_WAGERING: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/matrix_colombia_239_espn_canonical_experimental_bridge.py
            tools/matrix_colombia_239_original_espn_historic_crosswalk.py
            app/research/football/match_analysis_input.py
            tests/test_matrix_colombia_239_espn_canonical_experimental_bridge.py
            evidence/football_world_inventory/2026-11-22/sources/ESPN_COL_239_FULLSEASON_RAW_RUN_45089678156.json.gz
            evidence/football_world_inventory/2026-11-22/MATRIX_COLOMBIA_239_FULLSEASON_GOAL_PARITY_RUN_45089678156.json
            evidence/football_world_inventory/2026-11-22/MATRIX_COLOMBIA_239_ORIGINAL_FORMULA_SHADOW_RUN_45089678156.json
            evidence/football_world_inventory/2026-11-24/MATRIX_COLOMBIA_THREE_SOURCE_READINESS_RUN_45090559298.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test source receipt and native IDs with original formal analysis input contract
        run: |
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=. python -m pytest -q tests/test_matrix_colombia_239_espn_canonical_experimental_bridge.py
      - name: Verify two real matches have complete SHA bound strictly prior 20 team histories
        shell: bash
        run: |
          set -euo pipefail
          OUT="evidence/football_world_inventory/2026-11-24/MATRIX_COL_239_EXPERIMENTAL_CANONICAL_INPUT_RUN_${{ github.run_id }}.json"
          PYTHONPATH=. python -m tools.matrix_colombia_239_espn_canonical_experimental_bridge \
            --espn-gz evidence/football_world_inventory/2026-11-22/sources/ESPN_COL_239_FULLSEASON_RAW_RUN_45089678156.json.gz \
            --parity evidence/football_world_inventory/2026-11-22/MATRIX_COLOMBIA_239_FULLSEASON_GOAL_PARITY_RUN_45089678156.json \
            --three evidence/football_world_inventory/2026-11-24/MATRIX_COLOMBIA_THREE_SOURCE_READINESS_RUN_45090559298.json \
            --shadow evidence/football_world_inventory/2026-11-22/MATRIX_COLOMBIA_239_ORIGINAL_FORMULA_SHADOW_RUN_45089678156.json \
            --out "$OUT"
          python - "$OUT" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding="utf-8"))
          assert j["original_october_strict_matched_history"]==356
          assert j["historical_kickoff_conflicts_still_quarantined"]==2
          assert j["input_count"]==2
          assert all(x["structural_readiness"]=="READY_FOR_EXPERIMENTAL_EVALUATION" for x in j["inputs"])
          assert j["original_enriched_feature_equivalence_certified"] is False
          assert j["production_p_matrix_authorized"] is False
          assert j["telegram_signal_authorized"] is False
          print("COLOMBIA_239_TWO_AUTHENTIC_EXPERIMENTAL_CANONICAL_PIT_INPUTS_NOT_PRODUCTION")
          PY
      - name: Persist structural intake without modifying existing canonical model
        shell: bash
        run: |
          set -euo pipefail
          P="evidence/football_world_inventory/2026-11-24/MATRIX_COL_239_EXPERIMENTAL_CANONICAL_INPUT_RUN_${{ github.run_id }}.json"
          git config user.name matrix-colombia-canonical-research
          git config user.email matrix-colombia-canonical-research@users.noreply.github.com
          git add --sparse -- "$P"
          git commit -m "evidence(colombia): two authentic ESPN source canonical experimental inputs; unmodified model"
          for n in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep "$n"
          done
          exit 1
