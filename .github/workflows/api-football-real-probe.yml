name: API-Football governed real connectivity probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-real-probe.yml

permissions:
  contents: write

concurrency:
  group: api-football-governed-real-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: python -m pip install requests python-dotenv pytest

      - name: Require configured API-Football secret
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${API_FOOTBALL_KEY}" ]]; then
            echo "API_FOOTBALL_KEY_NOT_CONFIGURED"
            exit 2
          fi
          python - <<'PY'
          import os
          value = os.environ["API_FOOTBALL_KEY"]
          try:
              value.encode("ascii")
          except UnicodeEncodeError:
              raise SystemExit("API_FOOTBALL_KEY_MUST_BE_ASCII")
          print("API_FOOTBALL_KEY_PRESENT_AND_ASCII")
          PY

      - name: Execute one bounded real provider call
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MATRIX_API_FOOTBALL_PROBE_DIR: evidence/api_football/real_probe
        run: |
          set -euo pipefail
          rm -rf "$MATRIX_API_FOOTBALL_PROBE_DIR"
          python -m tools.api_football_real_probe

      - name: Verify extended market coverage probe regression
        run: python -m pytest -q tests/test_api_football_extended_market_coverage_probe.py

      - name: Execute extended market physical coverage probe
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MATRIX_API_FOOTBALL_EXTENDED_FIXTURE_IDS: "1490463,1637268,1549712,1549719,1520890,1520900,1520908,1528904"
        run: |
          set -euo pipefail
          rm -rf evidence/api_football/market_expansion/coverage_probe
          python -m tools.api_football_extended_market_coverage_probe

      - name: Enforce extended market source evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/api_football/market_expansion/coverage_probe/manifest.json").read_text())
          assert p["status"]=="PASS"
          assert p["sampled_fixture_count"]>0
          assert p["network_calls"]==p["sampled_fixture_count"]*2
          assert p["outcomes_used_for_model_tuning"] is False
          assert p["odds_used_to_generate_probability"] is False
          assert p["p_matrix_status"]=="NOT_GENERATED_FOR_EXTENDED_MARKETS"
          assert p["automatic_wagering"] is False
          assert p["real_money"]=="BLOCKED"
          print("MATRIX_EXTENDED_MARKET_SOURCE_COVERAGE_GATE: PASS")
          PY

      - name: Persist physical probe evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-api-football-probe"
          git config user.email "matrix-api-football-probe@users.noreply.github.com"
          git add evidence/api_football/real_probe evidence/api_football/market_expansion/coverage_probe
          if git diff --cached --quiet; then
            echo "NO_PROBE_EVIDENCE_TO_PERSIST"
            exit 3
          fi
          git commit -m "evidence(api-football): persist governed real connectivity probe"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline

      - name: Enforce verified provider response
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("evidence/api_football/real_probe/probe_manifest.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload.get("provider") == "api_football"
          assert payload.get("endpoint") == "/countries"
          assert payload.get("network_call_performed") is True
          assert payload.get("provider_response_received") is True
          assert payload.get("verified_successful_provider_response") is True
          assert payload.get("raw_response_persisted") is True
          assert payload.get("status") == "PASS"
          assert payload.get("automatic_wagering") is False
          assert payload.get("real_money") == "BLOCKED"
          print("API_FOOTBALL_REAL_USAGE_GATE: PASS")
          PY
