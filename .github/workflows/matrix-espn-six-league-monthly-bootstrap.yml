name: MATRIX ESPN Six League Monthly History Bootstrap
on:
  workflow_dispatch:
    inputs:
      month:
        description: "Historical month YYYY-MM for research-only raw capture"
        required: true
        default: "2026-10"
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/matrix_football_espn_six_league_raw_capture.py
      - tests/test_matrix_football_espn_six_league_raw_capture.py
      - .github/workflows/matrix-espn-six-league-monthly-bootstrap.yml
permissions:
  contents: read
jobs:
  monthly-history:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/matrix_football_espn_enriched_pit_research.py
            tools/matrix_football_espn_six_league_raw_capture.py
            tests/test_matrix_football_espn_enriched_pit_research.py
            tests/test_matrix_football_espn_six_league_raw_capture.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Test monthly archive and integrity before source queries
        run: PYTHONPATH=. python -m pytest -q tests/test_matrix_football_espn_enriched_pit_research.py tests/test_matrix_football_espn_six_league_raw_capture.py
      - name: Collect six source-native October history responses
        env:
          REQUESTED_MONTH: ${{ github.event.inputs.month || '2026-10' }}
        run: PYTHONPATH=. python -m tools.matrix_football_espn_six_league_raw_capture --month "$REQUESTED_MONTH" --out evidence/research/football_six_league_espn_monthly
      - name: Verify source bytes and research-only governance
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path("evidence/research/football_six_league_espn_monthly")
          d=json.loads((p/"MATRIX_ESPN_SIX_LEAGUE_RAW_RESEARCH_LAST.json").read_bytes())
          assert d["query_kind"]=="MONTH"
          assert d["source_league_scope"]==6
          assert d["source_captured_leagues"]==6, "Source did not capture all six leagues"
          assert d["backfilled_monthly_results_are_not_prospective_predictions"] is True
          assert d["production_p_matrix_authorized"] is False
          assert d["telegram_signal_authorized"] is False
          assert d["real_money"]=="BLOCKED"
          for lid,source in d["sources"].items():
              assert source["status"]=="PROVIDER_BYTES_AUTHENTICALLY_CAPTURED_RESEARCH_ONLY",lid
              raw=(p/source["raw_archive_file"]).read_bytes()
              assert len(raw)==source["raw_bytes"]
              assert hashlib.sha256(raw).hexdigest()==source["raw_sha256"]
              assert source["history"]["production_p_matrix_authorized"] is False
          print(json.dumps({"raw_verified_six_leagues":6,
                            "historical_rows":sum(x["provider_final_history_count"] for x in d["sources"].values()),
                            "monthly_backfill_not_predictions":True,
                            "telegram_signals":False},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-espn-six-league-monthly-raw-research
          path: evidence/research/football_six_league_espn_monthly/
          if-no-files-found: warn
          retention-days: 30
