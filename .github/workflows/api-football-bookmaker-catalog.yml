name: API-Football bookmaker catalog audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-football-bookmaker-catalog-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install requests

      - name: Probe bookmaker catalog
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          rm -rf evidence/api_football/bookmakers
          python -m tools.api_football_bookmaker_catalog_probe

      - name: Enforce audit gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("evidence/api_football/bookmakers/manifest.json").read_text(encoding="utf-8"))
          assert p["status"] == "PASS"
          assert p["network_calls_performed"] == 1
          assert p["real_money"] == "BLOCKED"
          assert isinstance(p["pinnacle_found"], bool)
          print("API_FOOTBALL_BOOKMAKER_CATALOG_GATE: PASS")
          print("provider_rows=", p["provider_rows"])
          print("pinnacle_found=", p["pinnacle_found"])
          print("pinnacle_matches=", p["pinnacle_matches"])
          print("daily_remaining=", p["rate_limit"]["daily_remaining"])
          PY

      - name: Persist evidence
        run: |
          set -euo pipefail
          git config user.name "matrix-api-football-bookmaker-audit"
          git config user.email "matrix-api-football-bookmaker-audit@users.noreply.github.com"
          git add evidence/api_football/bookmakers
          if git diff --cached --quiet; then
            echo "NO_BOOKMAKER_EVIDENCE_TO_PERSIST"
            exit 3
          fi
          git commit -m "evidence(api-football): persist bookmaker catalog audit"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
