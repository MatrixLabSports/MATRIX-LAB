name: API-Football Team Total Shots Side Models

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-team-total-shots-side-models.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-football-team-total-shots-side-models
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Verify side-model protections
        run: python -m pytest -q tests/test_api_football_team_total_shots_side_models.py

      - name: Build Home Away challengers
        run: python -m tools.api_football_team_total_shots_side_models

      - name: Enforce governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("evidence/api_football/market_expansion/team_total_shots_side_models")
          for side,bet in (("home",221),("away",220)):
              p=json.loads((root/f"{side}_model.json").read_text())
              assert p["market_binding"]["api_football_bet_id"]==bet
              assert p["bookmaker_scope_alignment_certified"] is True
              assert p["internal_selection"]["final_validation_used_for_selection"] is False
              assert p["validation_used_for_parameter_tuning"] is False
              assert p["odds_used_to_generate_probability"] is False
              assert p["automatic_wagering"] is False
              assert p["real_money"]=="BLOCKED"
          print("TEAM_TOTAL_SHOTS_SIDE_GOVERNANCE: PASS")
          PY

      - name: Persist evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-shots-side"
          git config user.email "matrix-football-shots-side@users.noreply.github.com"
          git add evidence/api_football/market_expansion/team_total_shots_side_models
          git commit -m "evidence(football): persist Home Away team total shots OOS"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline

