name: MATRIX Independent Sources Offline Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
      MATRIX_INDEPENDENT_SOURCE_READINESS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install pytest requests pillow
      - name: Verify expiry governance and independent source diagnostics
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q tests/test_football_subscription_deadline_guard.py tests/test_independent_source_readiness_truth.py
          PYTHONPATH=. python -m tools.football_subscription_deadline_guard --independent-source-readiness
          PYTHONPATH=. python -m tools.telegram_green_signal_alerts
          test "$REAL_MONEY" = BLOCKED
          test "$AUTO_BETTING" = DISABLED
