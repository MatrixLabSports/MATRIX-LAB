name: API-Football extended market historical expand

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-extended-market-historical-expand.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-football-extended-market-historical-expand
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests pytest

      - name: Run bootstrap regression tests
        run: python -m pytest -q tests/test_api_football_extended_market_historical_bootstrap.py

      - name: Require API-Football credential
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${API_FOOTBALL_KEY:-}" ]]; then
            echo "API_FOOTBALL_KEY_NOT_CONFIGURED"
            exit 2
          fi

      - name: Expand stats-rich historical development dataset
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MATRIX_EXTENDED_BOOTSTRAP_OUTPUT_DIR: evidence/api_football/market_expansion/historical_statsrich
          MATRIX_EXTENDED_BOOTSTRAP_MAX_FIXTURES: "200"
          MATRIX_EXTENDED_BOOTSTRAP_ALLOWED_LEAGUES: "72,252"
          MATRIX_EXTENDED_BOOTSTRAP_EXCLUDE_DATASETS: evidence/api_football/market_expansion/historical_bootstrap/normalized_dataset.jsonl
          MATRIX_API_FOOTBALL_DAILY_RESERVE: "5000"
        run: |
          set -euo pipefail
          rm -rf evidence/api_football/market_expansion/historical_statsrich
          python -m tools.api_football_extended_market_historical_bootstrap

      - name: Enforce directed bootstrap governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/api_football/market_expansion/historical_statsrich/manifest.json").read_text())
          assert p["status"]=="PASS"
          assert p["protected_final_holdout_count"]==357
          assert p["protected_holdout_intersection_count"]==0
          assert p["prospective_intersection_count"]==0
          assert p["allowed_leagues"]==["252","72"] or p["allowed_leagues"]==["72","252"]
          assert p["prior_dataset_exclusion_count"]>0
          assert p["outcomes_used_for_prospective_claims"] is False
          assert p["metrics_opened"] is False
          assert p["real_money"]=="BLOCKED"
          print("MATRIX_EXTENDED_STATSRICH_BOOTSTRAP_GATE: PASS")
          PY

      - name: Persist stats-rich historical evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-market-bootstrap"
          git config user.email "matrix-football-market-bootstrap@users.noreply.github.com"
          git add evidence/api_football/market_expansion/historical_statsrich
          if git diff --cached --quiet; then
            echo "NO_STATSRICH_EVIDENCE_TO_PERSIST"
            exit 3
          fi
          git commit -m "evidence(football): persist stats-rich extended market history"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
