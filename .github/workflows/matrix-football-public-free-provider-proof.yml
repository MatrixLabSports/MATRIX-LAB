name: MATRIX Football Public Free TheSportsDB One-Call Proof

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/matrix-football-public-free-provider-proof.yml
      - tools/matrix_football_public_free_probe.py
      - tests/test_matrix_football_public_free_probe.py

permissions:
  contents: write

concurrency:
  group: matrix-football-public-free-provider-proof
  cancel-in-progress: false

jobs:
  one-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REAL_MONEY: BLOCKED
      AUTOMATIC_WAGERING: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify false-positive and denied-access contracts
        run: |
          python -m pip install -q pytest
          PYTHONPATH=. python -m pytest -q tests/test_matrix_football_public_free_probe.py
      - name: Read one public soccer calendar page for Bogotá date
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = BLOCKED
          DAY="$(TZ=America/Bogota date +%F)"
          python -m tools.matrix_football_public_free_probe --date "$DAY" --allow-one-public-call
      - name: Validate receipt remains research only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/governance/MATRIX_FOOTBALL_PUBLIC_FREE_PROBE_LAST.json").read_text(encoding="utf-8"))
          assert d["schema"]=="MATRIX_FOOTBALL_PUBLIC_FREE_PROBE_V2"
          assert d["network_calls"]==1
          assert d["canonical_candidate_generation_authorized"] is False
          assert d["signal_generation_authorized"] is False
          assert d["real_money"]=="BLOCKED"
          assert d["automatic_wagering"] is False
          print("THESPORTSDB_AUTHENTIC_SOURCE_RESULT",d["status"],d["current_day_fixture_ids_verified"])
          PY
      - name: Persist authentic source receipt even when provider data unavailable
        run: |
          set -euo pipefail
          git config user.name "matrix-public-free-source"
          git config user.email "matrix-public-free-source@users.noreply.github.com"
          git add -- evidence/governance/MATRIX_FOOTBALL_PUBLIC_FREE_PROBE_LAST.json
          if git diff --cached --quiet; then
            echo NO_NEW_PUBLIC_SOURCE_EVIDENCE
            exit 0
          fi
          git commit -m "evidence(football): persist public TheSportsDB source result no model admission"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then
              echo THESPORTSDB_PUBLIC_SOURCE_RECEIPT_PERSISTED
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1
