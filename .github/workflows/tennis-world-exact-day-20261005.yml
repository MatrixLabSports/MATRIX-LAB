name: Tennis World Exact Day 2026-10-05

on:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/tennis-world-exact-day-20261005.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cor0203-holdout-repair-cor09-world-pipeline
  cancel-in-progress: false

jobs:
  exact-day-and-calibration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Verify exact-day and governed discovery protections
        run: |
          python -m pytest -q \
            tests/test_tennis_world_inventory_rapidapi.py \
            tests/test_cor0203_world_inventory_discovery.py \
            tests/test_cor0203_preregister_discovery.py \
            tests/test_cor0203_physical_uniqueness.py

      - name: Record latest physical checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin repair/cor09-world-pipeline
          git checkout repair/cor09-world-pipeline
          git reset --hard origin/repair/cor09-world-pipeline
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          echo "CHECKOUT_SHA=$CHECKOUT_SHA" >> "$GITHUB_ENV"
          echo "Latest physical operational SHA: $CHECKOUT_SHA"

      - name: Build dual paid-source exact-day inventory for 2026-10-05
        shell: bash
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
        run: |
          set -euo pipefail
          python -m tools.tennis_world_exact_day_dual_audit \
            --target-date-bogota 2026-10-05 \
            --out evidence/tennis_world_inventory/2026-10-05/world_exact_day_dual_audit.json

      - name: Run governed 2026-10-05 calibration production
        shell: bash
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
          MATRIX_TENNIS_PROVIDER: rapidapi_tennis
          MATRIX_WORLD_DATE_BOGOTA: "2026-10-05"
          MATRIX_TARGET_BRANCH: repair/cor09-world-pipeline
          MATRIX_GIT_USER_NAME: matrix-ci
          MATRIX_GIT_USER_EMAIL: matrix-ci@users.noreply.github.com
        run: |
          set -euo pipefail
          bash scripts/cor0203_production_cycle.sh --trigger-sha "$CHECKOUT_SHA"

      - name: Reconcile SofaScore Fajing Sun Aoran Wang through governed cut
        shell: bash
        env:
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
        run: |
          set -euo pipefail
          SOURCE="evidence/cor0203/source_readiness/sofascore/2026-10-05/MATRIX_SOFASCORE_WUNING3_FAJING_SUN_AORAN_WANG_20261005.json"
          DISCOVERY="evidence/cor0203/runtime/MATRIX_COR0203_SOFASCORE_DISCOVERY_20261005.json"
          OVERLAY="evidence/cor0203/identity/MATRIX_COR0203_SOFASCORE_IDENTITY_AUTHORITY_20261005.json"
          VERIFY="evidence/cor0203/runtime/MATRIX_COR0203_SOFASCORE_BRIDGE_VERIFICATION_20261005.json"
          PREREG="evidence/cor0203/runtime/MATRIX_COR0203_SOFASCORE_PREREG_LAST.json"
          BASE_AUTH="evidence/cor0203/identity/MATRIX_COR0203_IDENTITY_AUTHORITY_LAST.json"
          STATIC="evidence/cor0203/runtime/MATRIX_COR0203_STATIC_CUT_20260921.json"
          CROSSWALK="evidence/cor0203/runtime/MATRIX_COR0203_IDENTITY_CROSSWALK_LAST.json"
          STAGE="evidence/cor0203/runtime/MATRIX_COR0203_AUTO_STAGE_LAST.json"
          RUNNER="evidence/cor0203/runtime/MATRIX_COR0203_BATCH_RUNNER_LAST.json"
          INTEGRITY="evidence/cor0203/runtime/MATRIX_COR0203_HOLDOUT_INTEGRITY_LAST.json"
          UNIQUE="evidence/cor0203/runtime/MATRIX_COR0203_PHYSICAL_UNIQUENESS_LAST.json"
          MILESTONE="evidence/cor0203/runtime/MATRIX_COR0203_MILESTONES_LAST.json"

          python -m tools.cor0203_sofascore_browser_bridge \
            --source-snapshot "$SOURCE" \
            --ranking-override evidence/cor0203/source_readiness/public_rankings/2026-09-21/MATRIX_AORAN_WANG_EXACT_CUT_RANKING_20260921.json \
            --out-discovery "$DISCOVERY" \
            --out-authority "$OVERLAY" \
            --out-verification "$VERIFY"

          python -m tools.cor0203_preregister_discovery \
            --discovery "$DISCOVERY" \
            --result-out "$PREREG"

          python -m tools.cor0203_merge_identity_authority \
            --base "$BASE_AUTH" \
            --overlay "$OVERLAY" \
            --out /tmp/MATRIX_COR0203_IDENTITY_AUTHORITY_MERGED.json
          cp /tmp/MATRIX_COR0203_IDENTITY_AUTHORITY_MERGED.json "$BASE_AUTH"

          python -m tools.cor0203_build_identity_crosswalk \
            --static-cut "$STATIC" \
            --identity-authority "$BASE_AUTH" \
            --summary-out "$CROSSWALK"

          python -m tools.cor0203_stage_from_registry \
            --summary-out "$STAGE"

          RECOVERY_TRIGGER_SHA="$(git rev-parse HEAD)"
          python -m tools.cor0203_batch_runner \
            --state-b64 evidence/cor0203/runtime/MATRIX_COR0203_PRE2026_STATE_R706.json.gz.b64 \
            --bundle evidence/cor0203/runtime/MATRIX_COR0203_ELO_GLICKO_PROSPECTIVE_BUNDLE_R706.json \
            --annual-2026 evidence/cor0203/preholdout/2026_challenger_live_snapshot.csv \
            --trigger-sha "$RECOVERY_TRIGGER_SHA" \
            --summary-out "$RUNNER"

          python -m tools.cor0203_holdout_integrity_audit \
            --out "$INTEGRITY"

          python -m tools.cor0203_physical_uniqueness_audit \
            --integrity "$INTEGRITY" \
            --out "$UNIQUE"

          python -m tools.cor0203_milestone_status \
            --uniqueness "$UNIQUE" \
            --out "$MILESTONE"

          python - <<'PY'
          import json
          from pathlib import Path
          u=json.loads(Path("evidence/cor0203/runtime/MATRIX_COR0203_PHYSICAL_UNIQUENESS_LAST.json").read_text())
          v=json.loads(Path("evidence/cor0203/runtime/MATRIX_COR0203_SOFASCORE_BRIDGE_VERIFICATION_20261005.json").read_text())
          assert v["integrity_result"]=="PASS"
          assert u["result"]=="PASS"
          assert u["metrics_opened"] is False
          assert u["outcomes_read"]==0
          print(json.dumps({
              "unique_calibration_observations":u["unique_calibration_observations"],
              "remaining_to_200":u["unique_remaining_to_200"],
              "remaining_to_600":u["unique_remaining_to_600"],
              "sofascore_bridge":v["integrity_result"],
              "real_money":"BLOCKED"
          },sort_keys=True))
          PY

          git config user.name 'matrix-ci'
          git config user.email 'matrix-ci@users.noreply.github.com'
          git add evidence/cor0203/runtime/MATRIX_COR0203_SOFASCORE_*.json
          git add evidence/cor0203/identity/MATRIX_COR0203_SOFASCORE_IDENTITY_AUTHORITY_20261005.json
          git add evidence/cor0203/identity/MATRIX_COR0203_IDENTITY_AUTHORITY_LAST.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_IDENTITY_CROSSWALK*.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_STATIC4_R*.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_PROSPECTIVE_EVENTS_R*.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_STAGE_BLOCKERS_R*.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_AUTO_STAGE_LAST.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_BATCH_RUNNER_LAST.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_HOLDOUT_INTEGRITY_LAST.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_PHYSICAL_UNIQUENESS_LAST.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_MILESTONES_LAST.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_PREFEATURE_REGISTRY_R*.json
          git add evidence/cor0203/holdout/MATRIX_COR0203_HOLDOUT_BATCH_R*.json
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(cor02-03): govern SofaScore Fajing Aoran candidate'
            git push origin HEAD:repair/cor09-world-pipeline
          fi

      - name: Reconcile SofaScore Holmgren Pedro Martinez through governed cut
        shell: bash
        env:
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
        run: |
          set -euo pipefail
          SOURCE="evidence/cor0203/source_readiness/sofascore/2026-10-06/MATRIX_SOFASCORE_ALICANTE_HOLMGREN_MARTINEZ_20261006.json"
          DISCOVERY="evidence/cor0203/runtime/MATRIX_COR0203_SOFASCORE_DISCOVERY_HOLMGREN_MARTINEZ_20261006.json"
          OVERLAY="evidence/cor0203/identity/MATRIX_COR0203_SOFASCORE_IDENTITY_AUTHORITY_HOLMGREN_MARTINEZ_20261006.json"
          VERIFY="evidence/cor0203/runtime/MATRIX_COR0203_SOFASCORE_BRIDGE_VERIFICATION_HOLMGREN_MARTINEZ_20261006.json"
          PREREG="evidence/cor0203/runtime/MATRIX_COR0203_SOFASCORE_PREREG_HOLMGREN_MARTINEZ_20261006.json"
          BASE_AUTH="evidence/cor0203/identity/MATRIX_COR0203_IDENTITY_AUTHORITY_LAST.json"
          STATIC="evidence/cor0203/runtime/MATRIX_COR0203_STATIC_CUT_20260921.json"
          CROSSWALK="evidence/cor0203/runtime/MATRIX_COR0203_IDENTITY_CROSSWALK_LAST.json"
          STAGE="evidence/cor0203/runtime/MATRIX_COR0203_AUTO_STAGE_LAST.json"
          RUNNER="evidence/cor0203/runtime/MATRIX_COR0203_BATCH_RUNNER_LAST.json"
          INTEGRITY="evidence/cor0203/runtime/MATRIX_COR0203_HOLDOUT_INTEGRITY_LAST.json"
          UNIQUE="evidence/cor0203/runtime/MATRIX_COR0203_PHYSICAL_UNIQUENESS_LAST.json"
          MILESTONE="evidence/cor0203/runtime/MATRIX_COR0203_MILESTONES_LAST.json"

          python -m tools.cor0203_sofascore_browser_bridge             --source-snapshot "$SOURCE"             --static-cut "$STATIC"             --out-discovery "$DISCOVERY"             --out-authority "$OVERLAY"             --out-verification "$VERIFY"

          python -m tools.cor0203_preregister_discovery             --discovery "$DISCOVERY"             --result-out "$PREREG"

          python -m tools.cor0203_merge_identity_authority             --base "$BASE_AUTH"             --overlay "$OVERLAY"             --out /tmp/MATRIX_COR0203_IDENTITY_AUTHORITY_MERGED_HM.json
          cp /tmp/MATRIX_COR0203_IDENTITY_AUTHORITY_MERGED_HM.json "$BASE_AUTH"

          python -m tools.cor0203_build_identity_crosswalk             --static-cut "$STATIC"             --identity-authority "$BASE_AUTH"             --summary-out "$CROSSWALK"

          python -m tools.cor0203_stage_from_registry             --summary-out "$STAGE"

          RECOVERY_TRIGGER_SHA="$(git rev-parse HEAD)"
          python -m tools.cor0203_batch_runner             --state-b64 evidence/cor0203/runtime/MATRIX_COR0203_PRE2026_STATE_R706.json.gz.b64             --bundle evidence/cor0203/runtime/MATRIX_COR0203_ELO_GLICKO_PROSPECTIVE_BUNDLE_R706.json             --annual-2026 evidence/cor0203/preholdout/2026_challenger_live_snapshot.csv             --trigger-sha "$RECOVERY_TRIGGER_SHA"             --summary-out "$RUNNER"

          python -m tools.cor0203_holdout_integrity_audit             --out "$INTEGRITY"

          python -m tools.cor0203_physical_uniqueness_audit             --integrity "$INTEGRITY"             --out "$UNIQUE"

          python -m tools.cor0203_milestone_status             --uniqueness "$UNIQUE"             --out "$MILESTONE"

          python - <<'PY'
          import json
          from pathlib import Path
          u=json.loads(Path("evidence/cor0203/runtime/MATRIX_COR0203_PHYSICAL_UNIQUENESS_LAST.json").read_text())
          v=json.loads(Path("evidence/cor0203/runtime/MATRIX_COR0203_SOFASCORE_BRIDGE_VERIFICATION_HOLMGREN_MARTINEZ_20261006.json").read_text())
          assert v["integrity_result"]=="PASS"
          assert u["result"]=="PASS"
          assert u["metrics_opened"] is False
          assert u["outcomes_read"]==0
          print(json.dumps({
              "unique_calibration_observations":u["unique_calibration_observations"],
              "remaining_to_200":u["unique_remaining_to_200"],
              "remaining_to_600":u["unique_remaining_to_600"],
              "sofascore_bridge":v["integrity_result"],
              "real_money":"BLOCKED"
          },sort_keys=True))
          PY

          git config user.name 'matrix-ci'
          git config user.email 'matrix-ci@users.noreply.github.com'
          git add evidence/cor0203/runtime/MATRIX_COR0203_SOFASCORE_*.json
          git add evidence/cor0203/identity/MATRIX_COR0203_SOFASCORE_IDENTITY_AUTHORITY_HOLMGREN_MARTINEZ_20261006.json
          git add evidence/cor0203/identity/MATRIX_COR0203_IDENTITY_AUTHORITY_LAST.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_IDENTITY_CROSSWALK*.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_STATIC4_R*.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_PROSPECTIVE_EVENTS_R*.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_STAGE_BLOCKERS_R*.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_AUTO_STAGE_LAST.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_BATCH_RUNNER_LAST.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_HOLDOUT_INTEGRITY_LAST.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_PHYSICAL_UNIQUENESS_LAST.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_MILESTONES_LAST.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_PREFEATURE_REGISTRY_R*.json
          git add evidence/cor0203/holdout/MATRIX_COR0203_HOLDOUT_BATCH_R*.json
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(cor02-03): govern SofaScore Holmgren Martinez candidate'
            git push origin HEAD:repair/cor09-world-pipeline
          fi

