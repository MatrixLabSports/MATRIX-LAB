name: MATRIX Team Total Physical Browser Capture

on:
  workflow_dispatch:
  schedule:
    - cron: "6,21,36,51 * * * *"
  push:
    branches:
      - main
      - repair/cor09-world-pipeline
    paths:
      - ".github/workflows/matrix-team-total-physical-capture.yml"
      - "tools/physical_team_total_browser_capture.py"
      - "tests/test_physical_team_total_browser_capture.py"
      - "evidence/browser_capture_inbox/team_total/**"

permissions:
  contents: write

concurrency:
  group: matrix-team-total-physical-capture
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED

    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Prove capture bridge contract
        shell: bash
        run: |
          set -euo pipefail
          test "$MATRIX_MODE" = "SHADOW"
          test "$REAL_MONEY" = "BLOCKED"
          test "$AUTO_BETTING" = "DISABLED"
          PYTHONPATH=. python -m pytest -q tests/test_physical_team_total_browser_capture.py

      - name: Normalize physical Team Total captures
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.physical_team_total_browser_capture
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/browser_capture_inbox/MATRIX_TEAM_TOTAL_PHYSICAL_CAPTURE_BRIDGE_LAST.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["status"]=="PASS"
          assert j["protections"]["automatic_wagering"] is False
          assert j["protections"]["real_money"]=="BLOCKED"
          assert j["protections"]["probability_from_odds"] is False
          assert j["protections"]["post_kickoff_forbidden"] is True
          assert j["source_contract"]["schema"]=="MATRIX_BROWSER_TEAM_TOTAL_CAPTURE_V1"
          print(json.dumps({
              "input_count":j["input_count"],
              "accepted_count":j["accepted_count"],
              "rejected_count":j["rejected_count"],
              "duplicate_identical_count":j["duplicate_identical_count"],
          },sort_keys=True))
          PY

      - name: Persist physical Team Total bridge evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-team-total-physical-capture"
          git config user.email "matrix-team-total-physical-capture@users.noreply.github.com"
          git add             evidence/browser_capture_inbox/MATRIX_TEAM_TOTAL_PHYSICAL_CAPTURE_BRIDGE_LAST.json             evidence/football_world_inventory
          if git diff --cached --quiet; then
            echo "NO_TEAM_TOTAL_PHYSICAL_CAPTURE_CHANGE"
            exit 0
          fi
          git commit -m "evidence(telegram): persist Team Total physical capture bridge"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then
              exit 0
            fi
            sleep $((attempt*2))
          done
          exit 1
