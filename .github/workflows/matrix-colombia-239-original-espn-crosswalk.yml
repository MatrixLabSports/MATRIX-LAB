name: MATRIX Colombia 239 Original ESPN Historic Identity Crosswalk
on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/matrix-colombia-239-original-espn-crosswalk.yml
      - tools/matrix_colombia_239_original_espn_historic_crosswalk.py
      - tests/test_matrix_colombia_239_original_espn_historic_crosswalk.py
      - tools/matrix_colombia_239_prospective_espn_bridge.py
      - tests/test_matrix_colombia_239_prospective_espn_bridge.py
permissions:
  contents: write
concurrency:
  group: matrix-colombia-original-espn-crosswalk
  cancel-in-progress: false
jobs:
  original-espn-colombia:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REAL_MONEY: BLOCKED
      AUTOMATIC_WAGERING: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/matrix_colombia_239_original_espn_historic_crosswalk.py
            tests/test_matrix_colombia_239_original_espn_historic_crosswalk.py
            tools/matrix_colombia_239_prospective_espn_bridge.py
            tests/test_matrix_colombia_239_prospective_espn_bridge.py
            evidence/api_football/prospective_daily/2026-10-28/20261028T054128Z/history/raw/league_239_season_2026.bin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test identity and outcome mismatch fail-close contracts
        run: |
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=. python -m pytest -q tests/test_matrix_colombia_239_original_espn_historic_crosswalk.py tests/test_matrix_colombia_239_prospective_espn_bridge.py
      - name: Compare two authentic historical Colombia matches against public ESPN source
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = BLOCKED
          test "$AUTOMATIC_WAGERING" = false
          OUT="evidence/football_world_inventory/2026-11-22/MATRIX_COLOMBIA_239_HISTORIC_CROSSWALK_RUN_${{ github.run_id }}.json"
          RAW="evidence/football_world_inventory/2026-11-22/sources/espn_col_1_historic_20261027_run_${{ github.run_id }}.json"
          PYTHONPATH=. python -m tools.matrix_colombia_239_original_espn_historic_crosswalk --out "$OUT" --raw-out "$RAW"
          python - "$OUT" "$RAW" <<'PY'
          import json,sys,hashlib
          from pathlib import Path
          o=json.loads(Path(sys.argv[1]).read_bytes())
          assert hashlib.sha256(Path(sys.argv[2]).read_bytes()).hexdigest()==o["espn_response_sha256"]
          assert o["original_finished_history_rows"]==358
          assert o["exact_historical_fixture_pairs"]>=2,"NO_TWO_REAL_COLOMBIA_PAIRS"
          assert o["distinct_original_team_ids_crosswalked"]>=4,"NO_FOUR_REAL_TEAM_ID_CROSSWALK"
          assert o["production_p_matrix_authorized"] is False
          assert o["telegram_signal_authorized"] is False
          assert o["real_money"]=="BLOCKED"
          print("COLOMBIA_AUTHENTIC_CROSS_PROVIDER_HISTORIC_IDENTITY_PASS",
                o["exact_historical_fixture_pairs"],o["distinct_original_team_ids_crosswalked"])
          PY
      - name: Discover current Primera A fixtures linked through verified historical team IDs
        shell: bash
        run: |
          set -euo pipefail
          CROSSWALK="evidence/football_world_inventory/2026-11-22/MATRIX_COLOMBIA_239_HISTORIC_CROSSWALK_RUN_${{ github.run_id }}.json"
          REPORT="evidence/football_world_inventory/2026-11-22/MATRIX_COLOMBIA_239_FUTURE_BRIDGE_RUN_${{ github.run_id }}.json"
          RAWDIR="evidence/football_world_inventory/2026-11-22/sources"
          PYTHONPATH=. python -m tools.matrix_colombia_239_prospective_espn_bridge \
            --crosswalk "$CROSSWALK" --out "$REPORT" --raw-dir "$RAWDIR"
          python - "$REPORT" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_bytes())
          assert d["source_feature_parity_certified"] is False
          assert d["eligible_for_production"]==0
          assert d["production_p_matrix_authorized"] is False
          assert d["telegram_signal_authorized"] is False
          assert d["real_money"]=="BLOCKED"
          print("COLOMBIA_UPCOMING_TEAM_ID_RESEARCH_ONLY",d["future_fixtures_with_historic_team_id_bridge"])
          PY
      - name: Persist raw ESPN response and crosswalk SHA to operative branch
        shell: bash
        run: |
          set -euo pipefail
          OUT="evidence/football_world_inventory/2026-11-22/MATRIX_COLOMBIA_239_HISTORIC_CROSSWALK_RUN_${{ github.run_id }}.json"
          RAW="evidence/football_world_inventory/2026-11-22/sources/espn_col_1_historic_20261027_run_${{ github.run_id }}.json"
          git config user.name matrix-colombia-crosswalk
          git config user.email matrix-colombia-crosswalk@users.noreply.github.com
          git add --sparse -- "$OUT" "$RAW"
          FUTURE="evidence/football_world_inventory/2026-11-22/MATRIX_COLOMBIA_239_FUTURE_BRIDGE_RUN_${{ github.run_id }}.json"
          git add --sparse -- "$FUTURE"
          git add --sparse -- evidence/football_world_inventory/2026-11-22/sources/ESPN_col_1_202611*.json
          git commit -m "evidence(colombia): immutable October original ESPN fixture and team ID historical crosswalk"
          for n in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep "$n"
          done
          exit 1
