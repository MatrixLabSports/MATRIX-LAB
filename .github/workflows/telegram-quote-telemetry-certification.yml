name: MATRIX Telegram Immutable Quote Telemetry Certification

on:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/telegram-quote-telemetry-certification.yml
      - tools/telegram_quote_attempt_telemetry.py
      - tools/telegram_quote_attempt_telemetry_audit.py
      - tests/test_telegram_quote_attempt_telemetry.py
      - tests/test_telegram_quote_attempt_telemetry_audit.py
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Telegram Señales Verdes MATRIX"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: telegram-quote-telemetry-certification
  cancel-in-progress: true

jobs:
  certify:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - name: Checkout immutable telemetry scope
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 1
          sparse-checkout: |
            tools/__init__.py
            tools/telegram_quote_attempt_telemetry.py
            tools/telegram_quote_attempt_telemetry_audit.py
            tests/test_telegram_quote_attempt_telemetry.py
            tests/test_telegram_quote_attempt_telemetry_audit.py
            evidence/notifications/telegram/MATRIX_TELEGRAM_QUOTE_ATTEMPTS.jsonl
            evidence/notifications/telegram/MATRIX_TELEGRAM_QUOTE_ATTEMPT_TELEMETRY_AUDIT_LAST.json
            evidence/notifications/telegram/MATRIX_TELEGRAM_QUOTE_TELEMETRY_CERTIFICATION_LAST.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run immutable telemetry tests
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q \
            tests/test_telegram_quote_attempt_telemetry.py \
            tests/test_telegram_quote_attempt_telemetry_audit.py

      - name: Build and verify physical audit
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = "BLOCKED"
          test "$AUTO_BETTING" = "DISABLED"
          PYTHONPATH=. python -m tools.telegram_quote_attempt_telemetry_audit
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.telegram_quote_attempt_telemetry import load_verified

          ledger=Path("evidence/notifications/telegram/MATRIX_TELEGRAM_QUOTE_ATTEMPTS.jsonl")
          audit_path=Path("evidence/notifications/telegram/MATRIX_TELEGRAM_QUOTE_ATTEMPT_TELEMETRY_AUDIT_LAST.json")
          cert_path=Path("evidence/notifications/telegram/MATRIX_TELEGRAM_QUOTE_TELEMETRY_CERTIFICATION_LAST.json")

          rows=load_verified(ledger)
          audit=json.loads(audit_path.read_text(encoding="utf-8"))
          cert=json.loads(cert_path.read_text(encoding="utf-8"))

          assert audit["status"]=="PASS"
          assert audit["immutable_hash_chain_verified"] is True
          assert audit["first_terminal_state_independent"] is True
          assert audit["schema_evolution"]["current_schema"]=="MATRIX_TELEGRAM_QUOTE_ATTEMPT_V3"
          assert "MATRIX_TELEGRAM_QUOTE_ATTEMPT_V1" in audit["schema_evolution"]["legacy_schemas_preserved_without_rewrite"]
          assert audit["schema_evolution"]["mixed_version_hash_chain_supported"] is True
          assert audit["schema_evolution"]["historical_rows_rewritten"] is False
          assert audit["required_field_contract"]["all_rows_schema_validated"] is True
          assert "provider_event_id" in audit["required_field_contract"]["identity_fields"]
          assert "run_token" in audit["required_field_contract"]["top_level_fields"]
          assert audit["reporting_scope_contract"]["LIVE_THIS_RUN"]["historical_terminal_states_included"] is False
          assert audit["reporting_scope_contract"]["TERMINAL_HISTORICAL"]["may_not_overwrite_immutable_attempt_rows"] is True
          assert audit["reporting_scope_contract"]["legacy_combined_counts_must_not_be_interpreted_as_live_coverage"] is True
          assert audit["exact_line_policy"]["required_valid_execution_line"]==2.5
          assert audit["exact_line_policy"]["nearby_lines_never_substitute_for_2_5"] is True
          assert audit["protections"]["append_only"] is True
          assert audit["protections"]["automatic_wagering"] is False
          assert audit["protections"]["real_money"]=="BLOCKED"

          assert cert["schema"]=="MATRIX_TELEGRAM_QUOTE_TELEMETRY_CERTIFICATION_V3"
          assert cert["status"]=="PASS"
          assert cert["verified_row_count"]==len(rows)
          assert cert["real_quote_attempts_total"]==audit["sample"]["real_quote_attempts_total"]
          assert cert["remaining_to_minimum_50"]==audit["sample"]["remaining_to_minimum"]
          assert cert["immutable_hash_chain_verified"] is True
          assert cert["first_current_schema_row_present"] is True
          assert cert["first_current_schema_chain_bridge_verified"] is True
          assert cert["no_legacy_rows_after_first_v2"] is True
          assert cert["current_schema_real_row_count"]>=1
          assert cert["synthetic_rows_added"] is False
          assert cert["automatic_wagering"] is False
          assert cert["real_money"]=="BLOCKED"

          print(json.dumps({
              "status":"PASS",
              "schema":cert["schema"],
              "verified_row_count":cert["verified_row_count"],
              "current_schema_real_row_count":cert["current_schema_real_row_count"],
              "first_current_schema_chain_bridge_verified":cert["first_current_schema_chain_bridge_verified"],
              "real_quote_attempts_total":cert["real_quote_attempts_total"],
              "remaining_to_minimum_50":cert["remaining_to_minimum_50"],
              "real_money":cert["real_money"],
          },sort_keys=True))
          PY

      - name: Certification completed
        run: |
          set -euo pipefail
          test -f evidence/notifications/telegram/MATRIX_TELEGRAM_QUOTE_TELEMETRY_CERTIFICATION_LAST.json
          echo "IMMUTABLE_TELEMETRY_CERTIFICATION_RUN_PASS"
