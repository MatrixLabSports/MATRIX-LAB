name: ATP Challenger Clay Glicko Adjudication and Prospective Activation

on:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/tennis-clay-glicko-adjudication-activation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tennis-clay-glicko-adjudication-activation
  cancel-in-progress: false

jobs:
  adjudicate-and-activate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Capture protected Hard COR0203 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/clay-adjudication-guard
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def tree_hash(root):
              root=Path(root); h=hashlib.sha256(); n=0
              for p in sorted(x for x in root.rglob("*") if x.is_file()):
                  h.update(p.relative_to(root).as_posix().encode()); h.update(b"\0")
                  h.update(hashlib.sha256(p.read_bytes()).digest()); n+=1
              return h.hexdigest(),n
          tree,n=tree_hash("evidence/cor0203")
          uniq=json.loads(Path("evidence/cor0203/runtime/MATRIX_COR0203_PHYSICAL_UNIQUENESS_LAST.json").read_text())
          bind=json.loads(Path("evidence/cor0203/runtime/MATRIX_COR0203_MODEL_BINDING_R707.json").read_text())
          before={
            "tree_sha256":tree,
            "file_count":n,
            "unique":uniq["unique_calibration_observations"],
            "physical":uniq["physical_frozen_rows"],
            "duplicates":uniq["duplicate_observations_quarantined"],
            "remaining200":uniq["unique_remaining_to_200"],
            "metrics_opened":uniq["metrics_opened"],
            "outcomes_read":uniq["outcomes_read"],
            "integrity":uniq["result"],
            "holdout_id":bind["holdout_id"],
            "elo_sha256":bind["candidates"]["elo"]["sha256"],
            "glicko_sha256":bind["candidates"]["glicko"]["sha256"],
            "adjudication_sha256":bind["adjudication"]["sha256"]
          }
          Path("/tmp/clay-adjudication-guard/before.json").write_text(json.dumps(before,sort_keys=True))
          print(json.dumps(before,sort_keys=True))
          PY

      - name: Run Clay adjudication and isolation tests
        run: |
          python -m pytest -q             tests/test_tennis_clay_lane_bootstrap.py             tests/test_tennis_clay_glicko_adjudication.py             tests/test_tennis_parallel_lane_registry.py

      - name: Build Glicko candidate and sealed OOS adjudication
        run: |
          python -m tools.tennis_clay_glicko_adjudication             --out-root evidence/tennis_parallel_lanes/ATP_CHALLENGER_MEN_SINGLES_CLAY/adjudication

      - name: Activate independent Clay holdout only on PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path

          lane_root=Path("evidence/tennis_parallel_lanes/ATP_CHALLENGER_MEN_SINGLES_CLAY")
          adj_path=lane_root/"adjudication/model_adjudication_v1.json"
          adj=json.loads(adj_path.read_text())
          state_path=lane_root/"state.json"
          state=json.loads(state_path.read_text())
          reg_path=Path("config/tennis_model_lane_registry_v1.json")
          reg=json.loads(reg_path.read_text())
          clay=next(x for x in reg["lanes"] if x["lane_id"]=="ATP_CHALLENGER_MEN_SINGLES_CLAY")

          if adj["winner"] is None:
              assert not (lane_root/"prospective/holdout_contract.json").exists()
              state.update({
                "status":"RESEARCH_ONLY_HISTORICAL_OOS_NO_GO",
                "candidate_model_status":"NO_GO_BUILD_NEXT_CHALLENGER",
                "holdout_status":"NOT_CREATED_ADJUDICATION_NO_GO",
                "prospective_observations":0,
                "metrics_opened":False,
              })
              raw=json.dumps({k:v for k,v in state.items() if k!="sha256_without_self"},sort_keys=True,separators=(",",":")).encode()
              state["sha256_without_self"]=hashlib.sha256(raw).hexdigest()
              state_path.write_text(json.dumps(state,indent=2,sort_keys=True)+"\n")
              print("CLAY_ADJUDICATION_NO_GO")
          else:
              hp=lane_root/"prospective/holdout_contract.json"
              hs=lane_root/"prospective/state.json"
              holdout=json.loads(hp.read_text())
              pstate=json.loads(hs.read_text())
              assert holdout["current_observations"]==0
              assert holdout["metrics_opened"] is False
              assert holdout["outcomes_read"]==0
              assert pstate["observation_count"]==0
              assert pstate["unique_physical_event_count"]==0

              winner=adj["winner"]
              winner_file=(
                lane_root/"bootstrap/elo_candidate_v1.json"
                if winner=="ATP_CHALLENGER_CLAY_ELO_V1"
                else lane_root/"adjudication/glicko_candidate_v1.json"
              )
              winner_sha=hashlib.sha256(winner_file.read_bytes()).hexdigest()
              adj_sha=hashlib.sha256(adj_path.read_bytes()).hexdigest()

              state.update({
                "status":"ACTIVE_PROSPECTIVE_RESEARCH",
                "candidate_model_status":"PROMOTED_TO_PROSPECTIVE_RESEARCH_ONLY",
                "candidate_model_identity":winner,
                "candidate_model_sha256":winner_sha,
                "holdout_status":"ACTIVE_ZERO_OBSERVATIONS",
                "holdout_id":holdout["holdout_id"],
                "prospective_observations":0,
                "metrics_opened":False,
                "feeds_cor0203":False,
                "cor0203_holdout_reuse":False,
                "cor0203_observation_reuse":False,
                "automatic_model_promotion":False,
                "automatic_wagering":False,
                "real_money":"BLOCKED"
              })
              raw=json.dumps({k:v for k,v in state.items() if k!="sha256_without_self"},sort_keys=True,separators=(",",":")).encode()
              state["sha256_without_self"]=hashlib.sha256(raw).hexdigest()
              state_path.write_text(json.dumps(state,indent=2,sort_keys=True)+"\n")

              clay.update({
                "status":"ACTIVE_PROSPECTIVE_RESEARCH",
                "model_binding":{
                  "identity":winner,
                  "sha256":winner_sha,
                  "adjudication_sha256":adj_sha,
                  "scope":"PROSPECTIVE_RESEARCH_ONLY"
                },
                "holdout":{
                  "holdout_id":holdout["holdout_id"],
                  "windows":3,
                  "n_each":200,
                  "total":600,
                  "metrics":"SEALED_UNTIL_600",
                  "historical_backfill":"FORBIDDEN"
                },
                "feeds_cor0203":False,
                "can_reuse_cor0203_observations":False,
                "can_reuse_cor0203_holdout":False,
                "automatic_model_promotion":False,
                "automatic_wagering":False,
                "real_money":"BLOCKED"
              })
              reg["research_only_lane_count"]=34
              reg["active_prospective_lane_count"]=1
              reg_path.write_text(json.dumps(reg,indent=2,sort_keys=True)+"\n")
              print(json.dumps({
                "winner":winner,
                "winner_sha256":winner_sha,
                "holdout_id":holdout["holdout_id"],
                "observations":0
              },sort_keys=True))
          PY

      - name: Validate registry lifecycle after adjudication
        run: python -m tools.tennis_parallel_lane_registry --validate-only

      - name: Connect Clay lane to world calendar if holdout exists
        shell: bash
        run: |
          set -euo pipefail
          HP="evidence/tennis_parallel_lanes/ATP_CHALLENGER_MEN_SINGLES_CLAY/prospective/holdout_contract.json"
          if [ ! -f "$HP" ]; then
            echo "NO_HOLDOUT_NO_CALENDAR_ACTIVATION"
            exit 0
          fi
          python -m tools.tennis_clay_world_calendar_bridge             --world-inventory evidence/tennis/world_inventory/2026-10-07/MATRIX_TENNIS_WORLD_INVENTORY.json             --dual-audit evidence/tennis_world_inventory/2026-10-07/world_exact_day_dual_audit.json             --holdout-contract "$HP"             --bootstrap-manifest evidence/tennis_parallel_lanes/ATP_CHALLENGER_MEN_SINGLES_CLAY/bootstrap/bootstrap_manifest.json             --out evidence/tennis_parallel_lanes/ATP_CHALLENGER_MEN_SINGLES_CLAY/prospective/world_calendar_bridge_last.json

      - name: Validate Clay prospective seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          lane=Path("evidence/tennis_parallel_lanes/ATP_CHALLENGER_MEN_SINGLES_CLAY")
          adj=json.loads((lane/"adjudication/model_adjudication_v1.json").read_text())
          if adj["winner"] is None:
              assert not (lane/"prospective/holdout_contract.json").exists()
              print("CLAY_NO_GO_HOLDOUT_NOT_CREATED: PASS")
          else:
              h=json.loads((lane/"prospective/holdout_contract.json").read_text())
              s=json.loads((lane/"prospective/state.json").read_text())
              b=json.loads((lane/"prospective/world_calendar_bridge_last.json").read_text())
              assert h["holdout_id"]=="ATP_CHALLENGER_CLAY_PROSPECTIVE_V1"
              assert h["holdout_id"]!="A22_POST_AUDIT_VIRGIN_HOLDOUT_V1"
              assert h["current_observations"]==0
              assert h["metrics_opened"] is False
              assert h["outcomes_read"]==0
              assert s["observation_count"]==0
              assert s["metrics_opened"] is False
              assert b["prospective_counter_before"]==0
              assert b["prospective_counter_after"]==0
              assert b["freeze_ready_count"]==0
              assert b["protections"]["metrics_opened"] is False
              print("CLAY_INDEPENDENT_ZERO_HOLDOUT_AND_WORLD_BRIDGE: PASS")
          PY

      - name: Prove Hard 123/600 still byte-for-byte unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def tree_hash(root):
              root=Path(root); h=hashlib.sha256(); n=0
              for p in sorted(x for x in root.rglob("*") if x.is_file()):
                  h.update(p.relative_to(root).as_posix().encode()); h.update(b"\0")
                  h.update(hashlib.sha256(p.read_bytes()).digest()); n+=1
              return h.hexdigest(),n
          before=json.loads(Path("/tmp/clay-adjudication-guard/before.json").read_text())
          after,n=tree_hash("evidence/cor0203")
          assert after==before["tree_sha256"]
          assert n==before["file_count"]
          uniq=json.loads(Path("evidence/cor0203/runtime/MATRIX_COR0203_PHYSICAL_UNIQUENESS_LAST.json").read_text())
          bind=json.loads(Path("evidence/cor0203/runtime/MATRIX_COR0203_MODEL_BINDING_R707.json").read_text())
          assert uniq["unique_calibration_observations"]==before["unique"]==123
          assert uniq["physical_frozen_rows"]==before["physical"]
          assert uniq["duplicate_observations_quarantined"]==before["duplicates"]
          assert uniq["metrics_opened"] is False
          assert uniq["outcomes_read"]==0
          assert uniq["result"]=="PASS"
          assert bind["holdout_id"]=="A22_POST_AUDIT_VIRGIN_HOLDOUT_V1"
          assert bind["candidates"]["elo"]["sha256"]==before["elo_sha256"]
          assert bind["candidates"]["glicko"]["sha256"]==before["glicko_sha256"]
          assert bind["adjudication"]["sha256"]==before["adjudication_sha256"]
          print("HARD_COR0203_BYTE_FOR_BYTE_UNCHANGED: PASS")
          print("HARD_UNIQUE_OBSERVATIONS: 123")
          print("HARD_TREE_SHA256:",after)
          PY

      - name: Build final physical certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/tennis_world_model_expansion/2026-10-07
          python - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          lane=Path("evidence/tennis_parallel_lanes/ATP_CHALLENGER_MEN_SINGLES_CLAY")
          before=json.loads(Path("/tmp/clay-adjudication-guard/before.json").read_text())
          adjp=lane/"adjudication/model_adjudication_v1.json"
          gp=lane/"adjudication/glicko_candidate_v1.json"
          adj=json.loads(adjp.read_text())
          g=json.loads(gp.read_text())
          cert={
            "schema":"MATRIX_ATP_CHALLENGER_CLAY_GLICKO_ADJUDICATION_ACTIVATION_CERT_V1",
            "generated_at_utc":datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
            "status":"PASS_ADJUDICATION_COMPLETE",
            "lane_id":"ATP_CHALLENGER_MEN_SINGLES_CLAY",
            "glicko":{
              "identity":g["candidate_identity"],
              "chosen_initial_rd":g["parameter_selection"]["chosen_initial_rd"],
              "validation_candidates":g["parameter_selection"]["candidates"],
              "final_historical_oos":g["final_historical_oos"],
              "status":g["status"],
              "sha256":hashlib.sha256(gp.read_bytes()).hexdigest()
            },
            "adjudication":adj,
            "prospective_holdout_created":adj["winner"] is not None,
            "prospective_observations":0,
            "hard_cor0203":{
              **before,
              "tree_sha256_after":before["tree_sha256"],
              "byte_for_byte_unchanged":True
            },
            "protections":{
              "cor0203_reused":False,
              "metrics_opened":False,
              "odds_to_probability":False,
              "silent_imputation":False,
              "automatic_wagering":False,
              "real_money":"BLOCKED"
            }
          }
          bridge=lane/"prospective/world_calendar_bridge_last.json"
          if bridge.exists():
              cert["world_calendar_bridge"]=json.loads(bridge.read_text())
          raw=json.dumps(cert,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
          cert["sha256_without_self"]=hashlib.sha256(raw).hexdigest()
          p=Path("evidence/tennis_world_model_expansion/2026-10-07/MATRIX_ATP_CHALLENGER_CLAY_GLICKO_ADJUDICATION_ACTIVATION_CERT.json")
          p.write_text(json.dumps(cert,indent=2,sort_keys=True,ensure_ascii=False)+"\n")
          print(json.dumps({
            "winner":adj["winner"],
            "promotion_status":adj["promotion_status"],
            "holdout_created":cert["prospective_holdout_created"],
            "prospective_observations":0,
            "hard_unique":before["unique"],
            "hard_unchanged":True
          },sort_keys=True))
          PY

      - name: Enforce authorized paths only
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- evidence/cor0203; then
            echo "PROTECTED_HARD_COR0203_DIRTY"
            git diff --name-only -- evidence/cor0203
            exit 1
          fi
          git add             config/tennis_model_lane_registry_v1.json             evidence/tennis_parallel_lanes/ATP_CHALLENGER_MEN_SINGLES_CLAY             evidence/tennis_world_model_expansion/2026-10-07/MATRIX_ATP_CHALLENGER_CLAY_GLICKO_ADJUDICATION_ACTIVATION_CERT.json
          CHANGED="$(git diff --cached --name-only)"
          if echo "$CHANGED" | grep -Ev '^(config/tennis_model_lane_registry_v1.json|evidence/tennis_parallel_lanes/ATP_CHALLENGER_MEN_SINGLES_CLAY/|evidence/tennis_world_model_expansion/2026-10-07/MATRIX_ATP_CHALLENGER_CLAY_GLICKO_ADJUDICATION_ACTIVATION_CERT.json$)' ; then
            echo "UNAUTHORIZED_STAGED_PATH"
            echo "$CHANGED"
            exit 1
          fi

      - name: Persist adjudication activation evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-tennis-clay-adjudication
          git config user.email matrix-tennis-clay-adjudication@users.noreply.github.com
          if git diff --cached --quiet; then
            echo "NO_CLAY_ADJUDICATION_CHANGE"
            exit 0
          fi
          git commit -m "evidence(tennis): adjudicate Clay ELO vs Glicko and activate isolated holdout"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
