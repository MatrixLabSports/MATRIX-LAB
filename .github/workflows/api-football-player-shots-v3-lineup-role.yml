name: API-Football Player Shots v3 Lineup Role

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-player-shots-v3-lineup-role.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-football-player-shots-v3-lineup-role
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pytest requests

      - name: Verify lineup-only protections
        run: python -m pytest -q tests/test_api_football_player_shots_v3_lineup_role.py

      - name: Rebuild Player Shots v3 from historical lineups
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m tools.api_football_player_shots_v3_lineup_role --collect-lineups

      - name: Enforce resolution semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("evidence/api_football/market_expansion/player_shots_v3")
          s=json.loads((root/"summary.json").read_text())
          m=json.loads((root/"model.json").read_text())
          d=json.loads((root/"dataset_manifest.json").read_text())
          state=json.loads(Path("evidence/api_football/player_shots_v3_prospective/state.json").read_text())
          assert s["games_substitute_used"] is False
          assert d["historical_role_label_source"]=="/fixtures/lineups"
          assert d["prospective_role_label_source"]=="/fixtures/lineups"
          assert m["games_substitute_used"] is False
          assert m["validation_used_for_parameter_tuning"] is False
          assert m["protected_final_holdout_used"] is False
          assert m["odds_used_to_generate_probability"] is False
          assert state["metrics_policy"]=="SEALED_UNTIL_EACH_THRESHOLD_30_50_100_200"
          assert state["parameter_tuning_allowed"] is False
          assert all(x["metrics_opened"] is False for x in state["gates"].values())
          assert state["automatic_wagering"] is False
          assert state["real_money"]=="BLOCKED"
          if m.get("prospective_eligible"):
              assert state["status"]=="ACTIVE_WAITING_FIRST_PREMATCH_FREEZE"
              assert state["prospective_freeze_allowed"] is True
          else:
              assert state["status"]=="NO_GO_HISTORICAL_OOS"
              assert state["prospective_freeze_allowed"] is False
          print("PLAYER_SHOTS_V3_RESOLUTION_GATE: PASS")
          PY

      - name: Persist Player Shots v3 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-player-shots-v3"
          git config user.email "matrix-football-player-shots-v3@users.noreply.github.com"
          git add evidence/api_football/market_expansion/player_shots_v3
          git add evidence/api_football/player_shots_v3_prospective
          git commit -m "evidence(football): persist Player Shots v3 lineup-role rebuild"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
