name: MATRIX Hybrid Elite Research Pair Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "19 2,14 * * *"
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/matrix_hybrid_elite_research_pair_bridge.py
      - tests/test_matrix_hybrid_elite_research_pair_bridge.py
      - .github/workflows/matrix-hybrid-elite-research-pair-integration.yml

permissions:
  contents: write

concurrency:
  group: matrix-hybrid-elite-research-pair-integration
  cancel-in-progress: false

jobs:
  verify-research-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTOMATIC_WAGERING: "false"
      HYBRID_AUTO_PROMOTION: DISABLED
    steps:
      - name: Checkout research branch, not production
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test original hybrid Bayesian gates and physical same-event research pairs
        shell: bash
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = "BLOCKED"
          test "$AUTOMATIC_WAGERING" = "false"
          test "$HYBRID_AUTO_PROMOTION" = "DISABLED"
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=. python -m pytest -q \
            tests/test_matrix_hybrid_elite_lab.py \
            tests/test_matrix_hybrid_elite_bayesian_shadow.py \
            tests/test_matrix_hybrid_elite_research_pair_bridge.py

      - name: Physically bind all prematch research probability pairs by frozen source SHA
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.matrix_hybrid_elite_research_pair_bridge \
            --out evidence/matrix_hybrid_elite/MATRIX_HYBRID_RESEARCH_PRELABEL_PAIRS_LAST.json
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("evidence/matrix_hybrid_elite/MATRIX_HYBRID_RESEARCH_PRELABEL_PAIRS_LAST.json")
          r=json.loads(path.read_bytes())
          assert r["schema"]=="MATRIX_HYBRID_ELITE_RESEARCH_PRELABEL_PAIRS_V1"
          assert r["recovered_research_pair_count"]>=37
          assert r["rejected_research_pair_count"]==0,r["rejected"]
          assert r["existing_official_original_p_matrix_pairs"]==0
          assert r["formal_hybrid_elite_lab_rows_admitted"]==0
          assert r["independently_certified_postmatch_pairs_in_this_prelabeled_receipt"]==0
          assert r["original_model_parameters_mutated"] is False
          assert r["automatic_model_promotion"] is False
          assert r["telegram_signal_authorized"] is False
          assert r["production_p_matrix_authorized"] is False
          assert r["automatic_wagering"] is False
          assert r["real_money"]=="BLOCKED"
          assert len(r["prelabel_research_pairs"])==r["recovered_research_pair_count"]
          assert all(p["same_authenticated_input_evidence"] is True
                     and p["formal_hybrid_lab_admission_authorized"] is False
                     and p["postmatch_outcome_included"] is False
                     for p in r["prelabel_research_pairs"])
          print("HYBRID_RESEARCH_PAIR_PHYSICAL_GATE",r["recovered_research_pair_count"],
                "OFFICIAL_HYBRID_ROWS",r["formal_hybrid_elite_lab_rows_admitted"])
          PY

      - name: Preserve real research evidence only when changed, never promote
        shell: bash
        run: |
          set -euo pipefail
          P="evidence/matrix_hybrid_elite/MATRIX_HYBRID_RESEARCH_PRELABEL_PAIRS_LAST.json"
          git config user.name matrix-hybrid-research-link
          git config user.email matrix-hybrid-research-link@users.noreply.github.com
          git add -- "$P"
          if git diff --cached --quiet; then echo "NO_NEW_PHYSICAL_HYBRID_PAIR"; exit 0; fi
          git commit -m "evidence(hybrid): SHA verified research prelabel same-event pairs"
          for retry in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep "$retry"
          done
          exit 1
