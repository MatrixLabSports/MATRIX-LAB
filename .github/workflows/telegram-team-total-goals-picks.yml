name: MATRIX Telegram Team Total Goals Picks

on:
  workflow_dispatch:
  schedule:
    - cron: "9,24,39,54 * * * *"
  push:
    branches:
      - main
      - repair/cor09-world-pipeline
    paths:
      - ".github/workflows/telegram-team-total-goals-picks.yml"
      - "tools/telegram_team_total_goals_picks.py"
      - "tests/test_telegram_team_total_goals_picks.py"
      - "tests/test_telegram_team_total_goals_workflow_contract.py"
      - "evidence/api_football/prospective_market_freeze/**"
      - "evidence/api_football/prospective_daily/**"

permissions:
  contents: write

concurrency:
  group: matrix-telegram-team-total-goals-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
      PAPER_BANKROLL: ENABLED

    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests pytest

      - name: Prove permanent safety and workflow contract
        shell: bash
        run: |
          set -euo pipefail
          test "$MATRIX_MODE" = "SHADOW"
          test "$REAL_MONEY" = "BLOCKED"
          test "$AUTO_BETTING" = "DISABLED"
          PYTHONPATH=. python -m pytest -q \
            tests/test_telegram_team_total_goals_picks.py \
            tests/test_telegram_team_total_goals_workflow_contract.py

      - name: Validate Telegram and odds secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_NET_KEY: ${{ secrets.ODDS_API_NET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          test -n "$ODDS_API_NET_KEY"
          echo "TEAM_TOTAL_GOALS_TELEGRAM_SECRETS_PRESENT=PASS"

      - name: Generate and dispatch governed PICKS NUEVOS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_NET_KEY: ${{ secrets.ODDS_API_NET_KEY }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m tools.telegram_team_total_goals_picks
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/notifications/telegram/MATRIX_TELEGRAM_TEAM_TOTAL_GOALS_PICKS_LAST.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["status"]=="PASS"
          assert j["protections"]["strictly_prior_history_only"] is True
          assert j["protections"]["odds_used_to_generate_probability"] is False
          assert j["protections"]["physical_exact_quote_required"] is True
          assert j["protections"]["ev_revalidation_required"] is True
          assert j["protections"]["automatic_wagering"] is False
          assert j["protections"]["real_money"]=="BLOCKED"
          assert j["minimum_odds_strictly_greater_than"]==1.5
          assert j["minimum_ev"]==0.05
          assert j["team_total_quote_policy"]["snapshot_type"]=="team total"
          assert j["team_total_quote_policy"]["period"]=="full time"
          assert j["event_identity_policy"]["pagination_required"] is True
          assert j["event_identity_policy"]["recovery_window_seconds"]==21600
          print(json.dumps({
              "candidate_count":j["candidate_count"],
              "unique_fixtures":j["unique_fixtures"],
              "eligible_quote_count":j["eligible_quote_count"],
              "sent_count":j["sent_count"],
              "diagnostic_status_counts":j["diagnostic_status_counts"],
              "quote_window_summary":j["quote_window_summary"],
          },sort_keys=True))
          PY

      - name: Persist Team Total Goals Telegram evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-telegram-team-total-goals"
          git config user.email "matrix-telegram-team-total-goals@users.noreply.github.com"
          git add \
            evidence/notifications/telegram/MATRIX_TELEGRAM_TEAM_TOTAL_GOALS_PICKS_LAST.json \
            evidence/notifications/telegram/MATRIX_TELEGRAM_TEAM_TOTAL_GOALS_PICKS_LEDGER.json
          if git diff --cached --quiet; then
            echo "NO_TEAM_TOTAL_GOALS_TELEGRAM_CHANGE"
            exit 0
          fi
          git commit -m "evidence(telegram): persist Team Total Goals picks"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then
              exit 0
            fi
            sleep $((attempt*2))
          done
          exit 1
