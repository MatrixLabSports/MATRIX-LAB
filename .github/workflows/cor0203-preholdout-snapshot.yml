name: COR02-03 preholdout challenger snapshot

on:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/cor0203-preholdout-snapshot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Download sealed pre-holdout archive
        shell: bash
        run: |
          set -euo pipefail
          for Y in 2022 2023 2024 2025; do
            curl -fL --retry 3 --retry-delay 2 "https://stats.tennismylife.org/data/${Y}_challenger.csv" -o "/tmp/${Y}_challenger.csv"
          done
          echo "hist_2022_sha=$(sha256sum /tmp/2022_challenger.csv | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "hist_2023_sha=$(sha256sum /tmp/2023_challenger.csv | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "hist_2024_sha=$(sha256sum /tmp/2024_challenger.csv | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "hist_2025_sha=$(sha256sum /tmp/2025_challenger.csv | awk '{print $1}')" >> "$GITHUB_ENV"
          URL='https://stats.tennismylife.org/data/2026_challenger.csv'
          ONGOING_URL='https://stats.tennismylife.org/data/challenger_ongoing_tourneys.csv'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/2026_challenger.csv
          curl -fL --retry 3 --retry-delay 2 "$ONGOING_URL" -o /tmp/challenger_ongoing_tourneys.csv
          ACTUAL="$(sha256sum /tmp/2026_challenger.csv | awk '{print $1}')"
          ONGOING_SHA="$(sha256sum /tmp/challenger_ongoing_tourneys.csv | awk '{print $1}')"
          echo "official_csv_sha256=$ACTUAL" >> "$GITHUB_ENV"
          echo "ongoing_csv_sha256=$ONGOING_SHA" >> "$GITHUB_ENV"

      - name: Extract exact Challenger 2026 member
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/cor0203/preholdout
          cp /tmp/2026_challenger.csv evidence/cor0203/preholdout/2026_challenger_live_snapshot.csv
          cp /tmp/challenger_ongoing_tourneys.csv evidence/cor0203/preholdout/challenger_ongoing_tourneys_live_snapshot.csv
          test -s evidence/cor0203/preholdout/2026_challenger_live_snapshot.csv
          test -s evidence/cor0203/preholdout/challenger_ongoing_tourneys_live_snapshot.csv

      - name: Build manifest and validate temporal horizon
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          p=Path('evidence/cor0203/preholdout/2026_challenger_live_snapshot.csv')
          op=Path('evidence/cor0203/preholdout/challenger_ongoing_tourneys_live_snapshot.csv')
          raw=p.read_bytes(); oraw=op.read_bytes()
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig', newline='')))
          orows=list(csv.DictReader(op.open(encoding='utf-8-sig', newline='')))
          dates=[]
          for r in rows:
              v=(r.get('tourney_date') or '').strip()
              if v:
                  try: dates.append(int(float(v)))
                  except ValueError: pass
          maximum=max(dates) if dates else None
          if maximum is None:
              raise SystemExit('LIVE_SNAPSHOT_HAS_NO_TOURNEY_DATE')
          latest=[r for r in rows if int(float((r.get('tourney_date') or '0').strip() or 0))==maximum]
          latest_tournaments=sorted({(r.get('tourney_name') or '').strip() for r in latest if (r.get('tourney_name') or '').strip()})
          manifest={
              'schema':'MATRIX_COR0203_PREHOLDOUT_2026_CHALLENGER_SNAPSHOT_V2',
              'historical_live_sha256':{'2022':'\${{ env.hist_2022_sha }}','2023':'\${{ env.hist_2023_sha }}','2024':'\${{ env.hist_2024_sha }}','2025':'\${{ env.hist_2025_sha }}'},
              'historical_expected_sha256':{'2022':'b26f75ebf933d7f831ec003294c7ab16331a7a57e2b64a8073a74d9083603041','2023':'94ac9f07aee60f682f325a513ca086092e35c78be6f4ae24f40fb6b868959f17','2024':'ac78dada2dc5698015f1ff79963f7837a1ed14aebf2ef21095477854ac8a6af9','2025':'ec1e2479d26e367f59af7337ecd300d5a8525e6f360694c1a0821570b50163d2'},
              'source_archive':'ARJUNVARMA2000/tennis-elo release data-archive',
              'archive_sha256':'${{ env.archive_sha256 }}',
              'archive_asset_updated_at_utc':'2026-09-21T01:09:35Z',
              'member':'raw/atp/lower/2026_challenger.csv',
              'member_bytes':len(raw),
              'member_sha256':hashlib.sha256(raw).hexdigest(),
              'rows':len(rows),
              'max_tourney_date':maximum,
              'latest_tournaments':latest_tournaments,
              'contains_saint_tropez':any('tropez' in t.lower() for t in latest_tournaments),
              'contains_san_diego':any('san diego' in t.lower() for t in latest_tournaments),
              'holdout_contract_created_at_utc':'2026-09-22T01:10:26.018561+00:00',
              'preholdout': False,
              'pit_rule':'only rows with period/tourney date strictly before each target freeze may update state',
          }
          Path('evidence/cor0203/preholdout/MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps(manifest,indent=2,sort_keys=True))
          PY

      - name: Commit exact snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'matrix-ci'
          git config user.email 'matrix-ci@users.noreply.github.com'
          git add evidence/cor0203/preholdout/MANIFEST.json evidence/cor0203/preholdout/2026_challenger_live_snapshot.csv evidence/cor0203/preholdout/challenger_ongoing_tourneys_live_snapshot.csv
          if git diff --cached --quiet; then
            echo 'No snapshot changes'
            exit 0
          fi
          git commit -m 'evidence(cor02-03): capture official challenger 2026 live snapshot'
          git push origin HEAD:repair/cor09-world-pipeline
