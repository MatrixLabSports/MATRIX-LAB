name: API-Football prospective FINAL-only settlement

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-prospective-final-settlement.yml
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write

concurrency:
  group: api-football-prospective-final-only-settlement
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest requests
      - name: Run FINAL-only settlement tests
        run: python -m pytest -q tests/test_api_football_prospective_api_settlement.py
      - name: Settle eligible standard FINAL results
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ ! -f evidence/api_football/prospective_market_freeze/freeze.json ]; then
            echo "NO_PROSPECTIVE_FREEZE_YET"
            exit 0
          fi
          python -m tools.api_football_prospective_api_settlement
      - name: Enforce settlement invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/api_football/prospective_market_freeze/settlement_sync_last.json")
          if not p.exists():
              print("NO_SETTLEMENT_SYNC_ARTIFACT_YET")
              raise SystemExit(0)
          d=json.loads(p.read_text())
          assert d["status"]=="PASS"
          assert d["settlement_final_only"] is True
          assert d["metrics_opened"] is False
          assert d["outcomes_used_for_metrics"]==0
          assert d["p_matrix_status"]=="NOT_GENERATED"
          assert d["automatic_wagering"] is False
          assert d["real_money"]=="BLOCKED"
          print("MATRIX_FOOTBALL_PROSPECTIVE_FINAL_ONLY_SETTLEMENT_GATE: PASS")
          print("new_settlement_count=",d["new_settlement_count"])
          print("ledger_final_count=",d["ledger_final_count"])
          print("pending_count=",d["pending_count"])
          print("network_calls=",d["network_calls"])
          PY
      - name: Persist settlement state
        run: |
          git config user.name "matrix-football-prospective-settlement"
          git config user.email "matrix-football-prospective-settlement@users.noreply.github.com"
          git add evidence/api_football/prospective_market_freeze
          if git diff --cached --quiet; then
            echo NO_PROSPECTIVE_SETTLEMENT_CHANGE
            exit 0
          fi
          git commit -m "evidence(football): update prospective FINAL-only settlement"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
# Governed handoff-resume trigger 28SEP2026: recheck the 67-event prospective FINAL-only settlement state.
# Governed manual catch-up trigger 28SEP2026 after eligible FINAL windows.
