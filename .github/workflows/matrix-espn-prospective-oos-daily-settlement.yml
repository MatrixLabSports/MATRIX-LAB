name: MATRIX ESPN Prospective OOS Daily Settlement
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
permissions:
  actions: read
  contents: read
jobs:
  settle-sha-bound-prospective:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/matrix_football_espn_enriched_pit_research.py
            tools/matrix_football_espn_six_league_raw_capture.py
            tools/matrix_espn_sha_bound_two_month_over25_research.py
            tools/matrix_espn_sha_bound_prospective_oos_settlement.py
            tests/test_matrix_espn_sha_bound_prospective_oos_settlement.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run scientific OOS identity and time-leakage contracts first
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_matrix_espn_sha_bound_prospective_oos_settlement.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 44986315540
          name: matrix-espn-six-league-monthly-raw-research
          github-token: ${{ github.token }}
          path: evidence/frozen/espn_source_provenance
      - name: Revalidate source freeze against its original 12 raw SHA receipts
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path("evidence/frozen/espn_source_provenance")
          files=list((root/"output").glob("ESPN_SHA_BOUND_RESEARCH_FROZEN_*.json"))
          assert len(files)==1
          frozen=json.loads(files[0].read_bytes())
          assert frozen["research_probability_count"]==71
          assert frozen["source_sha256_and_point_in_time_receipts_verified"] is True
          assert frozen["production_p_matrix_authorized"] is False
          assert frozen["real_money"]=="BLOCKED"
          for month in ("2026-10","2026-11"):
              directory=root/month
              manifest=json.loads((directory/"MATRIX_ESPN_SIX_LEAGUE_RAW_RESEARCH_LAST.json").read_bytes())
              assert manifest["source_captured_leagues"]==6
              for item in manifest["sources"].values():
                  raw=(directory/item["raw_archive_file"]).read_bytes()
                  assert hashlib.sha256(raw).hexdigest()==item["raw_sha256"]
          print("ORIGINAL_PREMATCH_FREEZE_AND_12_SHA_ARCHIVES_VERIFIED")
          PY
      - name: Collect later official ESPN November final-result source bytes
        run: |
          PYTHONPATH=. python -m tools.matrix_football_espn_six_league_raw_capture \
            --month 2026-11 \
            --out evidence/research/espn_november_results
      - name: Settle only exact postgame official final results from fresh SHA receipts
        run: |
          mkdir -p evidence/research/oos_scorecards
          FREEZE=$(find evidence/frozen/espn_source_provenance/output -maxdepth 1 -name 'ESPN_SHA_BOUND_RESEARCH_FROZEN_*.json' | head -n 1)
          test -n "$FREEZE"
          PYTHONPATH=. python -m tools.matrix_espn_sha_bound_prospective_oos_settlement \
            --freeze "$FREEZE" \
            --results evidence/research/espn_november_results \
            --out "evidence/research/oos_scorecards/ESPN_OOS_$(date -u +%Y%m%dT%H%M%SZ).json"
      - name: Verify fail-closed scorecard before publishing research output
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("evidence/research/oos_scorecards")
          files=list(root.glob("ESPN_OOS_*.json"))
          assert len(files)==1
          r=json.loads(files[0].read_bytes())
          assert r["schema"]=="MATRIX_ESPN_SHA_PIT_PROSPECTIVE_OVER25_OOS_SETTLEMENT_V1"
          assert r["verified_prospective_settlements"]<=71
          assert r["source_raw_sha_and_pit_receipts_verified"] is True
          assert r["production_p_matrix_authorized"] is False
          assert r["telegram_signal_authorized"] is False
          assert r["real_money"]=="BLOCKED"
          print(json.dumps({"scientific_oos_settled":r["verified_prospective_settlements"],
                            "missing_final_is_not_a_loss":r["awaiting_authentic_final"],
                            "official_p_matrix_authorized":False},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-espn-prospective-postmatch-oos
          path: |
            evidence/research/espn_november_results/
            evidence/research/oos_scorecards/
          if-no-files-found: warn
          retention-days: 30
