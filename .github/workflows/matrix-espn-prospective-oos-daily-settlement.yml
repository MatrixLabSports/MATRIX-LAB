name: MATRIX ESPN Prospective OOS Daily Settlement
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/matrix-espn-prospective-oos-daily-settlement.yml
  schedule:
    - cron: "23 6 * * *"
permissions:
  actions: read
  contents: write
jobs:
  settle-sha-bound-prospective:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/matrix_football_espn_enriched_pit_research.py
            tools/matrix_football_espn_six_league_raw_capture.py
            tools/matrix_espn_sha_bound_two_month_over25_research.py
            tools/matrix_espn_sha_bound_prospective_oos_settlement.py
            tests/test_matrix_espn_sha_bound_prospective_oos_settlement.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run scientific OOS identity and time-leakage contracts first
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_matrix_espn_sha_bound_prospective_oos_settlement.py
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          path: pinned_evidence
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            evidence/football_world_inventory/sha_bound_archives/ESPN_SHA_PIT_PREMATCH_12_SOURCES_71_RESEARCH_20261122T045141Z.zip
      - name: Restore permanent 71 forecast SHA source archive
        run: |
          ARCHIVE="pinned_evidence/evidence/football_world_inventory/sha_bound_archives/ESPN_SHA_PIT_PREMATCH_12_SOURCES_71_RESEARCH_20261122T045141Z.zip"
          test -f "$ARCHIVE"
          ACTUAL=$(git -C pinned_evidence hash-object evidence/football_world_inventory/sha_bound_archives/ESPN_SHA_PIT_PREMATCH_12_SOURCES_71_RESEARCH_20261122T045141Z.zip)
          test "$ACTUAL" = "33dc4df6708d67fb28b9f5504b77d7890e9ecc11"
          mkdir -p evidence/frozen/espn_source_provenance
          unzip -q "$ARCHIVE" -d evidence/frozen/espn_source_provenance
          echo "PERMANENT_SOURCE_ARCHIVE_RESTORED_SHA_BOUND"
      - name: Revalidate source freeze against its original 12 raw SHA receipts
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path("evidence/frozen/espn_source_provenance")
          files=list((root/"output").glob("ESPN_SHA_BOUND_RESEARCH_FROZEN_*.json"))
          assert len(files)==1
          frozen=json.loads(files[0].read_bytes())
          assert frozen["research_probability_count"]==71
          assert frozen["source_sha256_and_point_in_time_receipts_verified"] is True
          assert frozen["production_p_matrix_authorized"] is False
          assert frozen["real_money"]=="BLOCKED"
          for month in ("2026-10","2026-11"):
              directory=root/month
              manifest=json.loads((directory/"MATRIX_ESPN_SIX_LEAGUE_RAW_RESEARCH_LAST.json").read_bytes())
              assert manifest["source_captured_leagues"]==6
              for item in manifest["sources"].values():
                  raw=(directory/item["raw_archive_file"]).read_bytes()
                  assert hashlib.sha256(raw).hexdigest()==item["raw_sha256"]
          print("ORIGINAL_PREMATCH_FREEZE_AND_12_SHA_ARCHIVES_VERIFIED")
          PY
      - name: Collect later official ESPN November final-result source bytes
        run: |
          PYTHONPATH=. python -m tools.matrix_football_espn_six_league_raw_capture \
            --month 2026-11 \
            --out evidence/research/espn_november_results
      - name: Settle only exact postgame official final results from fresh SHA receipts
        run: |
          mkdir -p evidence/research/oos_scorecards
          FREEZE=$(find evidence/frozen/espn_source_provenance/output -maxdepth 1 -name 'ESPN_SHA_BOUND_RESEARCH_FROZEN_*.json' | head -n 1)
          test -n "$FREEZE"
          PYTHONPATH=. python -m tools.matrix_espn_sha_bound_prospective_oos_settlement \
            --freeze "$FREEZE" \
            --results evidence/research/espn_november_results \
            --out "evidence/research/oos_scorecards/ESPN_OOS_$(date -u +%Y%m%dT%H%M%SZ).json"
      - name: Verify fail-closed scorecard before publishing research output
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("evidence/research/oos_scorecards")
          files=list(root.glob("ESPN_OOS_*.json"))
          assert len(files)==1
          r=json.loads(files[0].read_bytes())
          assert r["schema"]=="MATRIX_ESPN_SHA_PIT_PROSPECTIVE_OVER25_OOS_SETTLEMENT_V1"
          assert r["verified_prospective_settlements"]<=71
          assert r["source_raw_sha_and_pit_receipts_verified"] is True
          assert r["production_p_matrix_authorized"] is False
          assert r["telegram_signal_authorized"] is False
          assert r["real_money"]=="BLOCKED"
          print(json.dumps({"scientific_oos_settled":r["verified_prospective_settlements"],
                            "missing_final_is_not_a_loss":r["awaiting_authentic_final"],
                            "official_p_matrix_authorized":False},sort_keys=True))
          PY
      - name: Persist exact postmatch SHA evidence into create-only GitHub archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request, zipfile
          from pathlib import Path
          evidence_root=Path("evidence/research")
          scorecards=list((evidence_root/"oos_scorecards").glob("ESPN_OOS_*.json"))
          assert len(scorecards)==1
          score=json.loads(scorecards[0].read_bytes())
          assert score["schema"]=="MATRIX_ESPN_SHA_PIT_PROSPECTIVE_OVER25_OOS_SETTLEMENT_V1"
          assert score["telegram_signal_authorized"] is False
          assert score["production_p_matrix_authorized"] is False
          assert score["real_money"]=="BLOCKED"
          source_dir=evidence_root/"espn_november_results"
          source=json.loads((source_dir/"MATRIX_ESPN_SIX_LEAGUE_RAW_RESEARCH_LAST.json").read_bytes())
          assert source["source_captured_leagues"]==6
          for v in source["sources"].values():
              data=(source_dir/v["raw_archive_file"]).read_bytes()
              assert hashlib.sha256(data).hexdigest()==v["raw_sha256"]
          target_name="ESPN_SHA_OOS_RUN_"+os.environ["GITHUB_RUN_ID"]+"_ATTEMPT_"+os.environ["GITHUB_RUN_ATTEMPT"]+".zip"
          folder="evidence/football_world_inventory/sha_bound_archives/oos"
          output=Path(target_name)
          with zipfile.ZipFile(output,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for p in sorted(evidence_root.glob("oos_scorecards/*.json"))+sorted(source_dir.glob("*.json")):
                  archive.write(p,p.relative_to(evidence_root).as_posix())
          raw=output.read_bytes()
          digest=hashlib.sha256(raw).hexdigest()
          assert len(raw)<900000, "Archive larger than supported GitHub contents upload"
          path=folder+"/"+target_name
          url="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/contents/"+path
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28",
                   "Content-Type":"application/json"}
          content={"message":"evidence(research): freeze authentic November final scores and exact OOS settlement; no Telegram promotion",
                   "branch":"repair/cor09-world-pipeline",
                   "content":base64.b64encode(raw).decode("ascii")}
          request=urllib.request.Request(url,data=json.dumps(content).encode("utf-8"),headers=headers,method="PUT")
          with urllib.request.urlopen(request,timeout=50) as response:
              assert response.status==201
          with urllib.request.urlopen(urllib.request.Request(url+"?ref=repair%2Fcor09-world-pipeline",headers=headers),timeout=50) as response:
              stored=json.load(response)
          assert stored["path"]==path
          assert stored["size"]==len(raw)
          print(json.dumps({"archive_path":path,"archive_sha256":digest,
                            "prospective_settlements":score["verified_prospective_settlements"],
                            "pending":score["awaiting_authentic_final"],
                            "telegram_authorized":False},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-espn-prospective-postmatch-oos
          path: |
            evidence/research/espn_november_results/
            evidence/research/oos_scorecards/
          if-no-files-found: warn
          retention-days: 30
