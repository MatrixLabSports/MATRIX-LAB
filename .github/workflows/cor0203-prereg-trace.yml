name: COR02-03 prereg trace

on:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/cor0203-prereg-trace.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - name: Trace physical preregistration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          targets=[
            "0aa85459f930a75f1976d56815e6623d696c74be4a96959455907de0c938a088",
            "rapidapi-tennis:atp:match:2086",
            "rapidapi-tennis:match:2086",
            "Alejo Sanchez Quilez"
          ]
          roots=[Path("evidence/cor0203/runtime"),Path("evidence/cor0203/holdout")]
          hits=[]
          for root in roots:
              for p in root.glob("*.json"):
                  try: text=p.read_text(encoding="utf-8")
                  except Exception: continue
                  matched=[t for t in targets if t in text]
                  if matched:
                      hits.append({"path":str(p),"matched":matched})
          out={"schema":"MATRIX_COR0203_PREREG_TRACE_20261005_V1","targets":targets,"hits":hits,"hit_count":len(hits),"real_money":"BLOCKED"}
          Path("evidence/cor0203/runtime/MATRIX_COR0203_PREREG_TRACE_20261005.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-ci
          git config user.email matrix-ci@users.noreply.github.com
          git add evidence/cor0203/runtime/MATRIX_COR0203_PREREG_TRACE_20261005.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence(cor02-03): trace Daniel Alejo preregistration'
          git push origin HEAD:repair/cor09-world-pipeline
