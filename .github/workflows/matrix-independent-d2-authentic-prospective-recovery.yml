name: MATRIX Independent D+2 Authentic Prospective Recovery

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Bogota target YYYY-MM-DD; leave blank for D+2"
        required: false
        type: string
  schedule:
    - cron: "18 9,21 * * *" # every 12 hours; ahead of the next 48h window
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/matrix-independent-d2-authentic-prospective-recovery.yml

permissions:
  contents: write

concurrency:
  group: matrix-independent-d2-authentic-prospective-recovery
  cancel-in-progress: false

jobs:
  free-only-prospective:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTOMATIC_WAGERING: "false"
    steps:
      - name: Checkout original operational code and evidence
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require immutable research and receipt regression checks
        shell: bash
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = BLOCKED
          test "$AUTOMATIC_WAGERING" = false
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=. python -m pytest -q             tests/test_matrix_football_three_source_research_gate.py             tests/test_matrix_football_independent_fixture_pipeline.py             tests/test_matrix_football_independent_over25_shadow.py             tests/test_matrix_independent_over25_prematch_freeze.py \
            tests/test_matrix_independent_free_poisson_v1.py

      - name: Choose prospective D+2 date (Bogota)
        id: day
        shell: bash
        env:
          REQUESTED_DAY: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          D="$REQUESTED_DAY"
          if [ -z "$D" ]; then D="$(TZ=America/Bogota date -d '+2 days' +%F)"; fi
          python - "$D" <<'PY'
          import sys
          from datetime import date, timedelta, datetime
          from zoneinfo import ZoneInfo
          target=date.fromisoformat(sys.argv[1])
          today=datetime.now(ZoneInfo("America/Bogota")).date()
          if not today < target <= today+timedelta(days=3):
              raise SystemExit("TARGET_NOT_PROSPECTIVE_D1_TO_D3")
          print("TARGET_PREMATCH_DATE",target)
          PY
          echo "date=$D" >> "$GITHUB_OUTPUT"

      - name: Browser first - try authorized SofaScore and Flashscore receipts before research-only fallback
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          D="${{ steps.day.outputs.date }}"
          DIR="evidence/football_world_inventory/$D"
          mkdir -p "$DIR"
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          # Browser receipts are not invented or scraped from GitHub runners.
          # Their absence blocks canonical identity, not independent
          # AUTHORIZED-FREE-PROVIDER research that never enters production.
          shopt -s nullglob
          old=("$DIR"/MATRIX_OPERA_THREE_SOURCE_RESEARCH_RECEIPT_*.json)
          new=("$DIR"/MATRIX_FLASH_EXACT_MID_PREMATCH_RESEARCH_*.json)
          if [ "${#old[@]}" -eq 0 ] || [ "${#new[@]}" -eq 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=NO_BOTH_BROWSER_RECEIPTS_FOR_TARGET" >> "$GITHUB_OUTPUT"
            echo "NO_VERIFIABLE_BROWSER_FIRST_SOURCE_FOR_TARGET; FREE_API_RESEARCH_ONLY_WITHOUT_CANONICAL_CROSS_SOURCE_IDENTITY"
            exit 0
          fi
          PYTHONPATH=. python -m tools.matrix_football_three_source_research_gate             --earlier "${old[-1]}"             --new "${new[-1]}"             --provider "evidence/governance/MATRIX_FREE_API_AUTHENTICATED_PROBE_LAST.json"             --out "$DIR/MATRIX_D2_BROWSER_FIRST_RESEARCH_PREFLIGHT.json"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Free-only authenticated football-data.org target day intake
        if: steps.browser.outputs.attempted == 'true'
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          D="${{ steps.day.outputs.date }}"
          PYTHONPATH=. python -m tools.matrix_football_independent_fixture_pipeline             --date "$D"             --out "evidence/football_world_inventory/$D/MATRIX_FOOTBALL_INDEPENDENT_FIXTURE_INTAKE.json"

      - name: Free-only authentic history and frozen original formula in research
        if: steps.browser.outputs.attempted == 'true'
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          D="${{ steps.day.outputs.date }}"
          DIR="evidence/football_world_inventory/$D"
          PYTHONPATH=. python -m tools.matrix_football_independent_over25_shadow             --intake "$DIR/MATRIX_FOOTBALL_INDEPENDENT_FIXTURE_INTAKE.json"             --out "$DIR/MATRIX_INDEPENDENT_OVER25_HISTORY_SHADOW.json"
          PYTHONPATH=. python -m tools.matrix_independent_over25_prematch_freeze             --intake "$DIR/MATRIX_FOOTBALL_INDEPENDENT_FIXTURE_INTAKE.json"             --shadow "$DIR/MATRIX_INDEPENDENT_OVER25_HISTORY_SHADOW.json"             --out "$DIR/MATRIX_INDEPENDENT_OVER25_PREMATCH_FREEZE_REPORT.json"

      - name: Independent free-source Poisson V1 (not original MATRIX calibration)
        if: steps.browser.outputs.attempted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          D="${{ steps.day.outputs.date }}"
          DIR="evidence/football_world_inventory/$D"
          PYTHONPATH=. python -m tools.matrix_independent_free_poisson_v1 \
            --intake "$DIR/MATRIX_FOOTBALL_INDEPENDENT_FIXTURE_INTAKE.json" \
            --shadow "$DIR/MATRIX_INDEPENDENT_OVER25_HISTORY_SHADOW.json" \
            --out "$DIR/MATRIX_FREE_POISSON_RESEARCH_LAST.json"

      - name: Record physical run metrics and permanent blocked-production guard
        if: always() && steps.day.outputs.date != ''
        shell: bash
        run: |
          set -euo pipefail
          D="${{ steps.day.outputs.date }}"
          DIR="evidence/football_world_inventory/$D"
          mkdir -p "$DIR"
          python - "$D" "$DIR" "${{ steps.browser.outputs.ready }}" <<'PY'
          import sys,json,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          day,folder,ready=sys.argv[1],Path(sys.argv[2]),sys.argv[3]
          names={
             "browser":"MATRIX_D2_BROWSER_FIRST_RESEARCH_PREFLIGHT.json",
             "intake":"MATRIX_FOOTBALL_INDEPENDENT_FIXTURE_INTAKE.json",
             "shadow":"MATRIX_INDEPENDENT_OVER25_HISTORY_SHADOW.json",
             "freeze":"MATRIX_INDEPENDENT_OVER25_PREMATCH_FREEZE_REPORT.json",
             "free_poisson":"MATRIX_FREE_POISSON_RESEARCH_LAST.json",
          }
          docs={}; proofs={}
          for key,name in names.items():
              p=folder/name
              if p.is_file():
                  raw=p.read_bytes()
                  if len(raw)>24000000: raise SystemExit("D2_EVIDENCE_TOO_LARGE")
                  docs[key]=json.loads(raw)
                  proofs[key]=hashlib.sha256(raw).hexdigest()
          for doc in docs.values():
              if doc.get("real_money")!="BLOCKED":
                  raise SystemExit("D2_REAL_MONEY_NOT_BLOCKED")
              if doc.get("telegram_signal_authorized") is True or doc.get("production_p_matrix_authorized") is True or doc.get("signal_generation_authorized") is True:
                  raise SystemExit("D2_UNAUTHORIZED_PROMOTION")
          intake=docs.get("intake",{})
          shadow=docs.get("shadow",{})
          freeze=docs.get("freeze",{})
          free_poisson=docs.get("free_poisson",{})
          report={
            "schema":"MATRIX_INDEPENDENT_D2_FREE_ONLY_CYCLE_V1",
            "generated_at_utc":datetime.now(timezone.utc).isoformat(),
            "target_date_bogota":day,
            "source_order":["SOFASCORE","FLASHSCORE","FOOTBALL_DATA_ORG"],
            "browser_first_receipt_ready":ready=="true",
            "browser_first_receipt_lookup_attempted":True,
            "fallback_research_only_due_to_missing_browser_receipts":ready!="true",
            "cross_provider_identity_certified":False,
            "browser_missing_reason":"NO_BOTH_BROWSER_RECEIPTS_FOR_TARGET" if ready!="true" else None,
            "provider_only_scope_if_browser_missing": "RESEARCH_ONLY_NO_OFFICIAL_P_MATRIX" if ready!="true" else "RESEARCH_WITH_BROWSER_RECEIPTS_NOT_FORMAL_PARITY",
            "source_sha256":proofs,
            "authenticated_provider_status":intake.get("provider_status"),
            "authentic_provider_fixture_count":intake.get("fixture_count"),
            "provider_calls":intake.get("provider_calls",0)+shadow.get("network_calls",0),
            "research_probability_count":shadow.get("scored_count",0),
            "immutable_research_freeze_count":freeze.get("immutable_prematch_freeze_count",0),
            "new_independent_poisson_probability_count":free_poisson.get("scored_count",0),
            "new_independent_poisson_immutable_freezes":free_poisson.get("immutable_new_freezes",0),
            "research_only":True,
            "original_parameters_modified":False,
            "canonical_original_pit_certified":False,
            "production_p_matrix_authorized":False,
            "telegram_signal_authorized":False,
            "automatic_wagering":False,
            "real_money":"BLOCKED",
          }
          # Unique per-run evidence; do not replace a previous dated proof.
          out=folder/"MATRIX_D2_FREE_CYCLE_${{ github.run_id }}.json"
          with out.open("x",encoding="utf-8") as f:
              json.dump(report,f,indent=2,sort_keys=True);f.write("\n")
          print(json.dumps(report,sort_keys=True))
          PY

      - name: Persist source-bound research evidence, not Telegram candidates
        if: always() && steps.day.outputs.date != ''
        shell: bash
        run: |
          set -euo pipefail
          D="${{ steps.day.outputs.date }}"
          DIR="evidence/football_world_inventory/$D"
          git config user.name matrix-free-d2-research
          git config user.email matrix-free-d2-research@users.noreply.github.com
          git add -A -- "$DIR"
          if [ -d "evidence/football_research_freezes/$D" ]; then
            git add -A -- "evidence/football_research_freezes/$D"
          fi
          if git diff --cached --quiet; then echo NO_NEW_EVIDENCE; exit 0; fi
          git commit -m "evidence(football): free-only browser-first D+2 prospective $D"
          for retry in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep "$retry"
          done
          exit 1
