name: API-Football daily prospective production

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Optional YYYY-MM-DD in America/Bogota; blank uses governed automatic target selection
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-prospective-daily-production.yml
  schedule:
    # Multiple retry windows. Idempotence below prevents duplicate paid-API cycles
    # once the target date has one successful capture on the current Bogota day.
    - cron: "17 5,11,17,23 * * *"

permissions:
  contents: write

concurrency:
  group: api-football-prospective-freeze-mutation
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install governed dependencies
        run: python -m pip install pytest requests

      - name: Verify paid API entitlement and secret
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${API_FOOTBALL_KEY:-}" ]]; then
            echo "API_FOOTBALL_KEY_NOT_CONFIGURED"
            exit 2
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          os.environ["API_FOOTBALL_KEY"].encode("ascii")
          p=Path("evidence/api_football/pro_entitlement_probe/manifest.json")
          d=json.loads(p.read_text())
          assert d["pro_entitlement_verified"] is True
          assert d["status"]=="PASS"
          assert d["real_money"]=="BLOCKED"
          print("API_FOOTBALL_PRO_ENTITLEMENT: VERIFIED")
          PY

      - name: Run incremental production regression tests
        run: |
          python -m pytest -q \
            tests/test_api_football_future_fixture_capture.py \
            tests/test_api_football_build_prematch_queue.py \
            tests/test_api_football_group_history_capture.py \
            tests/test_api_football_team_last_fallback.py \
            tests/test_api_football_canonical_analysis_inputs.py \
            tests/test_api_football_prospective_market_pipeline.py

      - name: Record pre-cycle cumulative freeze count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          p=Path("evidence/api_football/prospective_market_freeze/freeze.json")
          d=json.loads(p.read_text()) if p.exists() else {"rows":[]}
          print("PRE_FREEZE_COUNT="+str(len(d.get("rows",[]))))
          PY

      - name: Resolve governed calendar target and retry state
        id: target
        shell: bash
        env:
          MATRIX_TARGET_DATE_INPUT: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          bogota=ZoneInfo("America/Bogota")
          now=datetime.now(timezone.utc).astimezone(bogota)
          manual=(os.environ.get("MATRIX_TARGET_DATE_INPUT") or "").strip()
          event=(os.environ.get("GITHUB_EVENT_NAME") or "").strip()

          if manual:
              target=manual
          elif event=="push":
              # A workflow repair pushed to main must immediately recover the
              # still-future portion of today's Bogota calendar.
              target=now.date().isoformat()
          else:
              # Scheduled production freezes the next Bogota day in advance.
              target=(now.date()+timedelta(days=1)).isoformat()

          root=Path("evidence/api_football/prospective_daily")/target
          completed=False
          if root.exists():
              for p in sorted(root.glob("*/cycle_summary.json")):
                  try:
                      d=json.loads(p.read_text(encoding="utf-8"))
                  except Exception:
                      continue
                  started=datetime.fromisoformat(d["started_at_utc"]).astimezone(bogota)
                  if (
                      d.get("status")=="PASS"
                      and d.get("target_date_bogota")==target
                      and started.date()==now.date()
                  ):
                      completed=True
                      break

          print("target_date="+target)
          print("skip="+("true" if completed else "false"))
          print("local_date="+now.date().isoformat())
          PY

      - name: Run governed prospective calendar cycle
        if: steps.target.outputs.skip != 'true'
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MATRIX_TARGET_DATE: ${{ steps.target.outputs.target_date }}
        run: |
          set -euo pipefail
          python -m tools.api_football_prospective_daily_cycle --target-date "$MATRIX_TARGET_DATE"

      - name: Report idempotent healthy skip
        if: steps.target.outputs.skip == 'true'
        run: |
          echo "API_FOOTBALL_DAILY_PRODUCTION: HEALTHY_SKIP_ALREADY_COMPLETED"
          echo "target_date_bogota=${{ steps.target.outputs.target_date }}"

      - name: Enforce cumulative freeze and PIT invariants
        shell: bash
        env:
          TARGET_DATE_RESOLVED: ${{ steps.target.outputs.target_date }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path

          root=Path("evidence/api_football")
          freeze=json.loads((root/"prospective_market_freeze/freeze.json").read_text())
          sync=json.loads((root/"prospective_market_freeze/incremental_sync_last.json").read_text())
          pre=int(os.environ["PRE_FREEZE_COUNT"])

          assert sync["existing_rows_unchanged"] is True
          assert sync["cumulative_event_count"] >= pre
          assert len(freeze["rows"]) == sync["cumulative_event_count"]
          assert len({str(r["fixture_id"]) for r in freeze["rows"]}) == len(freeze["rows"])
          assert freeze["protections"]["future_only"] is True
          assert freeze["protections"]["unseen_events_only"] is True
          assert freeze["protections"]["outcomes_read_at_freeze"] is False
          assert freeze["protections"]["odds_used_to_generate_probability"] is False
          assert freeze["protections"]["p_matrix_generated"] is False
          assert freeze["protections"]["automatic_wagering"] is False
          assert freeze["protections"]["real_money"]=="BLOCKED"

          new_ids=set(sync.get("new_fixture_ids") or [])
          by_id={str(r["fixture_id"]):r for r in freeze["rows"]}
          for fid in new_ids:
              row=by_id[fid]
              assert datetime.fromisoformat(row["freeze_at_utc"]) < datetime.fromisoformat(row["kickoff_utc"])
              assert row["outcome"] is None
              assert row["p_matrix"] is None
              source=Path(row["historical_baseline_source"])
              assert source.is_file(), (fid, source)

          daily_root=root/"prospective_daily"
          target=os.environ.get("TARGET_DATE_RESOLVED")
          summaries=sorted((daily_root/target).glob("*/cycle_summary.json"))
          assert summaries, target
          cycle=json.loads(summaries[-1].read_text())
          assert cycle["status"]=="PASS"
          assert cycle["real_money"]=="BLOCKED"
          assert cycle["automatic_wagering"] is False
          assert cycle["odds_used_to_generate_probability"] is False
          assert cycle["outcomes_used_to_generate_probability"] is False
          assert cycle["p_matrix_status"]=="NOT_GENERATED"
          assert cycle["canonical"]["p_matrix_status"]=="NOT_GENERATED"
          assert cycle["freeze"]["cumulative_event_count"]==len(freeze["rows"])
          assert cycle["network_calls_performed"] <= 161

          print("MATRIX_FOOTBALL_DAILY_PROSPECTIVE_GATE: PASS")
          print("pre_freeze_count=",pre)
          print("new_freezes=",sync["new_event_count"])
          print("cumulative_freezes=",sync["cumulative_event_count"])
          print("cycle_network_calls=",cycle["network_calls_performed"])
          print("target_date_bogota=",cycle["target_date_bogota"])
          PY

      - name: Persist immutable daily evidence and cumulative freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-daily-production"
          git config user.email "matrix-football-daily-production@users.noreply.github.com"
          git add evidence/api_football/prospective_daily
          git add evidence/api_football/prospective_market_freeze/freeze.json
          git add evidence/api_football/prospective_market_freeze/manifest.json 2>/dev/null || true
          git add evidence/api_football/prospective_market_freeze/incremental_sync_last.json
          if git diff --cached --quiet; then
            echo "NO_DAILY_PROSPECTIVE_MATERIAL_CHANGE"
            exit 0
          fi
          git commit -m "evidence(football): daily incremental prospective production"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
