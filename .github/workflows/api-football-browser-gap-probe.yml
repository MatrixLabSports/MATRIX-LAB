name: API Football Browser Gap Probe

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/api_football_browser_gap_probe.py
      - evidence/daily_source_counts/2026-10-06/MATRIX_IMMEDIATE_BROWSER_GAP_RECONCILIATION.json
      - .github/workflows/api-football-browser-gap-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Probe browser gaps
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m tools.api_football_browser_gap_probe
      - name: Validate physical result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/daily_source_counts/2026-10-06/MATRIX_API_FOOTBALL_BROWSER_GAP_PROBE.json")
          j=json.loads(p.read_text())
          assert j["status"] == "PASS"
          assert j["input_gap_count"] == 6
          assert j["network_calls"] >= 12
          assert j["protections"]["automatic_model_feed"] is False
          assert j["protections"]["real_money"] == "BLOCKED"
          print(json.dumps({
              "input_gap_count":j["input_gap_count"],
              "network_calls":j["network_calls"],
              "bound_fixture_count":j["bound_fixture_count"],
              "status":j["status"]
          }, sort_keys=True))
          PY
      - name: Persist result
        run: |
          git config user.name "matrix-gap-probe"
          git config user.email "matrix-gap-probe@users.noreply.github.com"
          git add evidence/daily_source_counts/2026-10-06/MATRIX_API_FOOTBALL_BROWSER_GAP_PROBE.json
          git commit -m "evidence(football): persist browser gap API binding probe"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
