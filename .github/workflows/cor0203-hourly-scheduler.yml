name: COR02-03 repo-native hourly scheduler

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cor0203-hourly-scheduler.yml
  schedule:
    # Two outer triggers per hour. Each scheduled run performs three governed
    # subcycles at 0/10/20 minutes, covering six acquisition opportunities per
    # hour without depending on six separate GitHub cron deliveries.
    - cron: "7,37 * * * *"
  workflow_run:
    workflows:
      - API-Football prospective settlement-calibration supervisor
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cor0203-holdout-repair-cor09-world-pipeline
  cancel-in-progress: false

jobs:
  trigger-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scheduler test dependency
        run: python -m pip install pytest

      - name: Verify governed tennis production protections
        run: |
          python -m pytest -q \
            tests/test_cor0203_bogota_full_day_calendar.py \
            tests/test_tennis_world_inventory_rapidapi.py \
            tests/test_tennis_world_inventory_accumulate.py \
            tests/test_cor0203_world_inventory_discovery.py \
            tests/test_cor0203_world_inventory_bridge.py \
            tests/test_cor0203_world_funnel_audit.py \
            tests/test_cor0203_rapidapi_durable_discovery.py \
            tests/test_cor0203_rapidapi_stats_rich_history_probe.py \
            tests/test_cor0203_dual_provider_reconcile.py \
            tests/test_cor0203_merge_prereg_results.py \
            tests/test_cor0203_shelbayh_alias_cert.py \
            tests/test_cor0203_preregister_discovery.py \
            tests/test_cor0203_expand_identity_authority.py \
            tests/test_cor0203_batch_preflight.py \
            tests/test_cor0203_physical_uniqueness.py \
            tests/test_cor0203_settlement_sync.py \
            tests/test_cor0203_historical_identity_reconcile.py \
            tests/test_cor0203_production_observability.py

      - name: Write governed scheduler heartbeat
        shell: bash
        run: |
          set -euo pipefail
          TARGET_HEAD="$(git rev-parse HEAD)"
          export TARGET_HEAD
          echo "TARGET_HEAD=$TARGET_HEAD" >> "$GITHUB_ENV"
          mkdir -p evidence/cor0203/runtime
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "schema": "MATRIX_COR0203_SCHEDULER_HEARTBEAT_V1",
              "emitted_at_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "scheduler": "GITHUB_ACTIONS_DEFAULT_BRANCH_CRON",
              "target_branch": "repair/cor09-world-pipeline",
              "target_head_before": os.environ["TARGET_HEAD"],
              "scheduler_run_id": os.environ.get("GITHUB_RUN_ID"),
              "scheduler_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "scheduler_event": os.environ.get("GITHUB_EVENT_NAME"),
              "purpose": "Trigger the governed COR02/COR03 production workflow without chat or browser dependency.",
              "real_money": "BLOCKED",
          }
          Path("evidence/cor0203/runtime/MATRIX_COR0203_SCHEDULER_HEARTBEAT.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify paid tennis API source state
        shell: bash
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${RAPIDAPI_TENNIS_KEY:-}" ]]; then
            echo "RAPIDAPI_TENNIS_KEY_NOT_CONFIGURED"
            exit 2
          fi
          echo "RAPIDAPI_TENNIS_CONFIGURED=true" >> "$GITHUB_ENV"
          echo "RAPIDAPI_TENNIS_PAID_SOURCE: CONFIGURED"
          if [[ -z "${API_TENNIS_KEY:-}" ]]; then
            echo "API_TENNIS_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::warning::API_TENNIS_KEY_NOT_CONFIGURED_SECOND_PAID_SOURCE_BLOCKED"
          else
            echo "API_TENNIS_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "API_TENNIS_PAID_SOURCE: CONFIGURED"
          fi

      - name: Record two-paid-source status in heartbeat
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=Path("evidence/cor0203/runtime/MATRIX_COR0203_SCHEDULER_HEARTBEAT.json")
          d=json.loads(p.read_text())
          rapid=os.environ.get("RAPIDAPI_TENNIS_CONFIGURED")=="true"
          api=os.environ.get("API_TENNIS_CONFIGURED")=="true"
          d["paid_sources"]={
              "rapidapi_tennis":{"configured":rapid,"role":"PRIMARY_DISCOVERY_AND_HISTORY"},
              "api_tennis":{"configured":api,"role":"SECONDARY_DISCOVERY_AND_STATS_RICH_VALIDATION"},
          }
          d["two_paid_sources_ready"]=bool(rapid and api)
          d["source_compliance_status"]=(
              "PASS_TWO_PAID_SOURCES"
              if rapid and api
              else "DEGRADED_SECOND_PAID_SOURCE_SECRET_MISSING"
          )
          d["real_money"]="BLOCKED"
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          print(d["source_compliance_status"])
          PY

      - name: Run governed autonomous production subcycles
        shell: bash
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
          MATRIX_TENNIS_PROVIDER: rapidapi_tennis
          MATRIX_TARGET_BRANCH: repair/cor09-world-pipeline
          MATRIX_GIT_USER_NAME: matrix-scheduler
          MATRIX_GIT_USER_EMAIL: matrix-scheduler@users.noreply.github.com
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            schedule)
              CYCLES=3
              INTERVAL_SECONDS=600
              ;;
            push)
              # Fast physical validation of the multi-cycle scheduler.
              CYCLES=2
              INTERVAL_SECONDS=60
              ;;
            workflow_run|workflow_dispatch)
              CYCLES=1
              INTERVAL_SECONDS=0
              ;;
            *)
              CYCLES=1
              INTERVAL_SECONDS=0
              ;;
          esac
          export CYCLES INTERVAL_SECONDS
          AUDIT_JSONL="/tmp/cor0203_scheduler_cycles.jsonl"
          : > "$AUDIT_JSONL"

          for cycle in $(seq 1 "$CYCLES"); do
            STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            HEAD_BEFORE="$(git rev-parse HEAD)"
            CURRENT_TRIGGER_SHA="$HEAD_BEFORE"
            bash scripts/cor0203_production_cycle.sh --trigger-sha "$CURRENT_TRIGGER_SHA"
            HEAD_AFTER="$(git rev-parse HEAD)"
            ENDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            export cycle STARTED_AT ENDED_AT HEAD_BEFORE HEAD_AFTER AUDIT_JSONL
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          runtime=Path("evidence/cor0203/runtime")
          obs=json.loads((runtime/"MATRIX_COR0203_PRODUCTION_OBSERVABILITY_LAST.json").read_text())
          row={
              "cycle_index":int(os.environ["cycle"]),
              "started_at_utc":os.environ["STARTED_AT"],
              "ended_at_utc":os.environ["ENDED_AT"],
              "head_before":os.environ["HEAD_BEFORE"],
              "head_after":os.environ["HEAD_AFTER"],
              "physical_frozen_rows":obs["holdout"]["physical_frozen_rows"],
              "unique_calibration_count":obs["holdout"]["unique_calibration_count"],
              "new_freezes":obs["cycle"]["new_freezes"],
              "integrity_result":obs["integrity"]["result"],
              "metrics_opened":obs["integrity"]["metrics_opened"],
              "outcomes_read":obs["integrity"]["outcomes_read"],
              "real_money":obs["governance"]["real_money"],
          }
          with Path(os.environ["AUDIT_JSONL"]).open("a",encoding="utf-8") as f:
              f.write(json.dumps(row,sort_keys=True)+"\n")
          PY
            if [[ "$cycle" -lt "$CYCLES" ]]; then
              sleep "$INTERVAL_SECONDS"
            fi
          done

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          rows=[
              json.loads(line)
              for line in Path("/tmp/cor0203_scheduler_cycles.jsonl").read_text().splitlines()
              if line.strip()
          ]
          assert len(rows)==int(os.environ["CYCLES"])
          assert all(row["integrity_result"]=="PASS" for row in rows)
          assert all(row["metrics_opened"] is False for row in rows)
          assert all(row["outcomes_read"]==0 for row in rows)
          assert all(row["real_money"]=="BLOCKED" for row in rows)
          out={
              "schema":"MATRIX_COR0203_SCHEDULER_CONTINUITY_AUDIT_V1",
              "scheduler_event":os.environ.get("GITHUB_EVENT_NAME"),
              "scheduler_run_id":os.environ.get("GITHUB_RUN_ID"),
              "scheduler_run_attempt":os.environ.get("GITHUB_RUN_ATTEMPT"),
              "configured_outer_schedule":["7,37 * * * *"],
              "scheduled_subcycles_per_outer_run":3,
              "scheduled_interval_seconds":600,
              "validation_subcycles_on_push":2,
              "validation_interval_seconds":60,
              "cycles_expected":int(os.environ["CYCLES"]),
              "cycles_completed":len(rows),
              "cycles":rows,
              "all_cycles_integrity_pass":True,
              "metrics_opened":False,
              "outcomes_read":0,
              "automatic_wagering":False,
              "real_money":"BLOCKED",
          }
          p=Path("evidence/cor0203/runtime/MATRIX_COR0203_SCHEDULER_CONTINUITY_LAST.json")
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps({
              "cycles_completed":len(rows),
              "first_unique":rows[0]["unique_calibration_count"],
              "last_unique":rows[-1]["unique_calibration_count"],
              "result":"PASS",
          },sort_keys=True))
          PY

          git config user.name "matrix-scheduler"
          git config user.email "matrix-scheduler@users.noreply.github.com"
          git add evidence/cor0203/runtime/MATRIX_COR0203_SCHEDULER_CONTINUITY_LAST.json
          git add evidence/cor0203/runtime/MATRIX_COR0203_SCHEDULER_HEARTBEAT.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "evidence(cor02-03): persist scheduler continuity audit"
            git pull --rebase origin repair/cor09-world-pipeline
            git push origin HEAD:repair/cor09-world-pipeline
          fi

