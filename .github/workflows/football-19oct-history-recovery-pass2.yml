name: MATRIX Football 19Oct History Recovery Pass2

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/football-19oct-history-recovery-pass2.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Safety gate
        run: |
          test "$REAL_MONEY" = "BLOCKED"
          test "$AUTO_BETTING" = "DISABLED"
      - name: Recover remaining team history from pass1 output
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.api_football_team_last_fallback import run_capture
          root=Path("evidence/api_football/prospective_daily/2026-10-19/20261019T005952Z")
          bench=json.loads((root/"team_last_fallback/benchmark_after_team_last.json").read_text())
          ready=json.loads((root/"team_last_fallback/history_readiness_after_team_last.json").read_text())
          out=root/"team_last_fallback_pass2"
          result=run_capture(
              api_key=os.environ["API_FOOTBALL_KEY"],
              benchmark=bench,
              readiness=ready,
              out_dir=out,
              max_requests=120,
              min_daily_remaining_reserve=1500,
          )
          print(json.dumps(result,sort_keys=True))
          PY
      - name: Persist recovery evidence
        run: |
          git config user.name matrix-football-history-recovery
          git config user.email matrix-football-history-recovery@users.noreply.github.com
          git add evidence/api_football/prospective_daily/2026-10-19/20261019T005952Z/team_last_fallback_pass2
          git commit -m "evidence(football): persist 19-Oct second history recovery pass" || exit 0
          git fetch origin repair/cor09-world-pipeline
          git rebase origin/repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
