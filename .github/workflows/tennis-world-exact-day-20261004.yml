name: Tennis World Exact Day 2026-10-04

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tennis-world-exact-day-20261004.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run exact-day dual-source tennis audit
        env:
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: |
          python -m tools.tennis_world_exact_day_dual_audit             --target-date-bogota 2026-10-04             --out evidence/tennis_world_inventory/2026-10-04/world_exact_day_dual_audit.json

      - name: Enforce exact-date protections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/tennis_world_inventory/2026-10-04/world_exact_day_dual_audit.json").read_text())
          assert p["target_date_bogota"]=="2026-10-04"
          assert p["window_bogota"]["start"].startswith("2026-10-04T00:00:00")
          assert p["window_bogota"]["end"].startswith("2026-10-04T23:59:59")
          assert p["automatic_model_feed"] is False
          assert p["metrics_opened"] is False
          assert p["automatic_wagering"] is False
          assert p["real_money"]=="BLOCKED"
          print("EXACT_DAY_TENNIS_AUDIT: PASS")
          PY

      - name: Persist evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-tennis-world-audit"
          git config user.email "matrix-tennis-world-audit@users.noreply.github.com"
          git add evidence/tennis_world_inventory/2026-10-04
          git commit -m "evidence(tennis): persist 2026-10-04 world exact-day inventory"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline

# explicit retrigger exact-day world audit 2026-10-04
