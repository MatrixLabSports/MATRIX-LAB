name: MATRIX Telegram Post-Expiry Offline Health

on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/telegram-post-expiry-health.yml
      - tools/telegram_post_expiry_health.py
      - tests/test_telegram_post_expiry_health.py
      - tests/test_telegram_paid_quote_expiry_guard.py
      - tools/telegram_green_signal_alerts.py

permissions:
  contents: read

concurrency:
  group: matrix-telegram-post-expiry-health-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  offline-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MATRIX_MODE: SHADOW
      REAL_MONEY: BLOCKED
      AUTO_BETTING: DISABLED
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test runner
        run: python -m pip install pytest
      - name: Test fail-closed post-expiry diagnosis
        run: PYTHONPATH=. python -m pytest -q tests/test_telegram_post_expiry_health.py tests/test_telegram_paid_quote_expiry_guard.py
      - name: Generate independent offline diagnosis
        run: PYTHONPATH=. python -m tools.telegram_post_expiry_health
      - name: Certify no calls and safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("evidence/notifications/telegram/MATRIX_TELEGRAM_POST_EXPIRY_HEALTH_LAST.json").read_text())
          assert j["paid_provider_calls"] == 0
          assert j["independent_provider_calls"] == 0
          assert j["telegram_delivery_certified"] is False
          assert j["real_money"] == "BLOCKED"
          assert j["automatic_wagering"] is False
          print("OFFLINE_HEALTH_CERTIFIED")
          PY
      - name: Preserve post-expiry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-telegram-post-expiry-offline-health
          path: evidence/notifications/telegram/MATRIX_TELEGRAM_POST_EXPIRY_HEALTH_LAST.json
          if-no-files-found: warn
          retention-days: 14
