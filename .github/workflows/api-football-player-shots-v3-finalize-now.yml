name: API-Football Player Shots v3 Finalize Now

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-player-shots-v3-finalize-now.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-football-player-shots-v3-finalize-now
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests pytest
      - name: Verify v3 source semantics
        run: python -m pytest -q tests/test_api_football_player_shots_lineup_role_v3.py
      - name: Complete lineup acquisition and build model
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m tools.api_football_player_shots_lineup_role_v3_batch
      - name: Finalize prospective state
        run: python -m tools.api_football_player_shots_v3_finalize
      - name: Enforce final governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("evidence/api_football/market_expansion/player_shots_lineup_role_v3")
          p=json.loads((root/"acquisition_progress.json").read_text())
          assert p["remaining_lineup_count"]==0
          assert p["status"]=="COMPLETE_MODEL_EVALUATED"
          m=json.loads((root/"model.json").read_text())
          d=json.loads((root/"dataset_manifest.json").read_text())
          s=json.loads(Path("evidence/api_football/player_shots_v3_prospective/state.json").read_text())
          assert d["historical_role_source"]=="/fixtures/lineups"
          assert d["prospective_role_source"]=="/fixtures/lineups"
          assert d["same_role_semantics_by_construction"] is True
          assert d["same_match_target_used_in_features"] is False
          assert m["internal_selection"]["final_validation_used_for_selection"] is False
          assert m["validation_used_for_parameter_tuning"] is False
          assert m["odds_used_to_generate_probability"] is False
          assert m["real_money"]=="BLOCKED"
          assert s["real_money"]=="BLOCKED"
          print("PLAYER_SHOTS_V3_FINAL_GOVERNANCE: PASS")
          PY
      - name: Persist final Player Shots v3 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-player-shots-v3-final"
          git config user.email "matrix-football-player-shots-v3-final@users.noreply.github.com"
          git add evidence/api_football/market_expansion/player_shots_lineup_role_v3
          git add evidence/api_football/player_shots_v3_prospective
          if git diff --cached --quiet; then
            echo "NO_PLAYER_SHOTS_V3_FINAL_CHANGE"
            exit 0
          fi
          git commit -m "evidence(football): finalize corrected Player Shots v3"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
