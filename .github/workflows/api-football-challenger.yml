name: API-Football challenger build with sealed holdout

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-challenger.yml

permissions:
  contents: write

jobs:
  challenger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Test challenger and holdout seal
        run: python -m pytest -q tests/test_api_football_build_challenger.py
      - name: Build challenger without reading holdout outcomes
        run: python -m tools.api_football_build_challenger
      - name: Enforce holdout seal and no silent promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("evidence/api_football/challenger/challenger_manifest.json").read_text())
          s=json.loads(Path("evidence/api_football/challenger/final_holdout_seal.json").read_text())
          assert m["holdout_outcomes_read"] is False
          assert m["holdout_metrics_computed"] is False
          assert m["holdout_status"]=="SEALED"
          assert all("outcome" not in r for r in s["rows"])
          assert m["governed_engine_promoted"] is False
          assert m["p_matrix_generated"] is False
          assert m["real_money"]=="BLOCKED"
          print("MATRIX_FOOTBALL_CHALLENGER_GATE: PASS")
          print("candidate_status=",m["candidate_status"])
          print("development_count=",m["development_count"])
          print("validation_count=",m["validation_count"])
          print("final_holdout_count=",m["final_holdout_count"])
          print("market_reports=",m["market_reports"])
          PY
      - name: Persist challenger evidence
        run: |
          git config user.name "matrix-football-challenger"
          git config user.email "matrix-football-challenger@users.noreply.github.com"
          git add evidence/api_football/challenger
          if git diff --cached --quiet; then
            echo NO_CHALLENGER_EVIDENCE_CHANGE
            exit 0
          fi
          git commit -m "evidence(football): persist challenger with sealed holdout"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
