name: MATRIX Global Strength Map

on:
  workflow_dispatch:
  schedule:
    - cron: "52 * * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/matrix-global-strength-map.yml

permissions:
  contents: write

concurrency:
  group: matrix-global-strength-map
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Verify strength-map governance
        run: python -m pytest -q tests/test_matrix_global_strength_map.py

      - name: Snapshot protected source hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum             evidence/api_football/prospective_market_freeze/freeze.json             evidence/api_football/prospective_calibration/ledger.jsonl             evidence/cor0203/runtime/MATRIX_COR0203_PHYSICAL_UNIQUENESS_LAST.json             evidence/cor0203/runtime/MATRIX_COR0203_MODEL_BINDING_R707.json             > /tmp/matrix_strength_sources_before.sha256

      - name: Build global strength map
        run: python -m tools.matrix_global_strength_map

      - name: Enforce no source mutation
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/matrix_strength_sources_before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/global_strength_map/strength_map.json").read_text())
          m=json.loads(Path("evidence/global_strength_map/manifest.json").read_text())
          assert p["status"]=="PASS"
          assert m["status"]=="PASS"
          protections=p["protections"]
          assert protections["read_only_evidence_aggregation"] is True
          assert protections["changes_p_matrix"] is False
          assert protections["changes_frozen_probabilities"] is False
          assert protections["changes_model_parameters"] is False
          assert protections["changes_discovery_eligibility"] is False
          assert protections["changes_bet_decision"] is False
          assert protections["opens_sealed_tennis_metrics"] is False
          assert protections["automatic_wagering"] is False
          assert protections["real_money"]=="BLOCKED"
          tennis=[x for x in p["cells"] if x["sport"]=="TENNIS"]
          assert tennis and all(x["strength_class"]=="INSUFFICIENT_DATA" for x in tennis)
          print("GLOBAL_STRENGTH_MAP_GOVERNANCE: PASS")
          PY

      - name: Persist strength map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-global-strength-map"
          git config user.email "matrix-global-strength-map@users.noreply.github.com"
          git add evidence/global_strength_map
          if git diff --cached --quiet; then
            echo "NO_STRENGTH_MAP_CHANGE"
            exit 0
          fi
          git commit -m "evidence(matrix): refresh global sport competition market strength map"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline

# explicit retrigger 2026-10-04 global strength map
