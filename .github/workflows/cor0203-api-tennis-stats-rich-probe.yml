name: COR02-03 API-Tennis retired source notice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: API-Tennis is retired
        run: |
          echo "API_TENNIS_STATUS=RETIRED_COST_UTILITY_DECISION"
          echo "API_TENNIS_SUBSCRIPTION=EXPIRED_NOT_RENEWED"
          echo "API_TENNIS_REQUIRED=false"
          echo "ACTIVE_PAID_PRIMARY=RAPIDAPI_TENNIS"
          echo "OPEN_CALENDAR_RECONCILIATION=SOFASCORE,FLASHSCORE"
          echo "REAL_MONEY=BLOCKED"
