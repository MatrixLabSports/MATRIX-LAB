name: API-Football Failed Team Markets v3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-failed-team-markets-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-football-failed-team-markets-v3
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Verify v3 protections
        run: python -m pytest -q tests/test_api_football_failed_team_markets_v3.py

      - name: Build independent v3 challengers
        run: python -m tools.api_football_failed_team_markets_v3

      - name: Enforce no silent promotion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("evidence/api_football/market_expansion/failed_team_markets_v3/summary.json").read_text())
          assert s["real_money"]=="BLOCKED"
          assert s["automatic_wagering"] is False
          for lane,row in s["lanes"].items():
              if row["prospective_eligible"]:
                  assert row["status"]=="FROZEN_FOR_NEW_PROSPECTIVE_VALIDATION_V3"
              else:
                  assert row["status"]=="REJECTED_HISTORICAL_OOS_V3"
          print("FAILED_TEAM_MARKETS_V3_GOVERNANCE: PASS")
          PY

      - name: Persist v3 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-team-v3"
          git config user.email "matrix-football-team-v3@users.noreply.github.com"
          git add evidence/api_football/market_expansion/failed_team_markets_v3
          git commit -m "evidence(football): persist independent failed-market v3 OOS"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline

