name: MATRIX Dixon-Coles Over2.5 Relevance Audit

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/matrix_dixon_coles_over25_relevance_audit.py
      - tests/test_matrix_dixon_coles_over25_relevance_audit.py
      - .github/workflows/matrix-dixon-coles-over25-relevance-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REAL_MONEY: BLOCKED
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run tests
        run: PYTHONPATH=. python -m pytest -q tests/test_matrix_dixon_coles_over25_relevance_audit.py
      - name: Run 2379-row physical audit
        run: PYTHONPATH=. python -m tools.matrix_dixon_coles_over25_relevance_audit
      - name: Enforce research-only governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/api_football/model_validation/MATRIX_DIXON_COLES_OVER25_RELEVANCE_AUDIT_V1.json")
          x=json.loads(p.read_text())
          assert x["row_count"]==2379
          assert x["finding"]=="LOW_SCORE_TAU_WITH_FIXED_LAMBDAS_DOES_NOT_CHANGE_OVER25"
          assert x["max_abs_over25_delta"] < 1e-12
          assert x["production_engine_modified"] is False
          assert x["parameter_tuning_allowed"] is False
          assert x["real_money"]=="BLOCKED"
          print("MATRIX_DIXON_COLES_OVER25_GATE: PASS")
          print("row_count=",x["row_count"])
          print("max_abs_over25_delta=",x["max_abs_over25_delta"])
          print("artifact_sha256=",x["artifact_sha256"])
          PY
      - name: Persist evidence
        run: |
          git config user.name matrix-dixon-coles-audit
          git config user.email matrix-dixon-coles-audit@users.noreply.github.com
          git add evidence/api_football/model_validation/MATRIX_DIXON_COLES_OVER25_RELEVANCE_AUDIT_V1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence(football): persist Dixon-Coles Over2.5 relevance audit"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
