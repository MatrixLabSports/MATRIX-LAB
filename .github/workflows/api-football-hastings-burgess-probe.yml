name: API Football Corrected Hastings Probe

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/api_football_hastings_burgess_probe.py
      - .github/workflows/api-football-hastings-burgess-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Probe corrected official fixture
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m tools.api_football_hastings_burgess_probe
      - name: Persist
        run: |
          git config user.name "matrix-gap-probe"
          git config user.email "matrix-gap-probe@users.noreply.github.com"
          git add evidence/daily_source_counts/2026-10-06/MATRIX_API_FOOTBALL_HASTINGS_BURGESS_PROBE.json
          git commit -m "evidence(football): persist corrected Hastings Burgess API probe"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
