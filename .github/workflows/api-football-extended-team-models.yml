name: API-Football extended team models

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-extended-team-models.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: api-football-extended-team-models
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run model gate tests
        run: python -m pytest -q tests/test_api_football_extended_team_models.py

      - name: Build historical OOS challengers
        run: python -m tools.api_football_extended_team_models

      - name: Enforce model governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/api_football/market_expansion/team_models/summary.json").read_text())
          assert p["policy"]["minimum_train"]==200
          assert p["policy"]["minimum_validation"]==50
          assert p["policy"]["line_selected_from_train_only"] is True
          assert p["policy"]["validation_tuning"] is False
          assert p["policy"]["odds_to_probability"] is False
          assert p["policy"]["prospective_gates"]==[30,50,100,200]
          assert p["automatic_wagering"] is False
          assert p["real_money"]=="BLOCKED"
          for lane,row in p["lanes"].items():
              assert row["train_count"]>=200
              assert row["validation_count"]>=50
          print("MATRIX_EXTENDED_TEAM_MODELS_GATE: PASS")
          PY

      - name: Persist model evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-extended-models"
          git config user.email "matrix-football-extended-models@users.noreply.github.com"
          git add evidence/api_football/market_expansion/team_models
          if git diff --cached --quiet; then
            echo "NO_MODEL_EVIDENCE_TO_PERSIST"
            exit 3
          fi
          git commit -m "evidence(football): persist extended team historical OOS models"
          git status --porcelain
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
