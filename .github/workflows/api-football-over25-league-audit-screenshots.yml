name: API-Football Over 2.5 League Audit Screenshots

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api-football-over25-league-audit-screenshots.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Audit screenshot leagues
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m tools.api_football_over25_league_audit_screenshots

      - name: Enforce audit governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/api_football/league_over25_audit/audit_last.json").read_text())
          assert p["status"]=="PASS"
          assert p["rules"]["standard_final_only"] is True
          assert p["automatic_wagering"] is False
          assert p["real_money"]=="BLOCKED"
          print("LEAGUE_OVER25_AUDIT: PASS")
          PY

      - name: Persist league audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-football-league-over25"
          git config user.email "matrix-football-league-over25@users.noreply.github.com"
          git add evidence/api_football/league_over25_audit
          git commit -m "evidence(football): persist league Over 2.5 audit"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline

