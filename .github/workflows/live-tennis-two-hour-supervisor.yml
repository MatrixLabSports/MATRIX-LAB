name: MATRIX Live Tennis Two-Hour Supervisor

on:
  schedule:
    # 01:09,03:09,...23:09 UTC = every 2 hours on the :09 cadence in Bogota.
    - cron: "9 1-23/2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/live-tennis-two-hour-supervisor.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: live-tennis-two-hour-supervisor
  cancel-in-progress: false

jobs:
  dispatch-operational-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch governed Live Tennis monitor on operational branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/live-tennis-reactivation-cumulative-gates.yml/dispatches" \
            -d '{"ref":"repair/cor09-world-pipeline"}')"
          echo "dispatch_http_status=$code"
          test "$code" = "204"
          echo "LIVE_TENNIS_OPERATIONAL_DISPATCH: PASS"

      - name: Record scheduler semantics
        shell: bash
        run: |
          echo "CADENCE=EVERY_2_HOURS"
          echo "TIMEZONE_POLICY=America/Bogota"
          echo "OPERATIONAL_REF=repair/cor09-world-pipeline"
          echo "FREE_PROVIDER=live_tennis_api"
          echo "PAID_FAILOVER=api_tennis"
          echo "REAL_MONEY=BLOCKED"
