name: Tennis World Rolling Horizon

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14,20 * * *"
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/tennis-world-rolling-horizon.yml
      - scripts/cor0203_production_cycle.sh
      - tools/tennis_world_exact_day_dual_audit.py
      - tools/tennis_world_inventory_rapidapi.py
      - tools/cor0203_api_tennis_discovery.py
      - tools/cor0203_rapidapi_tennis_discovery.py
      - tools/cor0203_eight_day_dual_discovery.py

permissions:
  contents: write

concurrency:
  group: cor0203-holdout-repair-cor09-world-pipeline
  cancel-in-progress: false

jobs:
  rolling-horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install governed dependencies
        run: python -m pip install pytest requests

      - name: Run tennis horizon regression suite
        run: |
          python -m pytest -q \
            tests/test_cor0203_bogota_full_day_calendar.py \
            tests/test_tennis_world_inventory_rapidapi.py \
            tests/test_cor0203_world_inventory_discovery.py \
            tests/test_cor0203_api_tennis_discovery.py \
            tests/test_cor0203_durable_discovery_recovery.py \
            tests/test_cor0203_preregister_discovery.py \
            tests/test_cor0203_physical_uniqueness.py

      - name: Record physical checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin repair/cor09-world-pipeline
          git checkout repair/cor09-world-pipeline
          git reset --hard origin/repair/cor09-world-pipeline
          echo "CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Require daily SofaScore and Flashscore browser crosscheck
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Bogota date +%F)"
          EVIDENCE="evidence/tennis_world_inventory/${TODAY}/MATRIX_DAILY_MULTISOURCE_BROWSER_CROSSCHECK.json"
          test -f "${EVIDENCE}" || {
            echo "DAILY_SOFASCORE_FLASHSCORE_CROSSCHECK_MISSING: ${EVIDENCE}"
            exit 1
          }
          python - "${EVIDENCE}" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1])
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["target_date_bogota"] == p.parent.name
          assert j["sources"]["sofascore"]["opera_read_status"] == "PASS"
          assert j["sources"]["flashscore"]["opera_read_status"] == "PASS"
          assert j["governance_basis"]["sofascore_flashscore_daily_crosscheck_required"] is True
          assert j["adjudication"]["paid_api_counts_are_not_world_complete"] is True
          assert j["protections"]["metrics_opened"] is False
          assert j["protections"]["real_money"] == "BLOCKED"
          print("DAILY_MULTISOURCE_BROWSER_CROSSCHECK: PASS")
          PY

      - name: Build and process D0 D1 D2 Bogotá horizon with both paid providers
        shell: bash
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
          MATRIX_TENNIS_PROVIDER: rapidapi_tennis
          MATRIX_TARGET_BRANCH: repair/cor09-world-pipeline
          MATRIX_GIT_USER_NAME: matrix-ci
          MATRIX_GIT_USER_EMAIL: matrix-ci@users.noreply.github.com
        run: |
          set -euo pipefail
          for OFFSET in 0 1 2; do
            TARGET_DATE="$(TZ=America/Bogota date -d "+${OFFSET} day" +%F)"
            echo "=== TENNIS_ROLLING_TARGET=${TARGET_DATE} ==="

            python -m tools.tennis_world_exact_day_dual_audit \
              --target-date-bogota "${TARGET_DATE}" \
              --out "evidence/tennis_world_inventory/${TARGET_DATE}/world_exact_day_dual_audit.json"

            MATRIX_WORLD_DATE_BOGOTA="${TARGET_DATE}" \
              bash scripts/cor0203_production_cycle.sh --trigger-sha "$(git rev-parse HEAD)"

            git fetch origin repair/cor09-world-pipeline
            git rebase origin/repair/cor09-world-pipeline || {
              git rebase --abort || true
              exit 1
            }
          done

      - name: Enforce physical horizon invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          u=json.loads(Path("evidence/cor0203/runtime/MATRIX_COR0203_PHYSICAL_UNIQUENESS_LAST.json").read_text())
          m=json.loads(Path("evidence/cor0203/runtime/MATRIX_COR0203_MILESTONES_LAST.json").read_text())
          assert u["result"] == "PASS"
          assert u["metrics_opened"] is False
          assert u["outcomes_read"] == 0
          assert m["metrics_opened"] is False
          assert m["real_money"] == "BLOCKED"
          print(json.dumps({
              "physical_frozen_rows":u["physical_frozen_rows"],
              "unique_calibration_observations":u["unique_calibration_observations"],
              "duplicates_quarantined":u["duplicate_observations_quarantined"],
              "remaining_to_200":u["unique_remaining_to_200"],
              "remaining_to_600":u["unique_remaining_to_600"],
              "metrics_opened":False,
              "real_money":"BLOCKED"
          }, sort_keys=True))
          PY

      - name: Persist exact-day dual audits when production made no material commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-ci"
          git config user.email "matrix-ci@users.noreply.github.com"
          git add evidence/tennis_world_inventory/*/world_exact_day_dual_audit.json || true
          if git diff --cached --quiet; then
            echo "NO_EXTRA_DUAL_AUDIT_CHANGE"
            exit 0
          fi
          git commit -m "evidence(tennis): persist rolling dual-paid-provider horizon"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
