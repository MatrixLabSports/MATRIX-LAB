name: Tennis World Rolling Horizon

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: tennis-world-rolling-horizon-d0-d7-v1
  cancel-in-progress: false

jobs:
  rolling-horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install governed dependencies
        run: python -m pip install pytest requests

      - name: Run tennis horizon regression suite
        run: |
          python -m pytest -q \
            tests/test_cor0203_bogota_full_day_calendar.py \
            tests/test_tennis_world_inventory_rapidapi.py \
            tests/test_cor0203_world_inventory_discovery.py \
            tests/test_cor0203_api_tennis_discovery.py \
            tests/test_cor0203_durable_discovery_recovery.py \
            tests/test_cor0203_preregister_discovery.py \
            tests/test_cor0203_world_inventory_discovery.py \
            tests/test_cor0203_api_tennis_certified_authority_recovery.py \
            tests/test_cor0203_physical_uniqueness.py \
            tests/test_cor0203_hard_302_to_400_policy.py

      - name: Record physical checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin repair/cor09-world-pipeline
          git checkout repair/cor09-world-pipeline
          git reset --hard origin/repair/cor09-world-pipeline
          echo "CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Require daily SofaScore and Flashscore browser crosscheck
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Bogota date +%F)"
          LEGACY="evidence/tennis_world_inventory/${TODAY}/MATRIX_DAILY_MULTISOURCE_BROWSER_CROSSCHECK.json"
          CANONICAL="evidence/tennis/MATRIX_TENNIS_${TODAY//-/}_BROWSER_FIRST_RECONCILIATION.json"
          if [ -f "$LEGACY" ]; then
            EVIDENCE="$LEGACY"
            MODE="LEGACY_DAILY_MULTISOURCE"
          elif [ -f "$CANONICAL" ]; then
            EVIDENCE="$CANONICAL"
            MODE="CANONICAL_BROWSER_FIRST"
          else
            echo "DAILY_SOFASCORE_FLASHSCORE_CROSSCHECK_MISSING: $LEGACY OR $CANONICAL"
            exit 1
          fi
          python - "$TODAY" "$EVIDENCE" "$MODE" <<'PY'
          import json, sys
          from pathlib import Path
          today,pth,mode=sys.argv[1:4]
          p=Path(pth)
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["target_date_bogota"] == today
          if mode=="LEGACY_DAILY_MULTISOURCE":
              assert j["sources"]["sofascore"]["opera_read_status"] == "PASS"
              assert j["sources"]["flashscore"]["opera_read_status"] == "PASS"
              assert j["governance_basis"]["sofascore_flashscore_daily_crosscheck_required"] is True
              assert j["adjudication"]["paid_api_counts_are_not_world_complete"] is True
          else:
              assert j["reconciliation"]["browser_first_gate"] == "PASS"
              assert "SofaScore" in j["source_order"]
              assert "Flashscore" in j["source_order"]
              assert j["source_order"].index("SofaScore") < j["source_order"].index("Flashscore")
          assert j["protections"]["metrics_opened"] is False
          assert j["protections"]["real_money"] == "BLOCKED"
          print("DAILY_MULTISOURCE_BROWSER_CROSSCHECK: PASS",mode,p)
          PY

      - name: Require autonomous exact calendar-first source-count report
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Bogota date +%F)"
          REPORT="evidence/daily_source_counts/${TODAY}/MATRIX_WORLD_CALENDAR_SOURCE_COUNTS.json"
          test -f "${REPORT}" || {
            echo "DAILY_WORLD_CALENDAR_SOURCE_COUNTS_MISSING: ${REPORT}"
            exit 1
          }
          python -m tools.matrix_daily_calendar_baseline_gate --report "${REPORT}"

      - name: Build D0-D7 horizon with D0-D2 production and D3-D7 shadow scouting
        shell: bash
        env:
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
          MATRIX_COR0203_STATS_RICH_PROBE: "0"
          MATRIX_TENNIS_PROVIDER: rapidapi_tennis
          MATRIX_TARGET_BRANCH: repair/cor09-world-pipeline
          MATRIX_GIT_USER_NAME: matrix-ci
          MATRIX_GIT_USER_EMAIL: matrix-ci@users.noreply.github.com
        run: |
          set -euo pipefail
          SCOUT_DIR="evidence/cor0203/horizon_scout"
          mkdir -p "$SCOUT_DIR"
          : > /tmp/matrix_d0_d7_scout_rows.jsonl

          for OFFSET in 0 1 2 3 4 5 6 7; do
            TARGET_DATE="$(TZ=America/Bogota date -d "+${OFFSET} day" +%F)"
            echo "=== TENNIS_ROLLING_TARGET=${TARGET_DATE} OFFSET=${OFFSET} ==="

            python -m tools.tennis_world_exact_day_dual_audit \
              --target-date-bogota "${TARGET_DATE}" \
              --out "evidence/tennis_world_inventory/${TARGET_DATE}/world_exact_day_dual_audit.json"

            if [ "$OFFSET" -le 2 ]; then
              MATRIX_WORLD_DATE_BOGOTA="${TARGET_DATE}" \
                bash scripts/cor0203_production_cycle.sh --trigger-sha "$(git rev-parse HEAD)"

              git fetch origin repair/cor09-world-pipeline
              git rebase origin/repair/cor09-world-pipeline || {
                git rebase --abort || true
                exit 1
              }
            else
              INVENTORY="evidence/tennis/world_inventory/${TARGET_DATE}/MATRIX_TENNIS_WORLD_INVENTORY.json"
              python -m tools.tennis_world_inventory_rapidapi \
                --target-date-bogota "${TARGET_DATE}" \
                --out "$INVENTORY" \
                --fail-on-partial

              python - "$OFFSET" "$TARGET_DATE" "$INVENTORY" <<'PY' >> /tmp/matrix_d0_d7_scout_rows.jsonl
          import json,sys
          from pathlib import Path
          offset=int(sys.argv[1]); target=sys.argv[2]; p=Path(sys.argv[3])
          j=json.loads(p.read_text())
          rows=[]
          for e in j.get("events") or []:
              d=e.get("model_derivation") or {}
              if d.get("lane")!="COR02_COR03_ATP_CHALLENGER_HARD" or d.get("domain_candidate") is not True:
                  continue
              rows.append({
                  "source_event_id":e.get("source_event_id"),
                  "match_id":str(e.get("match_id") or ""),
                  "tournament":e.get("tournament_name"),
                  "surface":e.get("surface"),
                  "round":e.get("round"),
                  "event_start_utc":e.get("event_start_utc"),
                  "player1":(e.get("player1") or {}).get("name"),
                  "player2":(e.get("player2") or {}).get("name"),
              })
          print(json.dumps({
              "offset":offset,
              "target_date_bogota":target,
              "provider_status":j.get("status"),
              "provider_network_calls":j.get("provider_network_calls",0),
              "hard_challenger_candidate_count":len(rows),
              "hard_challenger_candidates":rows,
              "admitted_to_holdout":False,
              "admission_reason":"D3_D7_SHADOW_ONLY_AWAITS_BROWSER_FIRST_AND_D0_D2_GOVERNED_PRODUCTION",
              "metrics_opened":False,
              "real_money":"BLOCKED"
          },sort_keys=True))
          PY
            fi
          done

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          rows=[json.loads(x) for x in Path("/tmp/matrix_d0_d7_scout_rows.jsonl").read_text().splitlines() if x.strip()]
          all_candidates=[c for r in rows for c in r["hard_challenger_candidates"]]
          out={
              "schema":"MATRIX_COR0203_D0_D7_HORIZON_SCOUT_V1",
              "generated_at_utc":datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "production_offsets":[0,1,2],
              "shadow_scout_offsets":[3,4,5,6,7],
              "shadow_days":rows,
              "shadow_hard_challenger_candidate_count":len(all_candidates),
              "shadow_candidate_source_event_ids":sorted({
                  str(c.get("source_event_id") or "") for c in all_candidates if c.get("source_event_id")
              }),
              "browser_first_required_before_holdout_admission":True,
              "d3_d7_admitted_to_holdout":False,
              "metrics_opened":False,
              "outcomes_read_for_metrics":0,
              "automatic_wagering":False,
              "real_money":"BLOCKED"
          }
          dest=Path("evidence/cor0203/horizon_scout/MATRIX_COR0203_D0_D7_HORIZON_SCOUT_LAST.json")
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "shadow_hard_challenger_candidate_count":out["shadow_hard_challenger_candidate_count"],
              "shadow_candidate_source_event_ids":out["shadow_candidate_source_event_ids"],
              "real_money":out["real_money"]
          },sort_keys=True))
          PY

      - name: Enforce physical horizon invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          u=json.loads(Path("evidence/cor0203/runtime/MATRIX_COR0203_PHYSICAL_UNIQUENESS_LAST.json").read_text())
          m=json.loads(Path("evidence/cor0203/runtime/MATRIX_COR0203_MILESTONES_LAST.json").read_text())
          assert u["result"] == "PASS"
          assert u["metrics_opened"] is False
          assert u["outcomes_read"] == 0
          assert m["metrics_opened"] is False
          assert m["real_money"] == "BLOCKED"
          print(json.dumps({
              "physical_frozen_rows":u["physical_frozen_rows"],
              "unique_calibration_observations":u["unique_calibration_observations"],
              "duplicates_quarantined":u["duplicate_observations_quarantined"],
              "remaining_to_200":u["unique_remaining_to_200"],
              "remaining_to_600":u["unique_remaining_to_600"],
              "metrics_opened":False,
              "real_money":"BLOCKED"
          }, sort_keys=True))
          PY

      - name: Persist exact-day dual audits when production made no material commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-ci"
          git config user.email "matrix-ci@users.noreply.github.com"
          git add evidence/tennis_world_inventory/*/world_exact_day_dual_audit.json || true
          git add evidence/tennis/world_inventory/*/MATRIX_TENNIS_WORLD_INVENTORY.json || true
          git add evidence/cor0203/horizon_scout/MATRIX_COR0203_D0_D7_HORIZON_SCOUT_LAST.json || true
          if git diff --cached --quiet; then
            echo "NO_EXTRA_DUAL_AUDIT_CHANGE"
            exit 0
          fi
          git commit -m "evidence(tennis): persist rolling dual-paid-provider horizon"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
