name: MATRIX Paid API Utilization Watchdog

on:
  schedule:
    - cron: "25 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/paid-api-utilization-watchdog.yml

permissions:
  contents: write

concurrency:
  group: matrix-paid-api-utilization-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify utilization watchdog
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_paid_api_utilization_watchdog.py tests/test_tennis_subscription_deadline_guard.py tests/test_football_subscription_deadline_guard.py
          python -m tools.paid_api_utilization_watchdog --fail-on-underutilization
      - name: Persist utilization evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-paid-api-watchdog
          git config user.email matrix-paid-api-watchdog@users.noreply.github.com
          git add evidence/governance/MATRIX_PAID_API_UTILIZATION_WATCHDOG_LAST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence(governance): persist paid API utilization watchdog"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              sleep $((attempt*2))
              continue
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
