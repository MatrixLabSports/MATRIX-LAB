name: MATRIX CI Auto Dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/matrix-ci-auto-dispatch.yml
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
  workflow_run:
    workflows:
      - "API-Football market expansion live probe"
      - "API-Football prospective settlement-calibration supervisor"
      - "COR02-03 repo-native hourly scheduler"
      - "API-Football Player Shots v3 Supervisor"
      - "API-Football Player Shots Lineup Role v3"
    types:
      - completed

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: matrix-ci-auto-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'pull_request_target' || github.event.pull_request.head.ref == 'repair/cor09-world-pipeline') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 1

      - name: Resolve operational HEAD
        id: head
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "MATRIX_OPERATIONAL_HEAD=$SHA"

      - name: Check whether exact-SHA CI already passed or is running
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.head.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/matrix-ci.yml/runs?branch=repair%2Fcor09-world-pipeline&event=workflow_dispatch&per_page=50" \
            > /tmp/matrix_ci_runs.json
          EXPECTED_SHA="${EXPECTED_SHA}" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          runs=json.load(open("/tmp/matrix_ci_runs.json",encoding="utf-8")).get("workflow_runs",[])
          sha=os.environ["EXPECTED_SHA"]
          matched=[
              r for r in runs
              if r.get("head_sha")==sha
              and (
                  r.get("status") in {"queued","in_progress"}
                  or r.get("conclusion")=="success"
              )
          ]
          print("skip="+("true" if matched else "false"))
          print("matched_run_id="+(str(matched[0]["id"]) if matched else ""))
          PY

      - name: Report already validated or running
        if: ${{ steps.prior.outputs.skip == 'true' }}
        run: |
          echo "MATRIX_CI_ALREADY_VERIFIED_OR_RUNNING"
          echo "head=${{ steps.head.outputs.sha }}"
          echo "run_id=${{ steps.prior.outputs.matched_run_id }}"

      - name: Dispatch MATRIX CI on exact operational SHA
        if: ${{ steps.prior.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.head.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="{\"ref\":\"repair/cor09-world-pipeline\",\"inputs\":{\"expected_sha\":\"${EXPECTED_SHA}\"}}"
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/matrix-ci.yml/dispatches" \
            --data "${PAYLOAD}"
          echo "MATRIX_CI_DISPATCHED_EXPECTED_SHA=${EXPECTED_SHA}"
