name: MATRIX Colombia 239 Original Exact 356 Feature Parity
on:
  workflow_dispatch:
  push:
    branches: [repair/cor09-world-pipeline]
    paths:
      - .github/workflows/matrix-colombia-239-original-feature-parity.yml
      - tools/matrix_colombia_239_original_feature_input_parity.py
      - tests/test_matrix_colombia_239_original_feature_input_parity.py
permissions:
  contents: write
concurrency:
  group: matrix-colombia-239-exact-356-original-feature-parity
  cancel-in-progress: false
jobs:
  exact-goals-feature-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REAL_MONEY: BLOCKED
      AUTOMATIC_WAGERING: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/matrix_colombia_239_original_feature_input_parity.py
            tools/matrix_colombia_239_original_espn_historic_crosswalk.py
            tools/api_football_market_shadow_p_matrix.py
            tools/api_football_canonicalize_analysis_inputs.py
            tests/test_matrix_colombia_239_original_feature_input_parity.py
            evidence/api_football/prospective_daily/2026-10-28/20261028T054128Z/history/raw/league_239_season_2026.bin
            evidence/football_world_inventory/2026-11-22/MATRIX_COLOMBIA_239_FULLSEASON_GOAL_PARITY_RUN_45089678156.json
            evidence/football_world_inventory/2026-11-22/MATRIX_COLOMBIA_239_HISTORIC_CROSSWALK_RUN_45088819586.json
            evidence/football_world_inventory/2026-11-22/MATRIX_COLOMBIA_239_ORIGINAL_FORMULA_SHADOW_RUN_45089678156.json
            evidence/football_world_inventory/2026-11-22/sources/ESPN_COL_239_FULLSEASON_RAW_RUN_45089678156.json.gz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify point-in-time source hash and original frozen formula parity
        run: |
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=. python -m pytest -q tests/test_matrix_colombia_239_original_feature_input_parity.py
      - name: Rebuild original vs ESPN exact 356 feature matrix and quantify 2 kickoff conflicts
        shell: bash
        run: |
          set -euo pipefail
          OUT="evidence/football_world_inventory/2026-11-22/MATRIX_COL_239_ORIGINAL_356_INPUT_PARITY_RUN_${{ github.run_id }}.json"
          PYTHONPATH=. python -m tools.matrix_colombia_239_original_feature_input_parity \
            --original evidence/api_football/prospective_daily/2026-10-28/20261028T054128Z/history/raw/league_239_season_2026.bin \
            --espn-gz evidence/football_world_inventory/2026-11-22/sources/ESPN_COL_239_FULLSEASON_RAW_RUN_45089678156.json.gz \
            --parity evidence/football_world_inventory/2026-11-22/MATRIX_COLOMBIA_239_FULLSEASON_GOAL_PARITY_RUN_45089678156.json \
            --crosswalk evidence/football_world_inventory/2026-11-22/MATRIX_COLOMBIA_239_HISTORIC_CROSSWALK_RUN_45088819586.json \
            --shadow evidence/football_world_inventory/2026-11-22/MATRIX_COLOMBIA_239_ORIGINAL_FORMULA_SHADOW_RUN_45089678156.json \
            --out "$OUT"
          python - "$OUT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["verified_exact_common_finished_fixtures"]==356
          assert d["target_count"]==4
          assert d["quarantined_kickoff_discrepancies"]==2
          assert d["raw_goals_input_parity_within_exact_common_subset"] is True
          assert d["all_enriched_source_features_certified"] is False
          assert d["production_p_matrix_authorized"] is False
          assert d["telegram_signal_authorized"] is False
          print("COL_239_REAL_ORIGINAL_ESPN_EXACT_356_GOAL_INPUT_PARITY_ONLY")
          PY
      - name: Persist real input comparison without ever promoting source equivalence
        shell: bash
        run: |
          set -euo pipefail
          OUT="evidence/football_world_inventory/2026-11-22/MATRIX_COL_239_ORIGINAL_356_INPUT_PARITY_RUN_${{ github.run_id }}.json"
          git config user.name matrix-original-input-parity
          git config user.email matrix-original-input-parity@users.noreply.github.com
          git add --sparse -- "$OUT"
          git commit -m "evidence(colombia): original vs ESPN 356 source-identical goal feature inputs for four future research targets"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:repair/cor09-world-pipeline; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
