name: Tennis World Exact Day 2026-10-10 API Audit

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/tennis-world-exact-day-20261010-audit.yml

permissions:
  contents: write

concurrency:
  group: tennis-world-exact-day-20261010-api-audit
  cancel-in-progress: false

jobs:
  exact-day-api-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install governed dependencies
        run: python -m pip install requests pytest

      - name: Verify browser-first source order
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/operations/MATRIX_10OCT_BROWSER_FIRST_CROSSCHECK_STATUS.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["target_date_bogota"]=="2026-10-10"
          assert j["source_order_check"]["sofascore_checked_first"] is True
          assert j["source_order_check"]["flashscore_checked_second"] is True
          assert j["sofa_score"]["tennis"]["visible_full_day_reference_count"]==275
          assert j["flashscore"]["tennis"]["status"]=="DATE_SELECTOR_STALE_BLOCKED"
          assert j["protections"]["real_money"]=="BLOCKED"
          print("BROWSER_FIRST_SOURCE_ORDER: PASS; FLASHSCORE_10OCT_STALE_BLOCK_RETAINED")
          PY

      - name: Capture both paid tennis providers for 10 Oct
        shell: bash
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
        run: |
          set -euo pipefail
          python -m tools.tennis_world_exact_day_dual_audit \
            --target-date-bogota 2026-10-10 \
            --out evidence/tennis_world_inventory/2026-10-10/world_exact_day_dual_audit.json

      - name: Verify fail-closed audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/tennis_world_inventory/2026-10-10/world_exact_day_dual_audit.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["target_date_bogota"]=="2026-10-10"
          assert j["status"]=="PASS_PROVIDER_CAPTURE_WORLD_UNSEALED"
          assert j["metrics_opened"] is False
          assert j["real_money"]=="BLOCKED"
          print(json.dumps({
            "rapidapi_tennis":j["primary_world_inventory"]["unique_match_count"],
            "api_tennis":j["secondary_crosscheck"]["unique_match_count"],
            "paid_union":j["cross_provider_reconciliation"]["exact_union_count"],
            "metrics_opened":False,
            "real_money":"BLOCKED"
          },sort_keys=True))
          PY

      - name: Persist exact-day provider audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name matrix-ci
          git config user.email matrix-ci@users.noreply.github.com
          git add evidence/tennis_world_inventory/2026-10-10/world_exact_day_dual_audit.json
          if git diff --cached --quiet; then
            echo "NO_AUDIT_CHANGE"
            exit 0
          fi
          git commit -m "evidence(tennis): capture 10OCT dual paid-provider audit"
          for attempt in 1 2 3 4; do
            git fetch origin repair/cor09-world-pipeline
            if ! git rebase origin/repair/cor09-world-pipeline; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:repair/cor09-world-pipeline; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
