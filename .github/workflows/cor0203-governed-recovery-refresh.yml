name: MATRIX COR02-03 Governed Recovery Refresh

on:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/cor0203-governed-recovery-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cor0203-governed-recovery-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MATRIX_TENNIS_MODE: rapidapi_primary_open_reconciliation
      MATRIX_TARGET_BRANCH: repair/cor09-world-pipeline
      MATRIX_GIT_USER_NAME: matrix-cor0203-recovery
      MATRIX_GIT_USER_EMAIL: matrix-cor0203-recovery@users.noreply.github.com
      REAL_MONEY: BLOCKED
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install requests

      - name: Verify safety and governed rollover
        shell: bash
        run: |
          set -euo pipefail
          test "$REAL_MONEY" = "BLOCKED"
          echo "TARGET_WORLD_DATE=$(python -m tools.cor0203_world_date_rollover)"

      - name: Run canonical COR02 COR03 production cycle
        env:
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cor0203_production_cycle.sh --trigger-sha "$(git rev-parse HEAD)"
