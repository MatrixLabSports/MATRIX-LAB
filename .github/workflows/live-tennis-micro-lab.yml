name: Live Tennis Micro Laboratory

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - tools/live_tennis_micro_lab.py
      - .github/workflows/live-tennis-micro-lab.yml

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Capture six live score snapshots
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVETENNISAPI_KEY }}
        run: python -m tools.live_tennis_micro_lab
      - name: Persist micro-lab evidence
        run: |
          git config user.name "matrix-live-tennis-lab"
          git config user.email "matrix-live-tennis-lab@users.noreply.github.com"
          git add evidence/live_tennis_lab/2026-10-06/MATRIX_LIVE_TENNIS_MICRO_LAB_200549.json
          git commit -m "evidence(live): persist tennis micro laboratory"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
