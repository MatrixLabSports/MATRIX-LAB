name: COR02-03 sealed R706 target history audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cor0203-r706-target-history-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cor0203-holdout-repair-cor09-world-pipeline
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: repair/cor09-world-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Verify history audit logic
        run: python -m pytest -q tests/test_cor0203_r706_target_history_audit.py

      - name: Audit sealed R706 state
        run: python -m tools.cor0203_r706_target_history_audit

      - name: Enforce immutability and sealed metrics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/cor0203/runtime/MATRIX_COR0203_R706_TARGET_HISTORY_READINESS_LAST.json")
          d=json.loads(p.read_text())
          assert d["state_mutated"] is False
          assert d["metrics_opened"] is False
          assert d["outcomes_read"] == 0
          assert d["real_money"] == "BLOCKED"
          assert len(d["targets"]) == 2
          print("MATRIX_COR0203_R706_TARGET_HISTORY_AUDIT: PASS")
          PY

      - name: Persist history readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-cor0203-r706-audit"
          git config user.email "matrix-cor0203-r706-audit@users.noreply.github.com"
          git add evidence/cor0203/runtime/MATRIX_COR0203_R706_TARGET_HISTORY_READINESS_LAST.json
          if git diff --cached --quiet; then
            echo "NO_AUDIT_EVIDENCE_CHANGE"
            exit 0
          fi
          git commit -m "evidence(cor02-03): audit blocked-player sealed R706 history"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
