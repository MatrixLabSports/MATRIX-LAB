name: API-Football TEAM_TOTAL_SHOTS live odds probe

on:
  workflow_dispatch:
  push:
    branches:
      - repair/cor09-world-pipeline
    paths:
      - .github/workflows/api-football-team-total-shots-odds-probe.yml
      - tools/api_football_team_total_shots_odds_probe.py

permissions:
  contents: write

concurrency:
  group: api-football-team-total-shots-odds-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install provider dependency
        run: python -m pip install requests
      - name: Require API-Football secret
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}"
          python - <<'PY'
          import os
          os.environ["API_FOOTBALL_KEY"].encode("ascii")
          print("API_FOOTBALL_KEY_PRESENT_AND_ASCII")
          PY
      - name: Probe exact canonical TEAM_TOTAL_SHOTS ids
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          python -m tools.api_football_team_total_shots_odds_probe
      - name: Assert no premature prospective start
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("evidence/api_football/market_expansion/team_total_shots_odds_probe/last_run.json").read_text())
          assert p["prospective_freeze_started"] is False
          assert p["gates_started"] is False
          assert p["real_money"] == "BLOCKED"
          print("TEAM_TOTAL_SHOTS_PREMATURE_START_GUARD=PASS")
          PY
      - name: Persist physical odds evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matrix-team-total-shots-probe"
          git config user.email "matrix-team-total-shots-probe@users.noreply.github.com"
          git add evidence/api_football/market_expansion/team_total_shots_odds_probe
          if git diff --cached --quiet; then
            echo "NO_TEAM_TOTAL_SHOTS_PROBE_EVIDENCE"
            exit 3
          fi
          git commit -m "evidence(football): persist TEAM_TOTAL_SHOTS live odds probe"
          git pull --rebase origin repair/cor09-world-pipeline
          git push origin HEAD:repair/cor09-world-pipeline
